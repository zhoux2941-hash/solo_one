<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主刀端 - 远程手术协作系统</title>
  <link rel="stylesheet" href="styles/common.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">📹 视频设置</div>
        <div class="input-group">
          <label>摄像头</label>
          <select id="cameraSelect"></select>
        </div>
        <div class="input-group">
          <label>分辨率</label>
          <select id="resolutionSelect">
            <option value="3840x2160">4K (3840x2160)</option>
            <option value="1920x1080" selected>1080p (1920x1080)</option>
            <option value="1280x720">720p (1280x720)</option>
          </select>
        </div>
        <div class="input-group">
          <label>帧率</label>
          <select id="fpsSelect">
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </div>
        <div class="input-group">
          <label>目标比特率</label>
          <select id="bitrateSelect">
            <option value="4000000">4 Mbps (低带宽)</option>
            <option value="8000000" selected>8 Mbps (标准)</option>
            <option value="12000000">12 Mbps (高质量)</option>
            <option value="15000000">15 Mbps (最高质量)</option>
          </select>
        </div>
        <div class="input-group">
          <label>带宽自适应</label>
          <select id="adaptiveBitrateSelect">
            <option value="true" selected>开启 (推荐)</option>
            <option value="false">关闭</option>
          </select>
        </div>
        <div class="input-group">
          <label>智能分辨率</label>
          <select id="adaptiveResolutionSelect">
            <option value="true" selected>开启 (静止高清/运动降质)</option>
            <option value="false">关闭 (固定分辨率)</option>
          </select>
        </div>
        <div class="input-group">
          <label>运动阈值</label>
          <input type="range" id="motionThreshold" min="1" max="30" value="5" style="width: 100%;">
          <small style="color: #888;">低阈值更灵敏，高阈值更稳定</small>
        </div>
        <div id="motionStatus" class="status-item" style="margin-top: 0.5rem; padding: 0.5rem; background: rgba(0,0,0,0.3); border-radius: 4px;">
          <span style="color: #888;">运动检测: </span>
          <span id="motionLevel">--</span>
          <span style="color: #888; margin-left: 1rem;">分辨率: </span>
          <span id="currentResolutionName">--</span>
        </div>
        <button id="startCameraBtn" class="btn btn-primary" style="width: 100%;">
          🎥 开启摄像头
        </button>
      </div>

      <div class="panel">
        <div class="panel-title">🔗 连接设置</div>
        <div class="input-group">
          <label>房间号</label>
          <input type="text" id="roomId" readonly placeholder="等待生成...">
        </div>
        <button id="createRoomBtn" class="btn btn-success" style="width: 100%; margin-bottom: 0.5rem;">
          🆕 创建房间
        </button>
        <div class="status-item">
          <span class="status-dot" id="connectionDot"></span>
          <span id="connectionStatus">未连接</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">📊 性能统计</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="latencyValue">--</div>
            <div class="stat-label">端到端延迟</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="syncValue">--</div>
            <div class="stat-label">同步误差</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="bitrateValue">--</div>
            <div class="stat-label">比特率</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="fpsValue">--</div>
            <div class="stat-label">帧率</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">🎤 语音通话</div>
        <div class="audio-indicator">
          <div class="audio-bars" id="audioIndicator">
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
          </div>
          <span id="audioStatus">未开启</span>
        </div>
        <button id="toggleAudioBtn" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;">
          🔊 开启语音
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="video-container">
        <div class="video-wrapper">
          <video id="localVideo" autoplay muted playsinline></video>
          <canvas id="annotationCanvas" class="annotation-canvas"></canvas>
        </div>
      </div>
      
      <div class="control-bar">
        <div class="status-bar">
          <div class="status-item">
            <span>👨‍⚕️ 主刀端</span>
          </div>
          <div class="status-item">
            <span id="videoResolution">--</span>
          </div>
          <div class="status-item">
            <span id="annotationCount">标注: 0</span>
          </div>
        </div>
        <div class="controls">
          <button id="clearAnnotationsBtn" class="btn btn-secondary">
            🗑️ 清除标注
          </button>
          <button id="toggleVideoBtn" class="btn btn-danger">
            ⏹️ 停止视频
          </button>
          <button onclick="window.location.href='index.html'" class="btn btn-secondary">
            🏠 返回首页
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/surgeon.js"></script>
</body>
</html>

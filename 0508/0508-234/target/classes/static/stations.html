<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驿站管理 - 社区驿站管理平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🏪 驿站管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span>📊 控制台</span>
                </a>
                <a href="users.html" class="nav-item" id="nav-users">
                    <span>👥 用户管理</span>
                </a>
                <a href="stations.html" class="nav-item active">
                    <span>🏠 驿站管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <span class="user-name">加载中...</span>
                    <span class="user-role"></span>
                </div>
                <button class="btn btn-logout" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>驿站管理</h1>
                <button class="btn btn-primary" onclick="openStationModal()">+ 添加驿站</button>
            </header>

            <div class="content-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索驿站名称..." onkeyup="searchStations()">
                    <button class="btn btn-secondary" onclick="searchStations()">搜索</button>
                </div>
            </div>

            <div class="content-section">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>驿站名称</th>
                                <th>地址</th>
                                <th>服务范围</th>
                                <th>营业时间</th>
                                <th>管辖社区</th>
                                <th>联系电话</th>
                                <th>负责人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="stationTableBody">
                        </tbody>
                    </table>
                    <div id="stationPagination" class="pagination-container">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="stationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加驿站</h3>
                <span class="close" onclick="closeStationModal()">&times;</span>
            </div>
            <form id="stationForm">
                <input type="hidden" id="stationId">
                <div class="form-row">
                    <div class="form-group">
                        <label>驿站名称</label>
                        <input type="text" id="formStationName" required>
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="text" id="formContactPhone">
                    </div>
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <input type="text" id="formAddress" required>
                </div>
                <div class="form-group">
                    <label>服务范围</label>
                    <input type="text" id="formServiceScope">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>营业时间</label>
                        <input type="text" id="formBusinessHours">
                    </div>
                    <div class="form-group">
                        <label>管辖社区</label>
                        <input type="text" id="formGoverningCommunity">
                    </div>
                </div>
                <div class="form-group">
                    <label>负责人</label>
                    <input type="text" id="formManager">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="formDescription" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeStationModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/stations.js"></script>
</body>
</html>

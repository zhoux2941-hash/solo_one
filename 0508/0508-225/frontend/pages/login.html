<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 景区运营管理平台</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1 class="login-title">🏞️ 景区运营管理平台</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" id="username" class="form-input" placeholder="请输入用户名" autocomplete="off">
                    <div id="username_error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" id="password" class="form-input" placeholder="请输入密码">
                    <div id="password_error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary login-btn">登 录</button>
                </div>
            </form>
            <p style="text-align: center; color: #909399; font-size: 12px; margin-top: 20px;">
                默认账号：admin / admin123
            </p>
        </div>
    </div>

    <script src="../js/auth/auth.js"></script>
    <script src="../js/utils/request.js"></script>
    <script src="../js/utils/validator.js"></script>
    <script src="../js/utils/common.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = Common.getFormData('loginForm');
            
            const schema = {
                username: [{ rule: 'required', message: '请输入用户名' }],
                password: [{ rule: 'required', message: '请输入密码' }]
            };
            
            const { isValid, errors } = Validator.validateForm(formData, schema);
            
            Validator.clearAllErrors();
            if (!isValid) {
                for (const field in errors) {
                    Validator.showError(field, errors[field]);
                }
                return;
            }

            Auth.login(formData.username, formData.password)
                .then(res => {
                    if (res.code === 200) {
                        Common.showToast('登录成功');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        Common.showToast(res.message, 'error');
                    }
                })
                .catch(err => {
                    Common.showToast(err.message || '登录失败', 'error');
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古风文玩手串私人定制系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', serif;
            background: linear-gradient(135deg, #f5f5dc 0%, #d4a574 100%);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(to right, #8B4513, #A0522D);
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .nav {
            background: #654321;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav button {
            background: #8B4513;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .nav button:hover {
            background: #A0522D;
            transform: translateY(-2px);
        }

        .nav button.active {
            background: #CD853F;
            box-shadow: 0 0 10px rgba(205, 133, 63, 0.5);
        }

        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 14px;
        }

        .user-info button {
            background: #CD853F;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .page h2 {
            color: #8B4513;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #CD853F;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #DEB887;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            color: #8B4513;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .card .price {
            color: #CD853F;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .card .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #8B4513;
            color: #fff;
        }

        .btn-primary:hover {
            background: #A0522D;
        }

        .btn-secondary {
            background: #CD853F;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #DEB887;
        }

        .btn-success {
            background: #228B22;
            color: #fff;
        }

        .btn-danger {
            background: #DC143C;
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #8B4513;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #DEB887;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #8B4513;
            margin-bottom: 20px;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-pending {
            background: #FFD700;
            color: #333;
        }

        .badge-approved {
            background: #228B22;
            color: #fff;
        }

        .badge-rejected {
            background: #DC143C;
            color: #fff;
        }

        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .login-container h2 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #DEB887;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #666;
        }

        .tab.active {
            border-bottom-color: #8B4513;
            color: #8B4513;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-PENDING_CONFIRM { background: #FFD700; color: #333; }
        .status-CONFIRMED { background: #4169E1; color: #fff; }
        .status-IN_PRODUCTION { background: #FF8C00; color: #fff; }
        .status-COMPLETED { background: #228B22; color: #fff; }
        .status-DELIVERED { background: #9932CC; color: #fff; }
        .status-CANCELLED { background: #DC143C; color: #fff; }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 8px;
            border: 1px solid #DEB887;
            border-radius: 4px;
        }

        .category-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #DEB887;
            color: #8B4513;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 5px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏮 古风文玩手串私人定制系统 🏮</h1>
        <div id="userInfo" class="user-info" style="display: none;">
            <span id="usernameDisplay"></span>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>

    <div id="loginPage" class="login-container">
        <h2>用户登录</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchLoginTab('login')">登录</div>
            <div class="tab" onclick="switchLoginTab('register')">注册</div>
        </div>

        <div id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">登录</button>
        </div>

        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>真实姓名</label>
                <input type="text" id="regRealName" placeholder="请输入真实姓名">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>用户类型</label>
                <select id="regRole">
                    <option value="CUSTOMER">普通客户</option>
                    <option value="CRAFTSMAN">手作匠人</option>
                </select>
            </div>
            <div id="craftsmanFields" style="display: none;">
                <div class="form-group">
                    <label>个人简介</label>
                    <textarea id="regProfile" placeholder="请介绍您的串珠经验和特长"></textarea>
                </div>
                <div class="form-group">
                    <label>技能特长</label>
                    <input type="text" id="regSkills" placeholder="例如：菩提根打磨、玉石雕刻、流苏制作">
                </div>
                <div class="form-group">
                    <label>从业年限</label>
                    <input type="number" id="regExperience" placeholder="请输入从业年限">
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="register()">注册</button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="nav" id="navBar">
        </div>

        <div class="container">
            <div id="homePage" class="page active">
                <h2>📊 系统概览</h2>
                <div class="stats-row">
                    <div class="stat-card">
                        <h3 id="statMaterials">0</h3>
                        <p>原材料种类</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statProducts">0</h3>
                        <p>作品展示</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statCraftsmen">0</h3>
                        <p>认证匠人</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statOrders">0</h3>
                        <p>订单总数</p>
                    </div>
                </div>
                <h3>✨ 精选作品</h3>
                <div id="featuredProducts" class="card-grid">
                </div>
            </div>

            <div id="materialsPage" class="page">
                <h2>🎨 原材料库</h2>
                <div class="filter-bar">
                    <select id="materialCategoryFilter" onchange="loadMaterials()">
                        <option value="">全部类别</option>
                        <option value="BODHI_SEED">菩提子类</option>
                        <option value="JADE">玉石类</option>
                        <option value="WOOD">木质类</option>
                        <option value="METAL">金属隔片</option>
                        <option value="TASSLE">流苏配饰</option>
                        <option value="CORD">绳线类</option>
                        <option value="BEAD">配珠类</option>
                    </select>
                    <input type="text" id="materialSearch" placeholder="搜索材料名称..." onkeyup="searchMaterials()">
                    <button id="addMaterialBtn" class="btn btn-primary" onclick="showMaterialModal()" style="display: none;">+ 添加材料</button>
                </div>
                <div id="materialsList" class="card-grid">
                </div>
            </div>

            <div id="productsPage" class="page">
                <h2>💎 作品展示</h2>
                <div class="filter-bar">
                    <select id="productStyleFilter" onchange="loadProducts()">
                        <option value="">全部风格</option>
                        <option value="ANCIENT_STYLE">古风</option>
                        <option value="MODERN_STYLE">现代风</option>
                        <option value="ETHNIC_STYLE">民族风</option>
                        <option value="MINIMALIST">极简风</option>
                        <option value="LUXURY">奢华风</option>
                    </select>
                    <button id="addProductBtn" class="btn btn-primary" onclick="showProductModal()" style="display: none;">+ 发布作品</button>
                </div>
                <div id="productsList" class="card-grid">
                </div>
            </div>

            <div id="craftsmenPage" class="page">
                <h2>👨‍🎨 匠人列表</h2>
                <div id="craftsmenList" class="card-grid">
                </div>
            </div>

            <div id="ordersPage" class="page">
                <h2>📝 订单管理</h2>
                <div class="filter-bar">
                    <select id="orderStatusFilter" onchange="loadOrders()">
                        <option value="">全部状态</option>
                        <option value="PENDING_CONFIRM">待确认</option>
                        <option value="CONFIRMED">已确认</option>
                        <option value="IN_PRODUCTION">制作中</option>
                        <option value="COMPLETED">已完成</option>
                        <option value="DELIVERED">已交付</option>
                        <option value="CANCELLED">已取消</option>
                    </select>
                    <button id="createOrderBtn" class="btn btn-primary" onclick="showOrderModal()">+ 创建定制</button>
                </div>
                <div id="ordersList" class="card-grid">
                </div>
            </div>

            <div id="adminPage" class="page">
                <h2>⚙️ 管理后台</h2>
                <h3>待审核匠人</h3>
                <div id="pendingCraftsmen" class="card-grid" style="margin-bottom: 30px;">
                </div>
                <h3>定价方案管理</h3>
                <div id="pricingSection" style="display: none;">
                    <button class="btn btn-primary" onclick="showPricingModal()" style="margin-bottom: 15px;">+ 添加定价方案</button>
                    <div id="pricingList" class="card-grid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="materialModal" class="modal">
        <div class="modal-content">
            <h3 id="materialModalTitle">添加原材料</h3>
            <input type="hidden" id="materialId">
            <div class="form-group">
                <label>材料名称</label>
                <input type="text" id="materialName" placeholder="请输入材料名称">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>类别</label>
                    <select id="materialCategory">
                        <option value="BODHI_SEED">菩提子类</option>
                        <option value="JADE">玉石类</option>
                        <option value="WOOD">木质类</option>
                        <option value="METAL">金属隔片</option>
                        <option value="TASSLE">流苏配饰</option>
                        <option value="CORD">绳线类</option>
                        <option value="BEAD">配珠类</option>
                        <option value="OTHER">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>材质</label>
                    <input type="text" id="materialMaterial" placeholder="例如：白玉菩提">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>规格尺寸</label>
                    <input type="text" id="materialSize" placeholder="例如：12mm圆珠">
                </div>
                <div class="form-group">
                    <label>参考价格</label>
                    <input type="number" step="0.01" id="materialPrice" placeholder="请输入单价">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>库存数量</label>
                    <input type="number" id="materialStock" placeholder="请输入库存数量">
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <input type="text" id="materialUnit" placeholder="例如：颗、条、个">
                </div>
            </div>
            <div class="form-group">
                <label>产地</label>
                <input type="text" id="materialOrigin" placeholder="请输入产地">
            </div>
            <div class="form-group">
                <label>纹路特点</label>
                <textarea id="materialPattern" placeholder="请描述纹路特点"></textarea>
            </div>
            <div class="form-group">
                <label>详细描述</label>
                <textarea id="materialDesc" placeholder="请输入详细描述"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeMaterialModal()">取消</button>
                <button class="btn btn-primary" onclick="saveMaterial()">保存</button>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="productModalTitle">发布作品</h3>
            <input type="hidden" id="productId">
            <div class="form-group">
                <label>作品名称</label>
                <input type="text" id="productName" placeholder="请输入作品名称">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>风格</label>
                    <select id="productStyle">
                        <option value="ANCIENT_STYLE">古风</option>
                        <option value="MODERN_STYLE">现代风</option>
                        <option value="ETHNIC_STYLE">民族风</option>
                        <option value="MINIMALIST">极简风</option>
                        <option value="LUXURY">奢华风</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>价格</label>
                    <input type="number" step="0.01" id="productPrice" placeholder="请输入价格">
                </div>
            </div>
            <div class="form-group">
                <label>材料清单</label>
                <textarea id="productMaterials" placeholder="请列出使用的材料"></textarea>
            </div>
            <div class="form-group">
                <label>作品描述</label>
                <textarea id="productDesc" placeholder="请详细描述作品特点"></textarea>
            </div>
            <div class="form-group">
                <label>是否发布</label>
                <select id="productPublished">
                    <option value="true">发布</option>
                    <option value="false">保存草稿</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeProductModal()">取消</button>
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>创建定制订单</h3>
            <div class="form-group">
                <label>手串名称</label>
                <input type="text" id="orderName" placeholder="请给您的定制手串起个名字">
            </div>
            <div class="form-group">
                <label>定制要求</label>
                <textarea id="orderRequirements" placeholder="请详细描述您的定制需求，包括样式、材质偏好、尺寸等"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="text" id="orderPhone" placeholder="请输入联系电话">
                </div>
                <div class="form-group">
                    <label>收货地址</label>
                    <input type="text" id="orderAddress" placeholder="请输入收货地址">
                </div>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="orderRemark" placeholder="其他备注信息"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeOrderModal()">取消</button>
                <button class="btn btn-primary" onclick="submitOrder()">提交定制</button>
            </div>
        </div>
    </div>

    <div id="orderDetailModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3>订单详情</h3>
            <div id="orderDetailContent">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeOrderDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <div id="pricingModal" class="modal">
        <div class="modal-content">
            <h3>添加定价方案</h3>
            <input type="hidden" id="pricingId">
            <div class="form-group">
                <label>方案名称</label>
                <input type="text" id="pricingName" placeholder="例如：基础款定制、高端定制">
            </div>
            <div class="form-group">
                <label>定价类型</label>
                <select id="pricingType">
                    <option value="PERCENTAGE">材料百分比</option>
                    <option value="FIXED">固定手工费</option>
                    <option value="TIERED">阶梯定价</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>基础价格</label>
                    <input type="number" step="0.01" id="pricingBasePrice" placeholder="基础价格">
                </div>
                <div class="form-group">
                    <label>手工费百分比</label>
                    <input type="number" step="0.01" id="pricingPercentage" placeholder="例如：30表示30%">
                </div>
            </div>
            <div class="form-group">
                <label>固定手工费</label>
                <input type="number" step="0.01" id="pricingFixedCost" placeholder="选择固定定价时使用">
            </div>
            <div class="form-group">
                <label>方案描述</label>
                <textarea id="pricingDesc" placeholder="请描述该定价方案的适用范围"></textarea>
            </div>
            <div class="form-group">
                <label>设为默认</label>
                <select id="pricingDefault">
                    <option value="false">否</option>
                    <option value="true">是</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closePricingModal()">取消</button>
                <button class="btn btn-primary" onclick="savePricing()">保存</button>
            </div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 白板协作系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <div class="room-controls">
        <button id="createRoomBtn" class="btn btn-primary">创建房间</button>
        <input type="text" id="roomIdInput" placeholder="输入房间ID" class="input">
        <button id="joinRoomBtn" class="btn btn-secondary">加入房间</button>
        <span id="currentRoom" class="room-info"></span>
      </div>
      
      <div class="draw-controls">
        <select id="toolSelect" class="select">
          <option value="pen">画笔</option>
          <option value="rectangle">矩形</option>
          <option value="circle">圆形</option>
        </select>
        
        <select id="brushShapeSelect" class="select small">
          <option value="round">● 圆头</option>
          <option value="square">■ 方头</option>
          <option value="butt">▬ 平头</option>
        </select>
        
        <input type="color" id="colorPicker" value="#000000" class="color-picker">
        
        <label class="control-label">粗细</label>
        <input type="range" id="sizeSlider" min="1" max="20" value="3" class="slider">
        <span id="sizeValue" class="size-value">3px</span>
        
        <label class="control-label">透明度</label>
        <input type="range" id="opacitySlider" min="10" max="100" value="100" class="slider">
        <span id="opacityValue" class="size-value">100%</span>
        
        <button id="clearBtn" class="btn btn-danger">清空画布</button>
      </div>
      
      <div class="brush-settings">
        <label class="checkbox-label">
          <input type="checkbox" id="pressureToggle" checked>
          <span>压感</span>
        </label>
        
        <label class="control-label">灵敏度</label>
        <input type="range" id="pressureSlider" min="10" max="100" value="50" class="slider small">
        <span id="pressureValue" class="size-value">50%</span>
      </div>
      
      <div class="user-info">
        <span id="userCount">用户: 1</span>
      </div>
    </div>
    
    <div class="canvas-container">
      <canvas id="whiteboard"></canvas>
    </div>
    
    <div id="statusBar" class="status-bar">
      <span id="connectionStatus">未连接</span>
      <span id="latency">延迟: --</span>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

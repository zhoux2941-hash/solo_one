server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-parking-platform
  
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/smart_parking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  level:
    com.smartparking: debug
    org.hibernate.SQL: debug

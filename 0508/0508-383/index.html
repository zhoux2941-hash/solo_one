<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学公式手写识别</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>数学公式手写识别</h1>
      <p>在画板上书写数学表达式，系统将自动识别并转换为LaTeX</p>
    </header>

    <div class="main-content">
      <div class="canvas-section">
        <div class="canvas-wrapper">
          <canvas id="drawingCanvas"></canvas>
        </div>
        
        <div class="canvas-controls">
          <button id="clearBtn" class="btn btn-secondary">清空画板</button>
          <button id="undoBtn" class="btn btn-secondary">撤销</button>
          <button id="redoBtn" class="btn btn-secondary">重做</button>
          <button id="recognizeBtn" class="btn btn-primary">识别当前符号</button>
          <button id="recognizeAllBtn" class="btn btn-success">识别全部</button>
        </div>
      </div>

      <div class="results-section">
       <div class="section">
          <h2>识别结果</h2>
          <div id="recognizedSymbols" class="symbols-list"></div>
        </div>

        <div id="suggestions" class="section suggestions-section"></div>

        <div class="section">
          <h2>LaTeX代码</h2>
          <div class="latex-container">
            <textarea id="latexOutput" readonly></textarea>
            <button id="copyBtn" class="btn btn-outline">复制代码</button>
            <button id="exportBtn" class="btn btn-outline">导出</button>
          </div>
        </div>

        <div class="section">
          <h2>公式预览</h2>
          <div id="formulaPreview" class="formula-preview"></div>
        </div>

        <div class="section">
          <h2>候选符号</h2>
          <div id="candidates" class="candidates-list"></div>
        </div>
      </div>
    </div>

    <div class="symbol-palette">
      <h3>快捷符号</h3>
      <div class="palette-grid">
        <button class="symbol-btn" data-symbol="x">x</button>
        <button class="symbol-btn" data-symbol="y">y</button>
        <button class="symbol-btn" data-symbol="z">z</button>
        <button class="symbol-btn" data-symbol="+">+</button>
        <button class="symbol-btn" data-symbol="-">-</button>
        <button class="symbol-btn" data-symbol="=">=</button>
        <button class="symbol-btn" data-symbol="times">×</button>
        <button class="symbol-btn" data-symbol="div">÷</button>
        <button class="symbol-btn" data-symbol="sqrt">√</button>
        <button class="symbol-btn" data-symbol="frac">分</button>
        <button class="symbol-btn" data-symbol="^">^</button>
        <button class="symbol-btn" data-symbol="_">_</button>
        <button class="symbol-btn" data-symbol="(">(</button>
        <button class="symbol-btn" data-symbol=")">)</button>
        <button class="symbol-btn" data-symbol="[">[</button>
        <button class="symbol-btn" data-symbol="]">]</button>
        <button class="symbol-btn" data-symbol="sum">∑</button>
        <button class="symbol-btn" data-symbol="int">∫</button>
        <button class="symbol-btn" data-symbol="pi">π</button>
        <button class="symbol-btn" data-symbol="inf">∞</button>
      </div>
    </div>
  </div>

  <script src="symbols.js"></script>
  <script src="recognizer.js"></script>
  <script src="app.js"></script>
</body>
</html>

server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: equipment-management

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/equipment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: admin
    password: Military@2024

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.military.equipment.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

jwt:
  secret: MilitaryEquipmentManagementSystemSecretKey2024ForSecurity
  expiration: 86400000

rate-limit:
  enabled: true
  default-limit: 100
  default-time-window: 60000

logging:
  level:
    com.military.equipment: DEBUG

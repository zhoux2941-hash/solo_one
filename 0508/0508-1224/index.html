<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斐波那契数列可视化</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>斐波那契数列可视化</h1>
        </header>
        <div class="controls">
            <input type="number" id="input-n" min="1" max="40" value="5">
            <button id="btn-calculate">计算</button>
            <button id="btn-play">播放</button>
            <button id="btn-pause">暂停</button>
            <button id="btn-reset">重置</button>
            <button id="btn-export-png">导出PNG</button>
            <button id="btn-export-svg">导出SVG</button>
            <label for="speed-range">速度:</label>
            <input type="range" id="speed-range" min="1" max="10" value="5">
            <span id="speed-value">5x</span>
        </div>
        <div class="main-content">
            <div class="left-panel">
                <div id="result">F(5) = 5</div>
                <div id="comparison"></div>
                <div id="duplicates"></div>
            </div>
            <div class="right-panel">
                <svg id="tree-svg"></svg>
            </div>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/algorithms.js"></script>
    <script src="js/treeBuilder.js"></script>
    <script src="js/treeRenderer.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/exporter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市防洪泵站远程监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .nav-btn:not(.active) {
            background: #f0f0f0;
            color: #333;
        }
        
        .nav-btn:hover:not(.active) {
            background: #e0e0e0;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }
        
        .pump-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 25px;
            transition: transform 0.3s;
        }
        
        .pump-card:hover {
            transform: translateY(-5px);
        }
        
        .pump-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .pump-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-running {
            background: #d4edda;
            color: #155724;
        }
        
        .status-stopped {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
        
        .water-level-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .water-level-title {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .water-level-value {
            font-size: 36px;
            font-weight: 700;
        }
        
        .thresholds {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
        }
        
        .control-buttons {
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-start {
            background: #28a745;
            color: white;
        }
        
        .btn-start:hover:not(:disabled) {
            background: #218838;
        }
        
        .btn-stop {
            background: #dc3545;
            color: white;
        }
        
        .btn-stop:hover:not(:disabled) {
            background: #c82333;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .simulation-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        
        .simulation-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .simulation-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .water-level-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn-simulate {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-simulate:hover {
            opacity: 0.9;
        }
        
        .stats-overview {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 市防洪泵站远程监控系统</h1>
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="showPage('monitoring')">实时监控</button>
                <button class="nav-btn" onclick="showPage('reports')">报表分析</button>
            </div>
        </div>
        
        <div id="monitoring-page" class="page active">
            <div class="stats-overview">
                <div class="stat-item">
                    <div class="stat-label">泵站总数</div>
                    <div class="stat-value" id="total-pumps">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">运行中</div>
                    <div class="stat-value" id="running-pumps">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">总排水量 (m³)</div>
                    <div class="stat-value" id="total-drainage">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">总能耗 (kWh)</div>
                    <div class="stat-value" id="total-energy">-</div>
                </div>
            </div>
            
            <div class="dashboard" id="pump-dashboard">
                <div class="loading">加载中...</div>
            </div>
        </div>
        
        <div id="reports-page" class="page">
            <div class="pump-card" style="grid-column: 1 / -1;">
                <div class="pump-header">
                    <div class="pump-title">📊 报表分析中心</div>
                </div>
                <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div>
                        <label style="margin-right: 10px; font-weight: 600;">选择泵站:</label>
                        <select id="report-pump-select" style="padding: 8px 15px; border-radius: 5px; border: 1px solid #ddd;">
                        </select>
                    </div>
                    <div>
                        <label style="margin-right: 10px; font-weight: 600;">年份:</label>
                        <select id="report-year" style="padding: 8px 15px; border-radius: 5px; border: 1px solid #ddd;">
                        </select>
                    </div>
                    <div>
                        <label style="margin-right: 10px; font-weight: 600;">月份:</label>
                        <select id="report-month" style="padding: 8px 15px; border-radius: 5px; border: 1px solid #ddd;">
                        </select>
                    </div>
                    <button onclick="loadReport()" class="btn-simulate">生成报表</button>
                </div>
                
                <div id="report-results" style="display: none;">
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px;">
                        <div class="info-item">
                            <div class="info-label">月排水量</div>
                            <div class="info-value" id="report-drainage">-</div>
                            <div style="font-size: 12px; color: #666;">立方米</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">月能耗</div>
                            <div class="info-value" id="report-energy">-</div>
                            <div style="font-size: 12px; color: #666;">千瓦时</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">运行时长</div>
                            <div class="info-value" id="report-duration">-</div>
                            <div style="font-size: 12px; color: #666;">分钟</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">平均效率</div>
                            <div class="info-value" id="report-efficiency">-</div>
                            <div style="font-size: 12px; color: #666;">立方米/kWh</div>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                        <div>
                            <h3 style="margin-bottom: 15px; color: #333;">效率趋势图</h3>
                            <canvas id="efficiency-chart" height="250"></canvas>
                        </div>
                        <div>
                            <h3 style="margin-bottom: 15px; color: #333;">运行记录</h3>
                            <div id="operation-records" style="max-height: 300px; overflow-y: auto;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080/api';
        let pumpData = [];
        let efficiencyChart = null;
        
        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(pageName + '-page').classList.add('active');
            event.target.classList.add('active');
            
            if (pageName === 'reports') {
                initReportPage();
            }
        }
        
        async function loadPumpData() {
            try {
                const response = await fetch(`${API_BASE}/pumps`);
                pumpData = await response.json();
                renderDashboard();
                updateStats();
            } catch (error) {
                console.error('加载泵站数据失败:', error);
            }
        }
        
        function renderDashboard() {
            const dashboard = document.getElementById('pump-dashboard');
            dashboard.innerHTML = pumpData.map(pump => `
                <div class="pump-card">
                    <div class="pump-header">
                        <div class="pump-title">🔧 ${pump.pumpNo}</div>
                        <span class="status-badge ${pump.isRunning ? 'status-running' : 'status-stopped'}">
                            ${pump.isRunning ? '运行中' : '已停止'}
                        </span>
                    </div>
                    
                    <div class="water-level-display">
                        <div class="water-level-title">当前水位</div>
                        <div class="water-level-value">${(pump.currentWaterLevel || 0).toFixed(2)} m</div>
                        <div class="thresholds">
                            <span>停泵: ${pump.stopWaterLevel || 0}m</span>
                            <span>启泵: ${pump.startWaterLevel || 0}m</span>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">功率</div>
                            <div class="info-value">${pump.power || 0} kW</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">累计排水量</div>
                            <div class="info-value">${(pump.totalDrainage || 0).toFixed(1)} m³</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">累计能耗</div>
                            <div class="info-value">${(pump.totalEnergyConsumption || 0).toFixed(2)} kWh</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">运行次数</div>
                            <div class="info-value">${pump.operationCount || 0}</div>
                        </div>
                    </div>
                    
                    <div class="control-buttons">
                        <button class="control-btn btn-start" 
                                onclick="controlPump('${pump.pumpNo}', 'start')"
                                ${pump.isRunning ? 'disabled' : ''}>
                            ▶ 启动水泵
                        </button>
                        <button class="control-btn btn-stop" 
                                onclick="controlPump('${pump.pumpNo}', 'stop')"
                                ${!pump.isRunning ? 'disabled' : ''}>
                            ⏹ 停止水泵
                        </button>
                    </div>
                    
                    <div class="simulation-section">
                        <div class="simulation-title">📡 模拟水位传感器上报</div>
                        <div class="simulation-controls">
                            <input type="number" step="0.1" 
                                   id="water-level-${pump.pumpNo}" 
                                   class="water-level-input"
                                   placeholder="输入水位值 (米)"
                                   value="${pump.currentWaterLevel || 0}">
                            <button class="btn-simulate" onclick="simulateWaterLevel('${pump.pumpNo}')">
                                上报
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('total-pumps').textContent = pumpData.length;
            document.getElementById('running-pumps').textContent = pumpData.filter(p => p.isRunning).length;
            document.getElementById('total-drainage').textContent = 
                pumpData.reduce((sum, p) => sum + (p.totalDrainage || 0), 0).toFixed(1);
            document.getElementById('total-energy').textContent = 
                pumpData.reduce((sum, p) => sum + (p.totalEnergyConsumption || 0), 0).toFixed(2);
        }
        
        async function controlPump(pumpNo, action) {
            try {
                const response = await fetch(`${API_BASE}/pumps/${pumpNo}/${action}`, {
                    method: 'POST'
                });
                if (response.ok) {
                    alert(action === 'start' ? '水泵启动成功！' : '水泵停止成功！');
                    loadPumpData();
                }
            } catch (error) {
                console.error('控制水泵失败:', error);
                alert('操作失败！');
            }
        }
        
        async function simulateWaterLevel(pumpNo) {
            const waterLevel = parseFloat(document.getElementById(`water-level-${pumpNo}`).value);
            if (isNaN(waterLevel)) {
                alert('请输入有效的水位值！');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/pumps/${pumpNo}/water-level`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ waterLevel })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    const statusText = result.isRunning ? '（水泵已自动启动）' : '（水泵已自动停止）';
                    alert(`水位上报成功！${result.isRunning || pumpData.find(p => p.pumpNo === pumpNo)?.isRunning ? statusText : ''}`);
                    loadPumpData();
                }
            } catch (error) {
                console.error('水位上报失败:', error);
                alert('上报失败！');
            }
        }
        
        function initReportPage() {
            const pumpSelect = document.getElementById('report-pump-select');
            const yearSelect = document.getElementById('report-year');
            const monthSelect = document.getElementById('report-month');
            
            pumpSelect.innerHTML = pumpData.map(p => 
                `<option value="${p.pumpNo}">${p.pumpNo}</option>`
            ).join('');
            
            const currentYear = new Date().getFullYear();
            yearSelect.innerHTML = Array.from({length: 5}, (_, i) => 
                `<option value="${currentYear - i}" ${i === 0 ? 'selected' : ''}>${currentYear - i}</option>`
            ).join('');
            
            monthSelect.innerHTML = Array.from({length: 12}, (_, i) => 
                `<option value="${i + 1}" ${i + 1 === new Date().getMonth() + 1 ? 'selected' : ''}>${i + 1}月</option>`
            ).join('');
        }
        
        async function loadReport() {
            const pumpNo = document.getElementById('report-pump-select').value;
            const year = parseInt(document.getElementById('report-year').value);
            const month = parseInt(document.getElementById('report-month').value);
            
            try {
                const [reportResponse, trendResponse, recordsResponse] = await Promise.all([
                    fetch(`${API_BASE}/reports/pump/${pumpNo}/monthly?year=${year}&month=${month}`),
                    fetch(`${API_BASE}/reports/pump/${pumpNo}/efficiency-trend?months=6`),
                    fetch(`${API_BASE}/pumps/${pumpNo}/operations`)
                ]);
                
                const report = await reportResponse.json();
                const trend = await trendResponse.json();
                const records = await recordsResponse.json();
                
                document.getElementById('report-results').style.display = 'block';
                document.getElementById('report-drainage').textContent = (report.totalDrainage || 0).toFixed(1);
                document.getElementById('report-energy').textContent = (report.totalEnergyConsumption || 0).toFixed(2);
                document.getElementById('report-duration').textContent = report.totalRunningMinutes || 0;
                document.getElementById('report-efficiency').textContent = (report.averageEfficiency || 0).toFixed(3);
                
                renderEfficiencyChart(trend);
                renderOperationRecords(records);
            } catch (error) {
                console.error('加载报表失败:', error);
                alert('加载报表失败！');
            }
        }
        
        function renderEfficiencyChart(trendData) {
            const ctx = document.getElementById('efficiency-chart').getContext('2d');
            
            if (efficiencyChart) {
                efficiencyChart.destroy();
            }
            
            efficiencyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trendData.map(d => `${d.year}-${d.month}`),
                    datasets: [{
                        label: '泵效率 (m³/kWh)',
                        data: trendData.map(d => d.efficiency || 0),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
        
        function renderOperationRecords(records) {
            const container = document.getElementById('operation-records');
            const completeRecords = records.filter(r => r.operationType === 'COMPLETE');
            
            if (completeRecords.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无运行记录</p>';
                return;
            }
            
            container.innerHTML = completeRecords.slice(0, 10).map(r => `
                <div style="padding: 10px; border-bottom: 1px solid #eee; font-size: 13px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="font-weight: 600;">${r.startTime ? new Date(r.startTime).toLocaleDateString() : '-'}</span>
                        <span style="color: #667eea;">${r.runningDuration || 0} 分钟</span>
                    </div>
                    <div style="color: #666; margin-top: 5px;">
                        排水量: ${(r.drainageAmount || 0).toFixed(1)} m³ | 
                        能耗: ${(r.energyConsumption || 0).toFixed(2)} kWh |
                        效率: ${(r.pumpEfficiency || 0).toFixed(3)}
                    </div>
                </div>
            `).join('');
        }
        
        loadPumpData();
        setInterval(loadPumpData, 30000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM视频处理器 - 人脸模糊与背景替换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #8892b0;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        .video-container {
            background: #0f0f23;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #fps-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            color: #00ff88;
            z-index: 10;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            background: #0f0f23;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .controls h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #00d4ff;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #8892b0;
            font-size: 0.9em;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .toggle-switch span {
            font-size: 0.95em;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .slider-wrapper {
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            cursor: pointer;
        }

        .range-value {
            text-align: center;
            margin-top: 8px;
            font-family: monospace;
            color: #00d4ff;
        }

        .color-picker-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .color-preset {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .file-upload {
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
        }

        .file-upload input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #2a2a4a;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }

        .resolution-select {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95em;
            cursor: pointer;
        }

        .resolution-select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .status-info {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
            font-size: 0.85em;
            color: #8892b0;
        }

        .status-info p {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .status-info span:last-child {
            color: #00ff88;
            font-family: monospace;
        }

        @media (max-width: 1000px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 WASM视频处理器</h1>
            <p>实时人脸模糊 · 背景替换 · WebAssembly加速</p>
        </header>

        <div class="main-content">
            <div class="video-container">
                <div class="video-wrapper">
                    <canvas id="output-canvas"></canvas>
                    <div id="fps-counter">FPS: 0</div>
                    <div id="loading-overlay">
                        <div class="spinner"></div>
                        <p>正在初始化 WebAssembly 和人脸检测模型...</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <h2>⚙️ 控制面板</h2>

                <div class="control-group">
                    <label>视频分辨率</label>
                    <select id="resolution-select" class="resolution-select">
                        <option value="1920x1080">1080p (1920×1080)</option>
                        <option value="1280x720" selected>720p (1280×720)</option>
                        <option value="854x480">480p (854×480)</option>
                        <option value="640x360">360p (640×360)</option>
                    </select>
                </div>

                <div class="control-group">
                    <div class="toggle-switch">
                        <span>人脸模糊</span>
                        <label class="switch">
                            <input type="checkbox" id="blur-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label>模糊强度</label>
                    <div class="slider-wrapper">
                        <input type="range" id="blur-radius" min="2" max="20" value="8">
                        <div class="range-value" id="blur-value">8</div>
                    </div>
                </div>

                <div class="control-group">
                    <div class="toggle-switch">
                        <span>背景替换</span>
                        <label class="switch">
                            <input type="checkbox" id="bg-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label>背景颜色</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bg-color" value="#00ff88">
                        <span>选择纯色背景</span>
                    </div>
                    <div class="color-preset">
                        <button class="color-btn" style="background: #00ff88" data-color="#00ff88"></button>
                        <button class="color-btn" style="background: #00d4ff" data-color="#00d4ff"></button>
                        <button class="color-btn" style="background: #7b2ff7" data-color="#7b2ff7"></button>
                        <button class="color-btn" style="background: #ff6b6b" data-color="#ff6b6b"></button>
                        <button class="color-btn" style="background: #ffd93d" data-color="#ffd93d"></button>
                        <button class="color-btn" style="background: #ffffff" data-color="#ffffff"></button>
                        <button class="color-btn" style="background: #000000" data-color="#000000"></button>
                    </div>
                </div>

                <div class="control-group">
                    <label>自定义背景图片</label>
                    <div class="file-upload">
                        <input type="file" id="bg-image" accept="image/*">
                    </div>
                </div>

                <div class="control-group">
                    <h3 style="color: #00d4ff; margin-bottom: 15px; font-size: 1em;">⚡ 性能与显示</h3>
                    <div class="toggle-switch">
                        <span>显示人脸属性</span>
                        <label class="switch">
                            <input type="checkbox" id="attributes-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-switch" style="margin-top: 10px;">
                        <span>WebGL 性能优化</span>
                        <label class="switch">
                            <input type="checkbox" id="quantization-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <p style="color: #888; font-size: 0.8em; margin-top: 8px; line-height: 1.4;">
                        ⚠️ WebGL优化可能降低戴眼镜、侧脸的检测精度
                    </p>
                </div>

                <div class="status-info">
                    <p><span>分辨率:</span> <span id="status-resolution">-</span></p>
                    <p><span>检测到人脸:</span> <span id="status-faces">0</span></p>
                    <p><span>WASM线程数:</span> <span id="status-threads">-</span></p>
                    <p><span>WebGL优化:</span> <span id="status-quantization">-</span></p>
                    <p><span>检测耗时:</span> <span id="status-detection-time">-</span></p>
                    <p><span>跳帧数:</span> <span id="status-skipped">0</span></p>
                    <p><span>模型状态:</span> <span id="status-model">加载中...</span></p>
                </div>
            </div>
        </div>
    </div>

    <video id="source-video" style="display: none;" autoplay muted playsinline></video>

    <script type="module" src="./js/app.js"></script>
</body>
</html>

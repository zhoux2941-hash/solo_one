<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子弹外弹道温湿度影响测算系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .tab-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .tab-btn.active {
            background: white;
            color: #1e3c72;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .result-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #2a5298;
        }
        
        .result-card h4 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .result-card .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }
        
        .result-card .unit {
            font-size: 0.8em;
            color: #666;
            margin-left: 5px;
        }
        
        .climate-tag {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .climate-hot {
            background: #ffebee;
            color: #c62828;
        }
        
        .climate-cold {
            background: #e3f2fd;
            color: #1565c0;
        }
        
        .climate-humid {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .climate-normal {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .comparison-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-top: 4px solid #2a5298;
        }
        
        .comparison-card h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .comparison-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .comparison-item:last-child {
            border-bottom: none;
        }
        
        .diff-positive {
            color: #c62828;
        }
        
        .diff-negative {
            color: #2e7d32;
        }
        
        .logs-container {
            margin-top: 20px;
        }
        
        .log-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #2a5298;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .log-type {
            background: #1e3c72;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }
        
        .log-time {
            color: #666;
            font-size: 0.9em;
        }
        
        .log-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #444;
            background: white;
            padding: 15px;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .log-meta span {
            color: #666;
            font-size: 0.9em;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e3c72;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quick-btn {
            padding: 10px;
            background: #e3f2fd;
            border: 2px solid #bbdefb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 0.9em;
        }
        
        .quick-btn:hover {
            background: #bbdefb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 子弹外弹道温湿度影响测算系统</h1>
            <p>精准测算气象因素对弹道的影响，提供专业的弹道修正分析</p>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('input')">📊 气象数据录入</button>
            <button class="tab-btn" onclick="switchTab('density')">💨 空气密度换算</button>
            <button class="tab-btn" onclick="switchTab('drag')">🔧 弹道阻力修正</button>
            <button class="tab-btn" onclick="switchTab('compare')">📋 季节气候对比</button>
            <button class="tab-btn" onclick="switchTab('logs')">📝 弹道日志</button>
        </div>
        
        <div id="input" class="tab-content active">
            <h2 class="section-title">🌡️ 气象数据录入</h2>
            
            <div class="quick-buttons">
                <div class="quick-btn" onclick="setQuickWeather('spring')">🌸 春季典型</div>
                <div class="quick-btn" onclick="setQuickWeather('summer')">☀️ 夏季典型</div>
                <div class="quick-btn" onclick="setQuickWeather('autumn')">🍂 秋季典型</div>
                <div class="quick-btn" onclick="setQuickWeather('winter')">❄️ 冬季典型</div>
                <div class="quick-btn" onclick="setQuickWeather('hot')">🔥 高温干燥</div>
                <div class="quick-btn" onclick="setQuickWeather('cold')">🥶 严寒天气</div>
                <div class="quick-btn" onclick="setQuickWeather('humid')">💧 高温潮湿</div>
                <div class="quick-btn" onclick="setQuickWeather('standard')">📏 标准条件</div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="temperature">环境温度 (°C)</label>
                    <input type="number" id="temperature" value="15" step="0.1">
                </div>
                <div class="form-group">
                    <label for="humidity">相对湿度 (%)</label>
                    <input type="number" id="humidity" value="50" min="0" max="100" step="0.1">
                </div>
                <div class="form-group">
                    <label for="pressure">大气压强 (hPa)</label>
                    <input type="number" id="pressure" value="1013.25" step="0.01">
                </div>
                <div class="form-group">
                    <label for="altitude">海拔高度 (m)</label>
                    <input type="number" id="altitude" value="0" step="1">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="season">季节</label>
                    <select id="season">
                        <option value="">未指定</option>
                        <option value="春季">春季</option>
                        <option value="夏季">夏季</option>
                        <option value="秋季">秋季</option>
                        <option value="冬季">冬季</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">备注说明</label>
                    <input type="text" id="description" placeholder="可选：输入气象条件描述">
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="calculateBallistics()">🚀 开始计算</button>
                <button class="btn btn-success" onclick="loadStandardCondition()">📏 加载标准条件</button>
            </div>
            
            <div id="input-results"></div>
        </div>
        
        <div id="density" class="tab-content">
            <h2 class="section-title">💨 空气密度换算结果</h2>
            <div id="density-results">
                <div class="loading">
                    <p>请先在「气象数据录入」页面输入参数并计算</p>
                </div>
            </div>
        </div>
        
        <div id="drag" class="tab-content">
            <h2 class="section-title">🔧 弹道阻力修正结果</h2>
            <div id="drag-results">
                <div class="loading">
                    <p>请先在「气象数据录入」页面输入参数并计算</p>
                </div>
            </div>
        </div>
        
        <div id="compare" class="tab-content">
            <h2 class="section-title">📋 不同季节弹道差异对比</h2>
            
            <div class="btn-group" style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="compareSeasons()">🌸 四季对比分析</button>
                <button class="btn btn-success" onclick="compareExtreme()">🌪️ 极端气候对比</button>
            </div>
            
            <div id="compare-results"></div>
        </div>
        
        <div id="logs" class="tab-content">
            <h2 class="section-title">📝 气象弹道分析日志</h2>
            
            <div class="btn-group" style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="loadLogs()">🔄 刷新日志列表</button>
                <button class="btn btn-success" onclick="loadAllLogs()">📋 加载全部日志</button>
            </div>
            
            <div id="logs-stats" style="margin-bottom: 15px; padding: 10px 20px; background: #e3f2fd; border-radius: 8px; display: none;">
                <span style="color: #1565c0; font-weight: 500;">📊 日志统计：</span>
                <span id="logs-total">共 0 条记录</span>
                <span id="logs-displayed" style="margin-left: 20px;">当前显示 0 条（最近10条）</span>
            </div>
            
            <div id="logs-container" class="logs-container"></div>
        </div>
    </div>

    <script>
        let lastResult = null;
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'logs') {
                loadLogs();
            }
        }
        
        function setQuickWeather(type) {
            const weathers = {
                spring: { temp: 15, humidity: 55, pressure: 1010, altitude: 0, season: '春季' },
                summer: { temp: 32, humidity: 75, pressure: 1005, altitude: 0, season: '夏季' },
                autumn: { temp: 18, humidity: 60, pressure: 1015, altitude: 0, season: '秋季' },
                winter: { temp: -5, humidity: 40, pressure: 1020, altitude: 0, season: '冬季' },
                hot: { temp: 38, humidity: 20, pressure: 1000, altitude: 0, season: '' },
                cold: { temp: -25, humidity: 30, pressure: 1025, altitude: 0, season: '' },
                humid: { temp: 35, humidity: 85, pressure: 1002, altitude: 0, season: '' },
                standard: { temp: 15, humidity: 50, pressure: 1013.25, altitude: 0, season: '' }
            };
            
            const w = weathers[type];
            document.getElementById('temperature').value = w.temp;
            document.getElementById('humidity').value = w.humidity;
            document.getElementById('pressure').value = w.pressure;
            document.getElementById('altitude').value = w.altitude;
            document.getElementById('season').value = w.season;
        }
        
        async function calculateBallistics() {
            const data = {
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                pressure: parseFloat(document.getElementById('pressure').value),
                altitude: parseFloat(document.getElementById('altitude').value),
                season: document.getElementById('season').value,
                description: document.getElementById('description').value
            };
            
            showLoading('input-results');
            
            try {
                const response = await fetch('/api/ballistics/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    lastResult = result.result;
                    displayAllResults(result.result);
                } else {
                    showError('input-results', result.message);
                }
            } catch (error) {
                showError('input-results', '请求失败: ' + error.message);
            }
        }
        
        async function loadStandardCondition() {
            setQuickWeather('standard');
            showLoading('input-results');
            
            try {
                const response = await fetch('/api/ballistics/standard');
                const result = await response.json();
                
                if (result.success) {
                    lastResult = result.result;
                    displayAllResults(result.result);
                } else {
                    showError('input-results', result.message);
                }
            } catch (error) {
                showError('input-results', '请求失败: ' + error.message);
            }
        }
        
        function displayAllResults(result) {
            displayInputResult(result);
            displayDensityResult(result);
            displayDragResult(result);
        }
        
        function displayInputResult(result) {
            const climateClass = getClimateClass(result.climateType);
            const html = `
                <div class="success-message">
                    ✅ 计算完成！请查看各标签页获取详细分析结果
                </div>
                <div style="margin-top: 20px;">
                    <span class="climate-tag ${climateClass}">🌤️ 气候类型: ${result.climateType}</span>
                </div>
            `;
            document.getElementById('input-results').innerHTML = html;
        }
        
        function displayDensityResult(result) {
            const standardDensity = 1.225;
            const densityRatio = result.airDensity / standardDensity;
            const diffPercent = ((densityRatio - 1) * 100).toFixed(2);
            
            const html = `
                <div class="results-grid">
                    <div class="result-card">
                        <h4>实际空气密度</h4>
                        <div class="value">${result.airDensity}<span class="unit">kg/m³</span></div>
                    </div>
                    <div class="result-card">
                        <h4>标准空气密度</h4>
                        <div class="value">${standardDensity}<span class="unit">kg/m³</span></div>
                    </div>
                    <div class="result-card">
                        <h4>密度比 (阻力修正系数)</h4>
                        <div class="value">${result.dragCorrectionFactor}<span class="unit"></span></div>
                    </div>
                    <div class="result-card">
                        <h4>与标准值差异</h4>
                        <div class="value">${diffPercent}<span class="unit">%</span></div>
                    </div>
                </div>
                <div style="margin-top: 30px; padding: 20px; background: #e3f2fd; border-radius: 10px;">
                    <h4 style="color: #1565c0; margin-bottom: 10px;">📊 空气密度分析</h4>
                    <p style="color: #444; line-height: 1.8;">
                        ${generateDensityAnalysis(result.airDensity, standardDensity)}
                    </p>
                </div>
            `;
            document.getElementById('density-results').innerHTML = html;
        }
        
        function displayDragResult(result) {
            const html = `
                <div class="results-grid">
                    <div class="result-card">
                        <h4>修正后阻力系数</h4>
                        <div class="value">${result.dragCoefficient}</div>
                    </div>
                    <div class="result-card">
                        <h4>空气阻力</h4>
                        <div class="value">${result.dragForce}<span class="unit">N</span></div>
                    </div>
                    <div class="result-card">
                        <h4>飞行时间</h4>
                        <div class="value">${result.timeOfFlight}<span class="unit">s</span></div>
                    </div>
                    <div class="result-card">
                        <h4>弹道下坠量</h4>
                        <div class="value">${result.bulletDrop}<span class="unit">m</span></div>
                    </div>
                    <div class="result-card">
                        <h4>剩余速度</h4>
                        <div class="value">${result.remainingVelocity}<span class="unit">m/s</span></div>
                    </div>
                    <div class="result-card">
                        <h4>速度衰减量</h4>
                        <div class="value">${result.velocityDrop}<span class="unit">m/s</span></div>
                    </div>
                </div>
                <div style="margin-top: 30px; padding: 20px; background: #fff3e0; border-radius: 10px;">
                    <h4 style="color: #ef6c00; margin-bottom: 10px;">🔍 弹道修正分析</h4>
                    <p style="color: #444; line-height: 1.8;">
                        ${generateDragAnalysis(result)}
                    </p>
                </div>
            `;
            document.getElementById('drag-results').innerHTML = html;
        }
        
        async function compareSeasons() {
            showLoading('compare-results');
            
            try {
                const response = await fetch('/api/ballistics/seasons/compare');
                const result = await response.json();
                
                if (result.success) {
                    displayComparisonResults(result.results, result.report);
                } else {
                    showError('compare-results', result.message);
                }
            } catch (error) {
                showError('compare-results', '请求失败: ' + error.message);
            }
        }
        
        async function compareExtreme() {
            showLoading('compare-results');
            
            try {
                const response = await fetch('/api/ballistics/extreme/compare');
                const result = await response.json();
                
                if (result.success) {
                    displayComparisonResults(result.results, result.report);
                } else {
                    showError('compare-results', result.message);
                }
            } catch (error) {
                showError('compare-results', '请求失败: ' + error.message);
            }
        }
        
        function displayComparisonResults(results, report) {
            let html = '<div class="comparison-grid">';
            
            for (const [condition, result] of Object.entries(results)) {
                if (condition === '标准气候') continue;
                
                html += `
                    <div class="comparison-card">
                        <h3>${condition}</h3>
                        <div class="comparison-item">
                            <span>空气密度</span>
                            <span>${result.airDensity} kg/m³</span>
                        </div>
                        <div class="comparison-item">
                            <span>弹道下坠</span>
                            <span>${result.bulletDrop} m</span>
                        </div>
                        <div class="comparison-item">
                            <span>剩余速度</span>
                            <span>${result.remainingVelocity} m/s</span>
                        </div>
                        <div class="comparison-item">
                            <span>修正系数</span>
                            <span>${result.dragCorrectionFactor}</span>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            
            if (results['标准气候']) {
                html += `
                    <div style="margin-top: 30px; padding: 20px; background: #e8f5e9; border-radius: 10px;">
                        <h4 style="color: #2e7d32; margin-bottom: 10px;">📐 标准气候基准值</h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div><strong>空气密度:</strong> ${results['标准气候'].airDensity} kg/m³</div>
                            <div><strong>弹道下坠:</strong> ${results['标准气候'].bulletDrop} m</div>
                            <div><strong>剩余速度:</strong> ${results['标准气候'].remainingVelocity} m/s</div>
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div style="margin-top: 30px;">
                    <h3 style="color: #1e3c72; margin-bottom: 15px;">📋 分析报告</h3>
                    <pre style="background: #f8f9fa; padding: 20px; border-radius: 10px; font-family: 'Courier New', monospace; white-space: pre-wrap;">${report}</pre>
                </div>
            `;
            
            document.getElementById('compare-results').innerHTML = html;
        }
        
        async function loadLogs() {
            showLoading('logs-container');
            
            try {
                const response = await fetch('/api/ballistics/logs?limit=10');
                const result = await response.json();
                
                if (result.success) {
                    displayLogs(result.logs, result.total, result.displayed);
                } else {
                    showError('logs-container', result.message);
                }
            } catch (error) {
                showError('logs-container', '请求失败: ' + error.message);
            }
        }
        
        async function loadAllLogs() {
            showLoading('logs-container');
            
            try {
                const response = await fetch('/api/ballistics/logs?limit=0');
                const result = await response.json();
                
                if (result.success) {
                    displayLogs(result.logs, result.total, result.displayed, true);
                } else {
                    showError('logs-container', result.message);
                }
            } catch (error) {
                showError('logs-container', '请求失败: ' + error.message);
            }
        }
        
        function displayLogs(logs, total, displayed, isAll = false) {
            const statsDiv = document.getElementById('logs-stats');
            const totalSpan = document.getElementById('logs-total');
            const displayedSpan = document.getElementById('logs-displayed');
            
            if (logs.length === 0) {
                statsDiv.style.display = 'none';
                document.getElementById('logs-container').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        暂无日志记录
                    </div>
                `;
                return;
            }
            
            statsDiv.style.display = 'block';
            totalSpan.textContent = `共 ${total} 条记录`;
            displayedSpan.textContent = isAll ? `当前显示全部 ${displayed} 条` : `当前显示最近 ${displayed} 条`;
            
            let html = '';
            logs.forEach(log => {
                const time = new Date(log.createTime).toLocaleString('zh-CN');
                html += `
                    <div class="log-item">
                        <div class="log-header">
                            <span class="log-type">${log.logType}</span>
                            <span class="log-time">${time}</span>
                        </div>
                        ${log.climateCondition ? `<span class="climate-tag ${getClimateClass(log.climateCondition)}">${log.climateCondition}</span>` : ''}
                        ${log.temperature !== null ? `
                            <div class="log-meta">
                                <span>🌡️ ${log.temperature}°C</span>
                                <span>💧 ${log.humidity}%</span>
                                <span>📊 ${log.pressure} hPa</span>
                                ${log.airDensity ? `<span>💨 ${log.airDensity} kg/m³</span>` : ''}
                                ${log.bulletDrop ? `<span>🎯 下坠 ${log.bulletDrop} m</span>` : ''}
                            </div>
                        ` : ''}
                        <div class="log-content" style="margin-top: 15px;">${log.logContent}</div>
                    </div>
                `;
            });
            
            document.getElementById('logs-container').innerHTML = html;
        }
        
        function showLoading(containerId) {
            document.getElementById(containerId).innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在处理中...</p>
                </div>
            `;
        }
        
        function showError(containerId, message) {
            document.getElementById(containerId).innerHTML = `
                <div class="error-message">
                    ❌ ${message}
                </div>
            `;
        }
        
        function getClimateClass(climateType) {
            if (climateType.includes('高温')) return 'climate-hot';
            if (climateType.includes('严寒')) return 'climate-cold';
            if (climateType.includes('潮湿')) return 'climate-humid';
            return 'climate-normal';
        }
        
        function generateDensityAnalysis(actual, standard) {
            const diff = actual - standard;
            const percent = (diff / standard * 100).toFixed(2);
            
            if (diff > 0.05) {
                return `空气密度较标准值高出 ${percent}%。较高的空气密度会增加子弹飞行阻力，导致弹道下坠增加、存速能力下降。建议根据实际情况进行射程表修正，瞄准点适当抬高。`;
            } else if (diff < -0.05) {
                return `空气密度较标准值低出 ${Math.abs(percent)}%。较低的空气密度会减少子弹飞行阻力，弹道下坠减少、存速能力提升。实际射程可能比理论值更远，需注意过远弹着点。`;
            } else {
                return `空气密度接近标准条件 (差异 ${percent}%)，弹道特性与标准条件基本一致。可直接使用标准射程表进行瞄准。`;
            }
        }
        
        function generateDragAnalysis(result) {
            const correction = result.dragCorrectionFactor;
            
            if (correction > 1.05) {
                return `由于当前气象条件下空气密度较高，弹道阻力已修正 +${((correction - 1) * 100).toFixed(2)}%。在 1000 米射程内，预计弹道下坠 ${result.bulletDrop} 米，剩余速度 ${result.remainingVelocity} m/s。建议在实际射击时根据此修正量调整瞄准参数。`;
            } else if (correction < 0.95) {
                return `由于当前气象条件下空气密度较低，弹道阻力已修正 ${((correction - 1) * 100).toFixed(2)}%。在 1000 米射程内，预计弹道下坠 ${result.bulletDrop} 米，剩余速度 ${result.remainingVelocity} m/s。子弹存速能力优于标准条件，需注意射程增加带来的影响。`;
            } else {
                return `当前气象条件接近标准大气条件，弹道阻力修正量较小 (${((correction - 1) * 100).toFixed(2)}%)。在 1000 米射程内，预计弹道下坠 ${result.bulletDrop} 米，剩余速度 ${result.remainingVelocity} m/s。可直接使用标准弹道参数。`;
            }
        }
    </script>
</body>
</html>

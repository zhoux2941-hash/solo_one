<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时同声传译系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 实时同声传译系统</h1>
            <div class="mode-switcher">
                <button id="modeSimultaneous" class="mode-btn active">📢 同声传译</button>
                <button id="modeConversation" class="mode-btn">💬 对话模式</button>
            </div>
            <div class="status-bar">
                <span id="connectionStatus" class="status connected">● 系统就绪</span>
                <span id="latency" class="latency">延迟: -- ms</span>
            </div>
        </header>

        <div class="control-panel">
            <div id="conversationConfig" class="conversation-config" style="display: none;">
                <div class="speaker-config">
                    <div class="speaker speaker-a">
                        <h4>👤 说话人 A</h4>
                        <select id="speakerALang" class="lang-select-small">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">English</option>
                        </select>
                        <input type="text" id="speakerAName" class="name-input" value="说话人A" placeholder="名字">
                    </div>
                    <div class="speaker speaker-b">
                        <h4>👤 说话人 B</h4>
                        <select id="speakerBLang" class="lang-select-small">
                            <option value="en-US">English</option>
                            <option value="zh-CN">中文</option>
                        </select>
                        <input type="text" id="speakerBName" class="name-input" value="说话人B" placeholder="名字">
                    </div>
                </div>
                <div class="speaker-switch">
                    <p>当前说话人:</p>
                    <button id="speakerToggle" class="speaker-toggle-btn speaker-a-active">
                        <span id="currentSpeakerName">说话人A</span>
                    </button>
                    <p class="hint">点击切换说话人，或按 [Tab] 键快速切换</p>
                </div>
            </div>

            <div class="language-selector">
                <div class="language-pair">
                    <select id="sourceLang" class="lang-select">
                        <option value="en-US">英语 (English)</option>
                        <option value="zh-CN">中文 (Chinese)</option>
                    </select>
                    <button id="swapLangs" class="swap-btn">⇄</button>
                    <select id="targetLang" class="lang-select">
                        <option value="zh-CN">中文 (Chinese)</option>
                        <option value="en-US">英语 (English)</option>
                    </select>
                </div>
            </div>

            <div class="domain-selector">
                <label for="domainSelect">领域术语:</label>
                <select id="domainSelect" class="domain-select">
                    <option value="general">通用领域</option>
                    <option value="medical">医疗领域</option>
                    <option value="tech">科技领域</option>
                    <option value="legal">法律领域</option>
                </select>
            </div>

            <div class="voice-controls">
                <div class="voice-selector">
                    <label for="voiceSelect">🎤 语音选择:</label>
                    <select id="voiceSelect" class="domain-select">
                        <option value="">自动选择最佳语音</option>
                    </select>
                </div>
                <div class="voice-slider">
                    <label>⏱️ 语速: <span id="rateValue">0.9</span></label>
                    <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="0.9">
                </div>
                <div class="voice-slider">
                    <label>🎵 音调: <span id="pitchValue">1.0</span></label>
                    <input type="range" id="pitchSlider" min="0.8" max="1.5" step="0.1" value="1.0">
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">🎙️ 开始翻译</button>
                <button id="stopBtn" class="btn btn-danger" disabled>⏹️ 停止翻译</button>
                <button id="clearBtn" class="btn btn-secondary">🗑️ 清空字幕</button>
                <button id="saveBtn" class="btn btn-success">💾 保存记录</button>
            </div>
        </div>

        <div id="simultaneousView" class="subtitle-container">
            <div class="subtitle-box original">
                <div class="subtitle-label">原文 (Original)</div>
                <div id="originalText" class="subtitle-text"></div>
            </div>
            <div class="subtitle-box translated">
                <div class="subtitle-label">译文 (Translation)</div>
                <div id="translatedText" class="subtitle-text"></div>
            </div>
        </div>

        <div id="conversationView" class="conversation-container" style="display: none;">
            <div id="conversationBubbles" class="conversation-bubbles"></div>
            <div id="currentBubbleContainer"></div>
        </div>

        <div id="historySection" class="history-section">
            <h3>📜 翻译记录</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

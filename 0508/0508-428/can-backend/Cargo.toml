[package]
name = "can-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
log = "0.4"
env_logger = "0.10"
chrono = "0.4"
thiserror = "1"
byteorder = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true

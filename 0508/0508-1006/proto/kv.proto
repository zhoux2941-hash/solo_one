syntax = "proto3";

package paxoskv;

option cc_generic_services = true;

import "paxos.proto";

message PutRequest {
    string key = 1;
    bytes value = 2;
}

message PutResponse {
    bool success = 1;
    string error = 2;
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    bool found = 1;
    bytes value = 2;
    string error = 3;
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    bool success = 1;
    bool deleted = 2;
    string error = 3;
}

message GetStatusRequest {
}

message NodeStatus {
    uint64 node_id = 1;
    string address = 2;
    bool is_leader = 3;
    uint64 commit_index = 4;
    uint64 last_applied = 5;
    uint64 log_size = 6;
    bool alive = 7;
}

message GetStatusResponse {
    uint64 leader_id = 1;
    repeated NodeStatus nodes = 2;
    uint64 cluster_size = 3;
}

message SnapshotRequest {
}

message SnapshotResponse {
    bool success = 1;
    string error = 2;
    uint64 snapshot_index = 3;
}

message AddNodeRequest {
    uint64 node_id = 1;
    string address = 2;
    string paxos_address = 3;
}

message AddNodeResponse {
    bool success = 1;
    string error = 2;
    uint64 config_index = 3;
}

message RemoveNodeRequest {
    uint64 node_id = 1;
}

message RemoveNodeResponse {
    bool success = 1;
    string error = 2;
    uint64 config_index = 3;
}

message RebalanceRequest {
}

message RebalanceResponse {
    bool success = 1;
    string error = 2;
    uint64 keys_migrated = 3;
}

message GetClusterConfigRequest {
}

message GetClusterConfigResponse {
    uint64 config_index = 1;
    repeated ClusterMember members = 2;
    uint64 leader_id = 3;
}

service KVService {
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
    rpc TakeSnapshot(SnapshotRequest) returns (SnapshotResponse);
    rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
    rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
    rpc Rebalance(RebalanceRequest) returns (RebalanceResponse);
    rpc GetClusterConfig(GetClusterConfigRequest) returns (GetClusterConfigResponse);
}

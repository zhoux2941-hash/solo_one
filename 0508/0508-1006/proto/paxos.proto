syntax = "proto3";

package paxoskv;

option cc_generic_services = true;

enum LogEntryType {
    LOG_TYPE_NOOP = 0;
    LOG_TYPE_PUT = 1;
    LOG_TYPE_DELETE = 2;
    LOG_TYPE_CONFIG = 3;
}

message ClusterMember {
    uint64 node_id = 1;
    string address = 2;
    string paxos_address = 3;
}

message ClusterConfig {
    uint64 config_index = 1;
    repeated ClusterMember members = 2;
    uint64 timestamp = 3;
}

message LogEntry {
    uint64 index = 1;
    uint64 term = 2;
    LogEntryType type = 3;
    string key = 4;
    bytes value = 5;
    uint64 timestamp = 6;
    ClusterConfig config = 7;
}

message PrepareRequest {
    uint64 proposer_id = 1;
    uint64 proposal_number = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

message PrepareResponse {
    uint64 node_id = 1;
    bool promise = 2;
    uint64 promised_proposal = 3;
    uint64 accepted_proposal = 4;
    LogEntry accepted_entry = 5;
    uint64 last_log_index = 6;
}

message AcceptRequest {
    uint64 proposer_id = 1;
    uint64 proposal_number = 2;
    LogEntry entry = 3;
}

message AcceptResponse {
    uint64 node_id = 1;
    bool accepted = 2;
    uint64 promised_proposal = 3;
}

message LearnRequest {
    uint64 node_id = 1;
    LogEntry entry = 2;
}

message LearnResponse {
    uint64 node_id = 1;
    bool success = 2;
}

message AppendEntriesRequest {
    uint64 leader_id = 1;
    uint64 term = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated LogEntry entries = 5;
    uint64 leader_commit = 6;
}

message AppendEntriesResponse {
    uint64 node_id = 1;
    uint64 term = 2;
    bool success = 3;
    uint64 match_index = 4;
    uint64 last_log_index = 5;
    uint64 conflict_term = 6;
    uint64 conflict_first_index = 7;
}

message HeartbeatRequest {
    uint64 leader_id = 1;
    uint64 term = 2;
    uint64 commit_index = 3;
}

message HeartbeatResponse {
    uint64 node_id = 1;
    uint64 term = 2;
    bool success = 3;
}

message InstallSnapshotRequest {
    uint64 leader_id = 1;
    uint64 term = 2;
    uint64 last_included_index = 3;
    uint64 last_included_term = 4;
    uint64 offset = 5;
    bytes data = 6;
    bool done = 7;
}

message InstallSnapshotResponse {
    uint64 node_id = 1;
    uint64 term = 2;
    bool success = 3;
}

service PaxosService {
    rpc Prepare(PrepareRequest) returns (PrepareResponse);
    rpc Accept(AcceptRequest) returns (AcceptResponse);
    rpc Learn(LearnRequest) returns (LearnResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

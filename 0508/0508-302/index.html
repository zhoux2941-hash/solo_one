<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU 3D 流体动力学模拟 - LBM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .ui h2 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .ui p {
            margin: 5px 0;
        }
        .controls {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
        .btn {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover {
            background: #45a049;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
        }
        .slider-container {
            margin: 10px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
        }
        .slider-container input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <h2>3D 流体模拟 (LBM)</h2>
        <p>分辨率: 128×128×64</p>
        <p id="fps">FPS: 0</p>
        <div class="controls">
            <p><strong>控制:</strong></p>
            <p>🖱️ 左键拖动: 旋转视角</p>
            <p>🖱️ 右键拖动: 平移</p>
            <p>🖱️ 滚轮: 缩放</p>
            <p>左键点击: 添加密度源</p>
            <p>Shift+点击: 添加外力</p>
        </div>
        <div class="slider-container">
            <label for="vorticity">涡度限制强度: <span id="vorticity-value">0.008</span></label>
            <input type="range" id="vorticity" min="0" max="0.03" step="0.001" value="0.008" onchange="app.setVorticity(this.value)">
        </div>
        <button class="btn" onclick="app.resetSimulation()">重置模拟</button>
    </div>
    <div class="info">
        WebGPU + 格子玻尔兹曼方法 (D3Q19)
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>

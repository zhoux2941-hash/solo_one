<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无人机发射端 - 浏览器测试版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
        }
        .panel {
            background: rgba(15, 52, 96, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel h3 {
            margin-bottom: 15px;
            color: #00ff88;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #0f0f1a;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: #fff;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #0f3460, #16537e);
            color: #fff;
        }
        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .status-indicator.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        .status-indicator.disconnected {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        .log-panel {
            max-height: 200px;
            overflow-y: auto;
            background: #0a0a15;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .log-entry.control {
            color: #00ff88;
        }
        .log-entry.action {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛸 无人机发射端 (浏览器测试版)</h1>

        <div class="video-container">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="panel">
            <div class="status">
                <span id="statusIndicator" class="status-indicator disconnected"></span>
                <span id="statusText">未连接</span>
            </div>
            
            <div class="buttons">
                <button id="startCameraBtn" class="btn-primary">📷 启动摄像头</button>
                <button id="createOfferBtn" class="btn-secondary" disabled>🔗 创建Offer</button>
            </div>
        </div>

        <div class="panel">
            <h3>SDP Offer (复制到控制端)</h3>
            <textarea id="offerText" readonly></textarea>
            <div class="buttons">
                <button id="copyOfferBtn" class="btn-secondary" disabled>📋 复制Offer</button>
            </div>
        </div>

        <div class="panel">
            <h3>SDP Answer (从控制端粘贴)</h3>
            <textarea id="answerText" placeholder="在此粘贴控制端的Answer..."></textarea>
            <div class="buttons">
                <button id="setAnswerBtn" class="btn-success" disabled>✅ 设置Answer</button>
            </div>
        </div>

        <div class="panel">
            <h3>📡 接收的控制指令</h3>
            <div id="logPanel" class="log-panel"></div>
        </div>
    </div>

    <script>
        class DroneTransmitter {
            constructor() {
                this.peerConnection = null;
                this.dataChannel = null;
                this.localStream = null;
                this.telemetryInterval = null;
                
                this.telemetry = {
                    altitude: 0,
                    speed: 0,
                    battery: 12.6,
                    satellites: 8,
                    pitch: 0,
                    roll: 0,
                    yaw: 0
                };
                this.isReturning = false;
                this.returnStartTime = 0;
                
                this.followMode = false;
                this.followAltitude = 2.0;
                this.followDistance = 3.0;
                this.targetPosition = { x: 0, y: 0 };
                this.dronePosition = { x: 0, y: 0 };
                this.positionError = 0;
                this.kP = 20;

                this.initElements();
                this.setupEventListeners();
            }

            initElements() {
                this.localVideo = document.getElementById('localVideo');
                this.startCameraBtn = document.getElementById('startCameraBtn');
                this.createOfferBtn = document.getElementById('createOfferBtn');
                this.offerText = document.getElementById('offerText');
                this.copyOfferBtn = document.getElementById('copyOfferBtn');
                this.answerText = document.getElementById('answerText');
                this.setAnswerBtn = document.getElementById('setAnswerBtn');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.logPanel = document.getElementById('logPanel');
            }

            setupEventListeners() {
                this.startCameraBtn.addEventListener('click', () => this.startCamera());
                this.createOfferBtn.addEventListener('click', () => this.createOffer());
                this.copyOfferBtn.addEventListener('click', () => this.copyOffer());
                this.setAnswerBtn.addEventListener('click', () => this.setAnswer());
            }

            async startCamera() {
                try {
                    this.log('正在启动摄像头...');
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 640, height: 480, frameRate: 30 },
                        audio: false
                    });
                    this.localVideo.srcObject = this.localStream;
                    this.startCameraBtn.disabled = true;
                    this.createOfferBtn.disabled = false;
                    this.log('摄像头已启动！');
                } catch (error) {
                    this.log('启动摄像头失败: ' + error.message);
                    alert('启动摄像头失败: ' + error.message);
                }
            }

            async createOffer() {
                try {
                    this.log('正在创建PeerConnection...');
                    
                    this.peerConnection = new RTCPeerConnection({
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    });

                    this.setupPeerConnectionListeners();

                    this.localStream.getTracks().forEach(track => {
                        this.peerConnection.addTrack(track, this.localStream);
                    });

                    this.dataChannel = this.peerConnection.createDataChannel('control', {
                        ordered: false,
                        maxRetransmits: 0
                    });
                    this.setupDataChannelListeners();

                    const offer = await this.peerConnection.createOffer();
                    await this.peerConnection.setLocalDescription(offer);
                    
                    this.offerText.value = JSON.stringify(offer);
                    this.copyOfferBtn.disabled = false;
                    this.setAnswerBtn.disabled = false;
                    
                    this.log('SDP Offer已创建！');
                    this.updateStatus();
                } catch (error) {
                    this.log('创建Offer失败: ' + error.message);
                    alert('创建Offer失败: ' + error.message);
                }
            }

            setupPeerConnectionListeners() {
                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.log('ICE Candidate: ' + event.candidate.candidate.substring(0, 50) + '...');
                    }
                };

                this.peerConnection.oniceconnectionstatechange = () => {
                    this.log('ICE状态: ' + this.peerConnection.iceConnectionState);
                    this.updateStatus();
                };
            }

            setupDataChannelListeners() {
                this.dataChannel.onopen = () => {
                    this.log('DataChannel已打开！');
                    this.startTelemetry();
                    this.updateStatus();
                };

                this.dataChannel.onclose = () => {
                    this.log('DataChannel已关闭');
                    this.stopTelemetry();
                    this.updateStatus();
                };

                this.dataChannel.onmessage = (event) => {
                    this.handleMessage(event.data);
                };
            }

            handleMessage(data) {
                try {
                    const message = JSON.parse(data);
                    
                    if (message.type === 'ping') {
                        this.sendData({ type: 'pong' });
                    } else if (message.type === 'control') {
                        if (!this.followMode) {
                            this.logControl(message);
                            this.updateTelemetryFromControl(message);
                        }
                    } else if (message.type === 'action') {
                        this.logAction(message);
                    } else if (message.type === 'follow_start') {
                            this.startFollowMode(message);
                        } else if (message.type === 'follow_stop') {
                            this.stopFollowMode();
                        } else if (message.type === 'follow_settings') {
                            this.updateFollowSettings(message);
                        } else if (message.type === 'follow_position') {
                            this.updateTargetPosition(message);
                        }
                } catch (e) {
                    this.log('消息解析错误: ' + e.message);
                }
            }

            logControl(message) {
                const log = document.createElement('div');
                log.className = 'log-entry control';
                const latency = Date.now() - message.timestamp;
                log.textContent = `[控制] 油门:${message.throttle} 偏航:${message.yaw} 俯仰:${message.pitch} 横滚:${message.roll} 延迟:${latency}ms`;
                this.addLogEntry(log);
            }

            logAction(message) {
                const log = document.createElement('div');
                log.className = 'log-entry action';
                log.textContent = `[动作] ${message.action.toUpperCase()}`;
                this.addLogEntry(log);

                if (message.action === 'takeoff') {
                    this.telemetry.altitude = 1.5;
                    this.isReturning = false;
                } else if (message.action === 'land') {
                    this.telemetry.altitude = 0;
                    this.isReturning = false;
                    if (this.followMode) {
                        this.stopFollowMode();
                    }
                } else if (message.action === 'return') {
                    this.isReturning = true;
                    this.returnStartTime = Date.now();
                    if (this.followMode) {
                        this.stopFollowMode();
                    }
                }
            }

            addLogEntry(element) {
                this.logPanel.insertBefore(element, this.logPanel.firstChild);
                if (this.logPanel.children.length > 50) {
                    this.logPanel.removeChild(this.logPanel.lastChild);
                }
            }

            updateTelemetryFromControl(control) {
                if (!this.isReturning && !this.followMode) {
                    if (control.throttle > 10) {
                        this.telemetry.altitude += (control.throttle / 100) * 0.1;
                    } else if (control.throttle < -10) {
                        this.telemetry.altitude = Math.max(0, this.telemetry.altitude - 0.1);
                    }
                }
                
                this.telemetry.speed = Math.abs(control.pitch) * 0.05;
                this.telemetry.pitch = control.pitch;
                this.telemetry.roll = control.roll;
                this.telemetry.yaw = control.yaw;
            }

            updateTelemetryIndependent() {
                this.telemetry.battery = Math.max(10, this.telemetry.battery - 0.001);

                if (this.isReturning && this.telemetry.altitude > 0) {
                    const elapsed = Date.now() - this.returnStartTime;
                    const targetAltitude = Math.max(0, 1.5 - (elapsed / 3000) * 1.5);
                    this.telemetry.altitude = targetAltitude;
                    
                    if (this.telemetry.altitude <= 0) {
                        this.isReturning = false;
                        this.log('返航完成，已降落！');
                    }
                }

                if (this.followMode) {
                    this.calculateFollowControl();
                }
            }

            startFollowMode(message) {
                this.followMode = true;
                this.followAltitude = message.targetAltitude || 2.0;
                this.followDistance = message.targetDistance || 3.0;
                this.dronePosition = { x: 0, y: 0 };
                this.targetPosition = { x: 0, y: 0 };
                this.log('📍 跟随模式已启动');
                
                if (this.telemetry.altitude < 0.5) {
                    this.telemetry.altitude = this.followAltitude;
                }
            }

            stopFollowMode() {
                this.followMode = false;
                this.telemetry.pitch = 0;
                this.telemetry.roll = 0;
                this.log('📍 跟随模式已停止');
            }

            updateFollowSettings(message) {
                this.followAltitude = message.targetAltitude || 2.0;
                this.followDistance = message.targetDistance || 3.0;
            }

            updateTargetPosition(message) {
                if (!this.followMode) return;
                
                this.targetPosition.x = message.x;
                this.targetPosition.y = message.y;
            }

            calculateFollowControl() {
                const dx = this.targetPosition.x - this.dronePosition.x;
                const dy = this.targetPosition.y - this.dronePosition.y;
                
                const distance = Math.sqrt(dx * dx + dy * dy);
                this.positionError = Math.abs(distance - this.followDistance);
                
                if (distance > 0.1) {
                    const angle = Math.atan2(dy, dx);
                    
                    const targetX = this.targetPosition.x - Math.cos(angle) * this.followDistance;
                    const targetY = this.targetPosition.y - Math.sin(angle) * this.followDistance;
                    
                    const errorX = targetX - this.dronePosition.x;
                    const errorY = targetY - this.dronePosition.y;
                    
                    this.telemetry.pitch = Math.max(-100, Math.min(100, this.kP * errorY));
                    this.telemetry.roll = Math.max(-100, Math.min(100, this.kP * errorX));
                    
                    this.dronePosition.x += this.telemetry.roll * 0.0005;
                    this.dronePosition.y += this.telemetry.pitch * 0.0005;
                }
                
                const altitudeError = this.followAltitude - this.telemetry.altitude;
                this.telemetry.altitude += altitudeError * 0.05;
                
                this.telemetry.speed = Math.sqrt(this.telemetry.pitch * this.telemetry.pitch + 
                                                  this.telemetry.roll * this.telemetry.roll) * 0.01;
            }

            startTelemetry() {
                this.telemetryInterval = setInterval(() => {
                    this.updateTelemetryIndependent();
                    this.sendData({
                        type: 'telemetry',
                        ...this.telemetry,
                        positionError: this.positionError,
                        timestamp: Date.now()
                    });
                }, 100);
            }

            stopTelemetry() {
                if (this.telemetryInterval) {
                    clearInterval(this.telemetryInterval);
                    this.telemetryInterval = null;
                }
            }

            sendData(data) {
                if (this.dataChannel && this.dataChannel.readyState === 'open') {
                    this.dataChannel.send(JSON.stringify(data));
                    return true;
                }
                return false;
            }

            async setAnswer() {
                try {
                    const answer = JSON.parse(this.answerText.value);
                    await this.peerConnection.setRemoteDescription(answer);
                    this.log('Answer已设置！');
                    this.setAnswerBtn.disabled = true;
                } catch (error) {
                    this.log('设置Answer失败: ' + error.message);
                    alert('设置Answer失败: ' + error.message);
                }
            }

            copyOffer() {
                this.offerText.select();
                document.execCommand('copy');
                this.log('Offer已复制到剪贴板！');
            }

            updateStatus() {
                const iceState = this.peerConnection ? this.peerConnection.iceConnectionState : 'disconnected';
                const dataState = this.dataChannel ? this.dataChannel.readyState : 'closed';

                const isConnected = iceState === 'connected' && dataState === 'open';

                if (isConnected) {
                    this.statusIndicator.className = 'status-indicator connected';
                    this.statusText.textContent = '已连接';
                } else {
                    this.statusIndicator.className = 'status-indicator disconnected';
                    this.statusText.textContent = iceState === 'checking' ? '连接中...' : '未连接';
                }
            }

            log(message) {
                const log = document.createElement('div');
                log.className = 'log-entry';
                log.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
                this.addLogEntry(log);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.transmitter = new DroneTransmitter();
        });
    </script>
</body>
</html>

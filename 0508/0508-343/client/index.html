<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>换浆损耗复盘系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>换浆损耗复盘系统</h1>
      <nav class="app-nav">
        <a href="#" class="nav-link active" data-page="batches">批次列表</a>
        <a href="#" class="nav-link" data-page="timeline">时间线</a>
        <a href="#" class="nav-link" data-page="loss">损耗分析</a>
      </nav>
    </header>

    <main class="app-main">
      <div id="page-batches" class="page active">
        <div class="page-header">
          <h2>换浆批次列表</h2>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="showCreateBatchModal()">新建批次</button>
            <button id="batch-export-btn" class="btn" onclick="exportSelectedBatches()" disabled>批量导出简报</button>
            <button class="btn" onclick="refreshBatchList()">刷新</button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-item">
            <label>机台筛选:</label>
            <select id="filter-machine" onchange="applyFilters()">
              <option value="">全部机台</option>
            </select>
          </div>
          <div class="filter-item">
            <label>状态:</label>
            <select id="filter-status" onchange="applyFilters()">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="processing">计算中</option>
              <option value="completed">已完成</option>
              <option value="reviewed">已复盘</option>
            </select>
          </div>
          <div class="filter-item">
            <label>开始日期:</label>
            <input type="date" id="filter-start-date" onchange="applyFilters()">
          </div>
          <div class="filter-item">
            <label>结束日期:</label>
            <input type="date" id="filter-end-date" onchange="applyFilters()">
          </div>
          <div class="filter-item">
            <button class="btn btn-sm" onclick="clearSavedFilters()" title="清除筛选记忆">清除记忆</button>
          </div>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 40px;">
                  <input type="checkbox" id="select-all-batches" onchange="toggleSelectAll(this.checked)">
                </th>
                <th>批次号</th>
                <th>机台</th>
                <th>原浆类型</th>
                <th>新浆类型</th>
                <th>开始时间</th>
                <th>结束时间</th>
                <th>状态</th>
                <th>总损耗(kg)</th>
                <th>损耗率(%)</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="batch-table-body">
            </tbody>
          </table>
        </div>

        <div class="pagination" id="pagination">
        </div>
      </div>

      <div id="page-timeline" class="page">
        <div class="page-header">
          <h2>换浆时间线</h2>
          <div class="page-actions">
            <select id="timeline-batch-select" onchange="loadTimelineData()">
              <option value="">选择批次</option>
            </select>
            <button class="btn" onclick="refreshTimeline()">刷新</button>
          </div>
        </div>

        <div id="timeline-container" class="timeline-container">
          <div class="empty-state">请选择一个批次查看时间线</div>
        </div>
      </div>

      <div id="page-loss" class="page">
        <div class="page-header">
          <h2>损耗分段分析</h2>
          <div class="page-actions">
            <select id="loss-batch-select" onchange="loadLossData()">
              <option value="">选择批次</option>
            </select>
            <button class="btn btn-primary" onclick="recalculateLoss()">重新计算</button>
            <button class="btn" onclick="exportLossReport()">导出报告</button>
            <button class="btn" onclick="exportBriefReport()">导出简报</button>
          </div>
        </div>

        <div id="loss-summary" class="loss-summary">
        </div>

        <div id="loss-segments" class="loss-segments">
          <div class="empty-state">请选择一个批次查看损耗分析</div>
        </div>
      </div>
    </main>
  </div>

  <div id="create-batch-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新建换浆批次</h3>
        <span class="close" onclick="closeCreateBatchModal()">&times;</span>
      </div>
      <div class="modal-body">
        <form id="create-batch-form">
          <div class="form-group">
            <label>批次号 *</label>
            <input type="text" name="batchNo" required>
          </div>
          <div class="form-group">
            <label>机台编号 *</label>
            <input type="text" name="machineId" required>
          </div>
          <div class="form-group">
            <label>原浆类型 *</label>
            <input type="text" name="oldPulpType" required>
          </div>
          <div class="form-group">
            <label>新浆类型 *</label>
            <input type="text" name="newPulpType" required>
          </div>
          <div class="form-group">
            <label>操作员</label>
            <input type="text" name="operator">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeCreateBatchModal()">取消</button>
        <button class="btn btn-primary" onclick="submitCreateBatch()">创建</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/batches.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/loss.js"></script>
</body>
</html>

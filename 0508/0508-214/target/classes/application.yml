server:
  port: 8080

spring:
  application:
    name: prison-call-system
  datasource:
    url: jdbc:h2:mem:prison_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

system:
  call:
    monthly-quota: 3
    max-duration-minutes: 15

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员面板 - 抽卡模拟器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 管理员面板</h1>
            <p class="subtitle">管理卡池配置和卡牌设置</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active">卡池管理</div>
            <div class="nav-tab" onclick="window.location.href='/'">返回用户界面</div>
        </div>

        <div class="main-content">
            <div class="admin-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                    <h2 style="margin:0; color:#333">卡池列表</h2>
                    <button class="btn btn-primary" onclick="openCreatePoolModal()">+ 创建卡池</button>
                </div>

                <div id="poolList" class="pool-list">
                    <div style="text-align:center; padding:40px; color:#999">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="poolModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">创建卡池</h3>
            <form id="poolForm" onsubmit="savePool(event)">
                <div class="form-group">
                    <label>卡池名称 *</label>
                    <input type="text" id="poolName" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="poolDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>保底阈值</label>
                        <input type="number" id="poolPityThreshold" value="90" min="1">
                    </div>
                    <div class="form-group">
                        <label>版本号</label>
                        <input type="text" id="poolVersion" value="v1.0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="poolIsActive" checked>
                        启用卡池
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closePoolModal()" style="background:#ddd; color:#333">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="cardModal" class="modal-overlay">
        <div class="modal">
            <h3>添加卡牌</h3>
            <form id="cardForm" onsubmit="saveCard(event)">
                <div class="form-group">
                    <label>卡牌名称 *</label>
                    <input type="text" id="cardName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>稀有度</label>
                        <select id="cardRarity">
                            <option value="SSR">SSR</option>
                            <option value="SR">SR</option>
                            <option value="R">R</option>
                            <option value="N">N</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>概率 (0-1)</label>
                        <input type="number" id="cardProbability" value="0.1" step="0.01" min="0" max="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>图片URL</label>
                    <input type="url" id="cardImageUrl" placeholder="https://...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeCardModal()" style="background:#ddd; color:#333">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU 实时路径追踪</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="controls">
            <div class="control-group">
                <label>
                    <input type="checkbox" id="aaToggle" checked>
                    抗锯齿 (FXAA)
                </label>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="dofToggle" checked>
                    景深 (DOF)
                </label>
            </div>
            <div class="control-group">
                <label>
                    焦距: <span id="focalLengthValue">5.0</span>
                    <input type="range" id="focalLength" min="1" max="15" step="0.1" value="5">
                </label>
            </div>
            <div class="control-group">
                <label>
                    光圈: <span id="apertureValue">0.1</span>
                    <input type="range" id="aperture" min="0" max="0.5" step="0.01" value="0.1">
                </label>
            </div>
            <div class="control-group">
                <span>FPS: <span id="fps">0</span></span>
            </div>
            <div class="control-group">
                <span>采样数: <span id="samples">0</span></span>
            </div>
        </div>
        <div class="instructions">
            <p>WASD - 移动 | 鼠标拖拽 - 旋转 | Q/E - 升降</p>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>

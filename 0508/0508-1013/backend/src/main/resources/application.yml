server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: temperature-monitor

  datasource:
    url: jdbc:mysql://localhost:3306/kindergarten?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

monitor:
  bed-count: 12
  min-temperature: 36.0
  max-temperature: 37.2
  max-rise: 0.5
  simulate-interval: 10000

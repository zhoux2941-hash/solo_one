server:
  port: 8080

spring:
  application:
    name: order-fulfillment-center
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/fulfillment;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fulfillment.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

seata:
  enabled: true
  application-id: order-fulfillment-center
  tx-service-group: order_tx_group
  enable-auto-data-source-proxy: false
  use-jdk-proxy: false
  service:
    vgroup-mapping:
      order_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
  registry:
    type: file
  config:
    type: file
  client:
    rm:
      report-success-enable: true
      table-meta-check-enable: false
      report-retry-count: 5
      lock:
        retry-interval: 10
        retry-times: 30
        retry-policy-branch-rollback-on-conflict: true
    tm:
      commit-retry-count: 5
      rollback-retry-count: 5
      default-global-transaction-timeout: 60000
      degrade-check: false
      degrade-check-period: 2000
      degrade-check-allow-times: 10

logging:
  level:
    com.fulfillment.order: debug
    io.seata: info
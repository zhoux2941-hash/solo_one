<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机场失物招领系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ 机场失物招领系统</h1>
        </header>

        <nav class="main-nav">
            <button class="nav-btn active" onclick="showSection('staff')">工作人员入口</button>
            <button class="nav-btn" onclick="showSection('passenger')">乘客入口</button>
        </nav>

        <div id="staff-section" class="section">
            <div class="sub-nav">
                <button class="sub-nav-btn active" onclick="showStaffTab('register')">物品登记</button>
                <button class="sub-nav-btn" onclick="showStaffTab('items')">物品列表</button>
                <button class="sub-nav-btn" onclick="showStaffTab('claims')">遗失申报</button>
                <button class="sub-nav-btn" onclick="showStaffTab('matches')">匹配结果</button>
                <button class="sub-nav-btn" onclick="showStaffTab('appointments')">认领预约</button>
            </div>

            <div id="staff-register" class="tab-content">
                <h2>📝 拾到物品登记</h2>
                <form id="found-item-form">
                    <div class="form-group">
                        <label>物品名称 *</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label>品牌</label>
                        <input type="text" id="brand">
                    </div>
                    <div class="form-group">
                        <label>颜色</label>
                        <input type="text" id="color">
                    </div>
                    <div class="form-group">
                        <label>拾到地点 *</label>
                        <input type="text" id="foundLocation" required placeholder="如：T2航站楼3号安检口">
                    </div>
                    <div class="form-group">
                        <label>拾到日期 *</label>
                        <input type="date" id="foundDate" required>
                    </div>
                    <div class="form-group">
                        <label>详细描述</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>物品照片</label>
                        <input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)">
                        <div id="photo-preview-container" class="photo-preview"></div>
                    </div>
                    <button type="submit" class="btn-primary">提交登记</button>
                </form>
            </div>

            <div id="staff-items" class="tab-content" style="display:none;">
                <h2>📦 物品列表</h2>
                <div id="items-list" class="list-container"></div>
            </div>

            <div id="staff-claims" class="tab-content" style="display:none;">
                <h2>📋 遗失申报列表</h2>
                <div id="claims-list" class="list-container"></div>
            </div>

            <div id="staff-matches" class="tab-content" style="display:none;">
                <h2>🔍 匹配结果</h2>
                <div class="form-group">
                    <label>选择遗失申报</label>
                    <select id="match-claim-select" onchange="loadMatches()"></select>
                </div>
                <div id="matches-results" class="list-container"></div>
            </div>

            <div id="staff-appointments" class="tab-content" style="display:none;">
                <h2>📅 认领预约管理</h2>
                <div id="appointments-list" class="list-container"></div>
            </div>
        </div>

        <div id="passenger-section" class="section" style="display:none;">
            <div class="sub-nav">
                <button class="sub-nav-btn active" onclick="showPassengerTab('claim')">遗失申报</button>
                <button class="sub-nav-btn" onclick="showPassengerTab('appointment')">预约认领</button>
            </div>

            <div id="passenger-claim" class="tab-content">
                <h2>📝 遗失物品申报</h2>
                <form id="lost-claim-form">
                    <div class="form-group">
                        <label>您的姓名 *</label>
                        <input type="text" id="passengerName" required>
                    </div>
                    <div class="form-group">
                        <label>联系方式 *</label>
                        <input type="text" id="contactInfo" required placeholder="手机号">
                    </div>
                    <div class="form-group">
                        <label>物品详细描述 *</label>
                        <textarea id="itemDescription" rows="4" required placeholder="请详细描述物品特征：如颜色、品牌、特殊标记等"></textarea>
                    </div>
                    <div class="form-group">
                        <label>遗失地点 *</label>
                        <input type="text" id="lostLocation" required placeholder="如：T1航站楼B区候机厅">
                    </div>
                    <div class="form-group">
                        <label>遗失日期</label>
                        <input type="date" id="lostDate">
                    </div>
                    <button type="submit" class="btn-primary">提交申报</button>
                </form>
            </div>

            <div id="passenger-appointment" class="tab-content" style="display:none;">
                <h2>📅 预约认领</h2>
                <div class="form-group">
                    <label>选择申报记录</label>
                    <select id="appointment-claim-select" onchange="loadClaimMatchesForAppointment()"></select>
                </div>
                <div id="claim-matches-for-appointment" class="list-container"></div>
            </div>
        </div>
    </div>

    <div id="appointment-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>预约认领</h3>
            <form id="appointment-form">
                <input type="hidden" id="appointment-foundItemId">
                <input type="hidden" id="appointment-lostClaimId">
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" id="appointment-passengerName" required>
                </div>
                <div class="form-group">
                    <label>身份证号 *</label>
                    <input type="text" id="appointment-idCardNumber" required>
                </div>
                <div class="form-group">
                    <label>联系电话 *</label>
                    <input type="text" id="appointment-contactInfo" required>
                </div>
                <div class="form-group">
                    <label>预约日期 *</label>
                    <input type="date" id="appointment-date" required>
                </div>
                <div class="form-group">
                    <label>预约时间 *</label>
                    <input type="time" id="appointment-time" required>
                </div>
                <button type="submit" class="btn-primary">确认预约</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>

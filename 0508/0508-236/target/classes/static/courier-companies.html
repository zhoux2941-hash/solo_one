<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快递品牌管理 - 社区驿站管理平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🏪 驿站管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span>📊 控制台</span>
                </a>
                <a href="users.html" class="nav-item">
                    <span>👥 用户管理</span>
                </a>
                <a href="stations.html" class="nav-item">
                    <span>🏠 驿站管理</span>
                </a>
                <a href="courier-companies.html" class="nav-item active">
                    <span>📦 快递品牌</span>
                </a>
                <a href="residents.html" class="nav-item">
                    <span>👨‍👩‍👧‍👦 居民管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <span class="user-name">加载中...</span>
                    <span class="user-role"></span>
                </div>
                <button class="btn btn-logout" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>快递品牌管理</h1>
                <button class="btn btn-primary" onclick="openCompanyModal()">+ 添加快递公司</button>
            </header>

            <div class="content-section">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>公司名称</th>
                                <th>公司编码</th>
                                <th>联系人</th>
                                <th>联系电话</th>
                                <th>服务区域</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="companyTableBody">
                        </tbody>
                    </table>
                    <div id="companyPagination" class="pagination-container">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="companyModal" class="modal">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h3 id="modalTitle">添加快递公司</h3>
                <span class="close" onclick="closeCompanyModal()">&times;</span>
            </div>
            <form id="companyForm">
                <input type="hidden" id="companyId">
                <div class="form-row">
                    <div class="form-group">
                        <label>公司名称 *</label>
                        <input type="text" id="formCompanyName" required>
                    </div>
                    <div class="form-group">
                        <label>公司编码 *</label>
                        <input type="text" id="formCompanyCode" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>联系人</label>
                        <input type="text" id="formContactPerson">
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="text" id="formContactPhone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>API地址</label>
                        <input type="text" id="formApiUrl">
                    </div>
                    <div class="form-group">
                        <label>API密钥</label>
                        <input type="text" id="formApiKey">
                    </div>
                </div>
                <div class="form-group">
                    <label>API密钥Secret</label>
                    <input type="text" id="formApiSecret">
                </div>
                <div class="form-group">
                    <label>服务区域</label>
                    <input type="text" id="formServiceArea">
                </div>
                <div class="form-group">
                    <label>结算方式</label>
                    <input type="text" id="formSettlementMethod">
                </div>
                <div class="form-group">
                    <label>派送规则</label>
                    <textarea id="formDeliveryRules" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>状态</label>
                        <select id="formEnabled">
                            <option value="true">启用</option>
                            <option value="false">禁用</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <input type="text" id="formRemark">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeCompanyModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/courier-companies.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时反欺诈监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #a0aec0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-card.total .value { color: #00d4ff; }
        .stat-card.low .value { color: #48bb78; }
        .stat-card.medium .value { color: #ecc94b; }
        .stat-card.high .value { color: #ed8936; }
        .stat-card.critical .value { color: #fc8181; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.2em;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header .badge {
            background: #fc8181;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .alerts-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .alert-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-item.CRITICAL { border-color: #fc8181; }
        .alert-item.HIGH { border-color: #ed8936; }
        .alert-item.MEDIUM { border-color: #ecc94b; }
        .alert-item.LOW { border-color: #48bb78; }

        .alert-item .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-item .alert-type {
            font-weight: 600;
            font-size: 1.1em;
        }

        .alert-item .alert-time {
            font-size: 0.85em;
            color: #a0aec0;
        }

        .alert-item .alert-details {
            font-size: 0.9em;
            color: #cbd5e0;
        }

        .alert-item .alert-meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.85em;
        }

        .rules-panel {
            padding: 20px;
        }

        .rule-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rule-item .rule-info {
            flex: 1;
        }

        .rule-item .rule-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .rule-item .rule-id {
            font-size: 0.85em;
            color: #a0aec0;
        }

        .rule-item .hit-count {
            text-align: right;
        }

        .rule-item .hit-count .number {
            font-size: 1.8em;
            font-weight: bold;
            color: #00d4ff;
        }

        .rule-item .hit-count .label {
            font-size: 0.8em;
            color: #a0aec0;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        .status-indicator.connected {
            background: #48bb78;
        }

        .status-indicator.disconnected {
            background: #fc8181;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ 实时反欺诈监控系统</h1>
        <p>
            <span class="status-indicator connected" id="wsStatus"></span>
            <span id="wsStatusText">WebSocket连接中...</span>
        </p>
    </div>

    <div class="stats-container">
        <div class="stat-card total">
            <h3>总告警数</h3>
            <div class="value" id="totalAlerts">0</div>
        </div>
        <div class="stat-card critical">
            <h3>严重告警</h3>
            <div class="value" id="criticalAlerts">0</div>
        </div>
        <div class="stat-card high">
            <h3>高危告警</h3>
            <div class="value" id="highAlerts">0</div>
        </div>
        <div class="stat-card medium">
            <h3>中危告警</h3>
            <div class="value" id="mediumAlerts">0</div>
        </div>
        <div class="stat-card low">
            <h3>低危告警</h3>
            <div class="value" id="lowAlerts">0</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <div class="panel-header">
                <span>实时告警</span>
                <span class="badge" id="newAlertsBadge">0 新告警</span>
            </div>
            <div class="alerts-list" id="alertsList"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>风控规则命中率</span>
            </div>
            <div class="rules-panel" id="rulesPanel"></div>
        </div>
    </div>

    <script>
        let newAlertsCount = 0;

        function formatTimestamp(ts) {
            const date = new Date(ts);
            return date.toLocaleString('zh-CN');
        }

        function createAlertItem(alert) {
            const item = document.createElement('div');
            item.className = `alert-item ${alert.alertLevel}`;
            item.innerHTML = `
                <div class="alert-header">
                    <span class="alert-type">${alert.alertType}</span>
                    <span class="alert-time">${formatTimestamp(alert.timestamp)}</span>
                </div>
                <div class="alert-details">${alert.description}</div>
                <div class="alert-meta">
                    <span>账户: ${alert.accountId}</span>
                    <span>规则: ${alert.ruleName}</span>
                    <span>检测耗时: ${alert.detectionTimeMs}ms</span>
                </div>
            `;
            return item;
        }

        function updateStats(stats) {
            document.getElementById('totalAlerts').textContent = stats.totalAlerts || 0;
            document.getElementById('criticalAlerts').textContent = stats.alertLevelCount?.CRITICAL || 0;
            document.getElementById('highAlerts').textContent = stats.alertLevelCount?.HIGH || 0;
            document.getElementById('mediumAlerts').textContent = stats.alertLevelCount?.MEDIUM || 0;
            document.getElementById('lowAlerts').textContent = stats.alertLevelCount?.LOW || 0;

            const rulesPanel = document.getElementById('rulesPanel');
            rulesPanel.innerHTML = '';
            for (const [ruleId, count] of Object.entries(stats.ruleHitCount || {})) {
                const ruleItem = document.createElement('div');
                ruleItem.className = 'rule-item';
                ruleItem.innerHTML = `
                    <div class="rule-info">
                        <div class="rule-name">${ruleId}</div>
                        <div class="rule-id">Complex Fraud Pattern Detection</div>
                    </div>
                    <div class="hit-count">
                        <div class="number">${count}</div>
                        <div class="label">命中次数</div>
                    </div>
                `;
                rulesPanel.appendChild(ruleItem);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/alerts`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById('wsStatus').className = 'status-indicator connected';
                document.getElementById('wsStatusText').textContent = 'WebSocket已连接';
            };

            ws.onmessage = function(event) {
                const alert = JSON.parse(event.data);
                const alertsList = document.getElementById('alertsList');
                alertsList.insertBefore(createAlertItem(alert), alertsList.firstChild);

                newAlertsCount++;
                document.getElementById('newAlertsBadge').textContent = `${newAlertsCount} 新告警`;
                document.getElementById('newAlertsBadge').style.display = 'inline';

                fetchStats();
            };

            ws.onclose = function() {
                document.getElementById('wsStatus').className = 'status-indicator disconnected';
                document.getElementById('wsStatusText').textContent = 'WebSocket已断开，正在重连...';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        function fetchStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => updateStats(data))
                .catch(error => console.error('Error fetching stats:', error));
        }

        function fetchAlerts() {
            fetch('/api/alerts?limit=50')
                .then(response => response.json())
                .then(alerts => {
                    const alertsList = document.getElementById('alertsList');
                    alertsList.innerHTML = '';
                    alerts.forEach(alert => {
                        alertsList.appendChild(createAlertItem(alert));
                    });
                })
                .catch(error => console.error('Error fetching alerts:', error));
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchStats();
            fetchAlerts();
            connectWebSocket();
            setInterval(fetchStats, 5000);
        });
    </script>
</body>
</html>

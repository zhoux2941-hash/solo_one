<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市地标剪影猜谜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
body{font-family:'Noto Sans SC',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}
.container{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;margin-bottom:24px;backdrop-filter:blur(10px)}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,#f6d365,#fda085);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.score-display{display:flex;gap:16px;font-size:14px;font-weight:500}
.score-display span{padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.08)}
.score-val{color:#fda085;font-weight:700}
.silhouette-card{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px;margin-bottom:24px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.silhouette-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 80%,rgba(253,160,133,.06) 0%,transparent 50%);pointer-events:none}
.silhouette-wrapper{width:280px;height:280px;display:flex;align-items:center;justify-content:center;position:relative}
.silhouette-wrapper svg{width:100%;height:100%;filter:drop-shadow(0 0 24px rgba(253,160,133,.25))}
.silhouette-wrapper svg .body{fill:#1e1e3e!important}
.silhouette-wrapper svg .cutout{fill:#0c0c1e!important}
.hint-text{margin-top:16px;font-size:13px;color:rgba(255,255,255,.35);letter-spacing:1px}
.progress-bar{width:100%;display:flex;gap:6px;margin-bottom:20px;justify-content:center}
.progress-dot{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);transition:all .3s}
.progress-dot.active{background:rgba(253,160,133,.5)}
.progress-dot.correct{background:#34d399}
.progress-dot.wrong{background:#f87171}
.options-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.option-btn{padding:16px;border:2px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:all .25s;font-family:'Noto Sans SC',sans-serif;position:relative;overflow:hidden}
.option-btn:hover:not(.disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.option-btn:active:not(.disabled){transform:translateY(0)}
.option-btn.correct-ans{border-color:#34d399;background:rgba(52,211,153,.15);color:#34d399}
.option-btn.wrong-ans{border-color:#f87171;background:rgba(248,113,113,.15);color:#f87171}
.option-btn.disabled{cursor:default;opacity:.6}
.option-btn.correct-ans.disabled,.option-btn.wrong-ans.disabled{opacity:1}
.feedback{width:100%;text-align:center;padding:12px;border-radius:12px;font-size:15px;font-weight:500;margin-bottom:16px;opacity:0;transition:all .3s;min-height:0}
.feedback.show{opacity:1}
.feedback.correct-fb{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.feedback.wrong-fb{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.2)}
.result-panel{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px 32px;text-align:center;display:none;flex-direction:column;align-items:center;gap:20px}
.result-panel.show{display:flex}
.result-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#f6d365,#fda085);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-score{font-size:64px;font-weight:900;color:#fda085;line-height:1}
.result-detail{font-size:15px;color:rgba(255,255,255,.5);line-height:1.8}
.result-detail .green{color:#34d399}
.result-detail .red{color:#f87171}
.next-btn{padding:14px 48px;border:none;border-radius:14px;background:linear-gradient(135deg,#f6d365,#fda085);color:#1a1a2e;font-size:16px;font-weight:700;cursor:pointer;transition:all .25s;font-family:'Noto Sans SC',sans-serif}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(253,160,133,.3)}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.animate-in{animation:slideIn .4s ease-out}
.animate-pop{animation:popIn .3s ease-out}
@media(max-width:480px){.silhouette-wrapper{width:220px;height:220px}.header h1{font-size:16px}.option-btn{padding:12px;font-size:14px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="header">
    <h1>🏛 地标剪影猜谜</h1>
    <div class="score-display">
      <span>第 <b class="score-val" id="roundNum">1</b> 轮</span>
      <span>得分 <b class="score-val" id="scoreVal">0</b></span>
    </div>
  </div>
  <div class="progress-bar" id="progressBar"></div>
  <div id="gameArea">
    <div class="silhouette-card animate-pop" id="silhouetteCard">
      <div class="silhouette-wrapper" id="silhouetteWrapper"></div>
      <div class="hint-text" id="hintText"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>
  <div class="result-panel" id="resultPanel">
    <div class="result-title">本轮结束</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="next-btn" id="nextBtn">下一轮</button>
  </div>
</div>

const QUESTIONS_PER_ROUND=5;
const SCORE_CORRECT=10;
const SCORE_WRONG=-5;

let currentRound=1;
let totalScore=0;
let roundScore=0;
let currentQuestion=0;
let roundQuestions=[];
let answered=false;
let roundCorrect=0;
let roundWrong=0;

function generateStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.width=s.style.height=Math.random()*2.5+0.5+'px';
    s.style.setProperty('--d',(Math.random()*3+1.5)+'s');
    s.style.animationDelay=Math.random()*3+'s';
    c.appendChild(s);
  }
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDistractors(correctCity,count){
  const pool=LANDMARKS.filter(l=>l.city!==correctCity);
  const shuffled=shuffle(pool);
  return shuffled.slice(0,count).map(l=>l.city);
}

function startRound(){
  roundScore=0;
  roundCorrect=0;
  roundWrong=0;
  currentQuestion=0;
  roundQuestions=shuffle(LANDMARKS).slice(0,QUESTIONS_PER_ROUND);
  document.getElementById('roundNum').textContent=currentRound;
  document.getElementById('scoreVal').textContent=totalScore;
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('gameArea').style.display='block';
  renderProgress();
  showQuestion();
}

function renderProgress(){
  const bar=document.getElementById('progressBar');
  bar.innerHTML='';
  for(let i=0;i<QUESTIONS_PER_ROUND;i++){
    const dot=document.createElement('div');
    dot.className='progress-dot';
    if(i<currentQuestion){
      dot.classList.add(roundQuestions[i]._correct?'correct':'wrong');
    }else if(i===currentQuestion){
      dot.classList.add('active');
    }
    bar.appendChild(dot);
  }
}

function showQuestion(){
  answered=false;
  const q=roundQuestions[currentQuestion];
  const wrapper=document.getElementById('silhouetteWrapper');
  wrapper.innerHTML=q.svg;
  wrapper.classList.remove('animate-pop');
  void wrapper.offsetWidth;
  wrapper.classList.add('animate-pop');

  const hints=['这是个著名的城市地标','来自'+q.continent+'的地标','这座建筑位于某座城市'];
  document.getElementById('hintText').textContent=hints[0];

  const feedback=document.getElementById('feedback');
  feedback.className='feedback';
  feedback.textContent='';

  const options=getDistractors(q.city,3);
  options.push(q.city);
  const shuffledOpts=shuffle(options);

  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';
  shuffledOpts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.textContent=opt;
    btn.addEventListener('click',()=>handleAnswer(btn,opt,q));
    grid.appendChild(btn);
  });

  renderProgress();
}

function handleAnswer(btn,selected,q){
  if(answered)return;
  answered=true;

  const isCorrect=selected===q.city;
  q._correct=isCorrect;

  if(isCorrect){
    roundCorrect++;
    roundScore+=SCORE_CORRECT;
    totalScore+=SCORE_CORRECT;
    btn.classList.add('correct-ans');
    const fb=document.getElementById('feedback');
    fb.className='feedback show correct-fb';
    fb.textContent='✓ 答对了！+10分';
  }else{
    roundWrong++;
    roundScore+=SCORE_WRONG;
    totalScore+=SCORE_WRONG;
    btn.classList.add('wrong-ans');
    const fb=document.getElementById('feedback');
    fb.className='feedback show wrong-fb';
    fb.textContent='✗ 答错了！正确答案是：'+q.city+'（'+q.name+'） -5分';
    document.querySelectorAll('.option-btn').forEach(b=>{
      if(b.textContent===q.city){
        b.classList.add('correct-ans');
      }
    });
  }

  document.querySelectorAll('.option-btn').forEach(b=>b.classList.add('disabled'));
  document.getElementById('scoreVal').textContent=totalScore;
  renderProgress();

  setTimeout(()=>{
    currentQuestion++;
    if(currentQuestion<QUESTIONS_PER_ROUND){
      showQuestion();
    }else{
      showResult();
    }
  },1800);
}

function showResult(){
  document.getElementById('gameArea').style.display='none';
  const panel=document.getElementById('resultPanel');
  panel.classList.add('show');
  document.getElementById('resultScore').textContent=roundScore;
  document.getElementById('resultDetail').innerHTML=
    '答对 <span class="green">'+roundCorrect+'</span> 题，答错 <span class="red">'+roundWrong+'</span> 题<br>本轮得分：<b>'+roundScore+'</b> 分<br>累计总分：<b>'+totalScore+'</b> 分';

  renderProgress();
}

document.getElementById('nextBtn').addEventListener('click',()=>{
  currentRound++;
  startRound();
});

generateStars();
startRound();
})();
</script>

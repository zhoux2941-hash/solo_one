<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 - 建筑施工现场管控系统</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">项目管理</h2>
                <button class="btn btn-primary" onclick="openAddModal()">+ 新建项目</button>
            </div>

            <div class="search-bar">
                <div class="search-item">
                    <label>关键词搜索</label>
                    <input type="text" id="searchKeyword" class="form-input" placeholder="项目名称/编号/负责人">
                </div>
                <div class="search-item">
                    <label>项目状态</label>
                    <select id="searchStatus" class="form-select">
                        <option value="">全部</option>
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select>
                </div>
                <div class="search-buttons">
                    <button class="btn btn-primary" onclick="loadProjectList()">搜索</button>
                    <button class="btn btn-info" onclick="resetSearch()">重置</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>项目名称</th>
                            <th>项目编号</th>
                            <th>施工地址</th>
                            <th>建设单位</th>
                            <th>承建单位</th>
                            <th>项目负责人</th>
                            <th>开工日期</th>
                            <th>竣工日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody"></tbody>
                </table>
            </div>
            <div id="pagination"></div>
        </div>
    </div>

    <div id="projectModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">新建项目</h3>
                <button class="modal-close" onclick="closeModal('projectModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label class="form-label">项目名称 <span style="color: #f56c6c;">*</span></label>
                        <input type="text" name="projectName" class="form-input" placeholder="请输入项目名称">
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目编号</label>
                        <input type="text" name="projectCode" class="form-input" placeholder="请输入项目编号">
                    </div>
                    <div class="form-group">
                        <label class="form-label">施工地址</label>
                        <input type="text" name="constructionAddress" class="form-input" placeholder="请输入施工地址">
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">建设单位</label>
                                <input type="text" name="constructionUnit" class="form-input" placeholder="请输入建设单位">
                            </div>
                            <div>
                                <label class="form-label">承建单位</label>
                                <input type="text" name="contractorUnit" class="form-input" placeholder="请输入承建单位">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">开工日期</label>
                                <input type="date" name="startDate" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">竣工日期</label>
                                <input type="date" name="endDate" class="form-input">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">项目负责人</label>
                                <input type="text" name="projectManager" class="form-input" placeholder="请输入项目负责人">
                            </div>
                            <div>
                                <label class="form-label">联系电话</label>
                                <input type="text" name="managerPhone" class="form-input" placeholder="请输入联系电话">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目描述</label>
                        <textarea name="description" class="form-textarea" placeholder="请输入项目描述"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-info" onclick="closeModal('projectModal')">取消</button>
                <button class="btn btn-primary" onclick="saveProject()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/http.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/layout.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let currentEditId = null;

        const projectRules = {
            projectName: [{ type: 'required', message: '请输入项目名称' }],
        };

        document.addEventListener('DOMContentLoaded', function() {
            initPage('project');
            loadProjectList();
        });

        async function loadProjectList() {
            const keyword = document.getElementById('searchKeyword').value;
            const status = document.getElementById('searchStatus').value;

            const params = {
                pageNum: currentPage,
                pageSize: pageSize,
            };

            if (keyword) params.keyword = keyword;
            if (status !== '') params.status = status;

            const result = await http.get('/api/project/list', params);

            if (result.success) {
                renderProjectTable(result.data.list);
                renderPagination('pagination', result.data.pageNum, result.data.pageSize, result.data.total, 'goToPage');
            }
        }

        function renderProjectTable(projects) {
            const tbody = document.getElementById('projectTableBody');

            if (!projects || projects.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">暂无数据</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = projects.map(project => `
                <tr>
                    <td>${project.projectName}</td>
                    <td>${project.projectCode || '-'}</td>
                    <td>${project.constructionAddress || '-'}</td>
                    <td>${project.constructionUnit || '-'}</td>
                    <td>${project.contractorUnit || '-'}</td>
                    <td>${project.projectManager || '-'}</td>
                    <td>${formatDate(project.startDate)}</td>
                    <td>${formatDate(project.endDate)}</td>
                    <td>
                        <span class="status-tag ${project.status === 1 ? 'status-active' : 'status-inactive'}">
                            ${project.status === 1 ? '启用' : '停用'}
                        </span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-warning btn-small" onclick="toggleStatus(${project.id})">
                                ${project.status === 1 ? '停用' : '启用'}
                            </button>
                            <button class="btn btn-primary btn-small" onclick="openEditModal(${project.id})">编辑</button>
                            <button class="btn btn-success btn-small" onclick="archiveProject(${project.id})">归档</button>
                            <button class="btn btn-danger btn-small" onclick="deleteProject(${project.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function goToPage(page) {
            currentPage = page;
            loadProjectList();
        }

        function resetSearch() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchStatus').value = '';
            currentPage = 1;
            loadProjectList();
        }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = '新建项目';
            document.getElementById('projectForm').reset();
            Validator.clearErrors('projectForm');
            openModal('projectModal');
        }

        async function openEditModal(id) {
            currentEditId = id;
            document.getElementById('modalTitle').textContent = '编辑项目';

            const result = await http.get(`/api/project/${id}`);

            if (result.success) {
                const project = result.data;
                const form = document.getElementById('projectForm');
                form.querySelector('[name="id"]').value = project.id;
                form.querySelector('[name="projectName"]').value = project.projectName || '';
                form.querySelector('[name="projectCode"]').value = project.projectCode || '';
                form.querySelector('[name="constructionAddress"]').value = project.constructionAddress || '';
                form.querySelector('[name="constructionUnit"]').value = project.constructionUnit || '';
                form.querySelector('[name="contractorUnit"]').value = project.contractorUnit || '';
                form.querySelector('[name="startDate"]').value = project.startDate ? project.startDate.split('T')[0] : '';
                form.querySelector('[name="endDate"]').value = project.endDate ? project.endDate.split('T')[0] : '';
                form.querySelector('[name="projectManager"]').value = project.projectManager || '';
                form.querySelector('[name="managerPhone"]').value = project.managerPhone || '';
                form.querySelector('[name="description"]').value = project.description || '';

                Validator.clearErrors('projectForm');
                openModal('projectModal');
            }
        }

        async function saveProject() {
            const formData = Validator.getFormData('projectForm');
            const validation = Validator.validate(projectRules, formData);

            if (!validation.isValid) {
                Validator.showErrors('projectForm', validation.errors);
                return;
            }

            Validator.clearErrors('projectForm');

            let result;
            if (currentEditId) {
                result = await http.put(`/api/project/${currentEditId}`, formData);
            } else {
                result = await http.post('/api/project', formData);
            }

            if (result.success) {
                showToast(currentEditId ? '更新成功' : '添加成功', 'success');
                closeModal('projectModal');
                loadProjectList();
            } else {
                showToast(result.message, 'error');
            }
        }

        async function toggleStatus(id) {
            if (!confirm('确定要切换该项目的状态吗？')) return;

            const result = await http.put(`/api/project/${id}/toggle-status`);

            if (result.success) {
                showToast('状态切换成功', 'success');
                loadProjectList();
            } else {
                showToast(result.message, 'error');
            }
        }

        async function archiveProject(id) {
            if (!confirm('确定要归档该项目吗？归档后项目将不再显示在列表中。')) return;

            const result = await http.put(`/api/project/${id}/archive`);

            if (result.success) {
                showToast('项目已归档', 'success');
                loadProjectList();
            } else {
                showToast(result.message, 'error');
            }
        }

        async function deleteProject(id) {
            if (!confirm('确定要删除该项目吗？此操作不可恢复！')) return;

            const result = await http.delete(`/api/project/${id}`);

            if (result.success) {
                showToast('删除成功', 'success');
                loadProjectList();
            } else {
                showToast(result.message, 'error');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进度管理 - 建筑施工现场管控系统</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .progress-bar {
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #67c23a, #85ce61);
            transition: width 0.3s ease;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-not-started { background-color: #909399; color: white; }
        .status-in-progress { background-color: #409eff; color: white; }
        .status-delayed { background-color: #f56c6c; color: white; }
        .status-completed { background-color: #67c23a; color: white; }
        .node-tree { margin-left: 20px; border-left: 2px dashed #ddd; padding-left: 15px; }
        .node-item { padding: 10px 0; }
        .node-header { display: flex; align-items: center; gap: 10px; }
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background-color: #e9ecef; }
        .timeline-item { position: relative; padding-bottom: 20px; }
        .timeline-dot { position: absolute; left: -26px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background-color: #409eff; border: 3px solid white; box-shadow: 0 0 0 2px #409eff; }
        .obstacles { background-color: #fef0f0; border-left: 4px solid #f56c6c; padding: 10px 15px; margin: 10px 0; }
        .chart-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .stat-value { font-size: 32px; font-weight: bold; color: #303133; }
        .stat-label { color: #909399; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="chart-container">
            <div class="stat-card">
                <div class="stat-value" id="totalNodes">0</div>
                <div class="stat-label">总节点数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedNodes">0</div>
                <div class="stat-label">已完成节点</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="inProgressNodes">0</div>
                <div class="stat-label">进行中节点</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgProgress">0%</div>
                <div class="stat-label">平均进度</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">施工进度管理</h2>
                <div>
                    <button class="btn btn-primary" onclick="openAddNodeModal()">+ 新增节点</button>
                    <button class="btn btn-success" onclick="openReportModal()">进度上报</button>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-item">
                    <label>所属项目</label>
                    <select id="searchProjectId" class="form-select" onchange="loadNodeList()">
                        <option value="">全部项目</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>节点状态</label>
                    <select id="searchStatus" class="form-select" onchange="loadNodeList()">
                        <option value="">全部状态</option>
                        <option value="NOT_STARTED">未开始</option>
                        <option value="IN_PROGRESS">进行中</option>
                        <option value="DELAYED">已延期</option>
                        <option value="COMPLETED">已完成</option>
                    </select>
                </div>
                <div class="search-buttons">
                    <button class="btn btn-primary" onclick="loadNodeList()">刷新</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>节点名称</th>
                            <th>节点类型</th>
                            <th>负责人</th>
                            <th>计划工期</th>
                            <th>进度</th>
                            <th>状态</th>
                            <th>遇到阻碍</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="nodeTableBody"></tbody>
                </table>
            </div>
            <div id="pagination"></div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="card-header">
                <h3 class="card-title">进度上报历史</h3>
            </div>
            <div class="timeline" id="reportTimeline">
                <p style="color: #909399;">请选择项目查看进度上报记录</p>
            </div>
        </div>
    </div>

    <div id="nodeModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="nodeModalTitle">新增节点</h3>
                <button class="modal-close" onclick="closeModal('nodeModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="nodeForm">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label class="form-label">所属项目 <span style="color: #f56c6c;">*</span></label>
                        <select name="projectId" class="form-select">
                            <option value="">请选择项目</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">父级节点</label>
                        <select name="parentId" class="form-select" id="parentNodeSelect">
                            <option value="">无（根节点）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">节点名称 <span style="color: #f56c6c;">*</span></label>
                        <input type="text" name="nodeName" class="form-input" placeholder="请输入节点名称">
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">节点编号</label>
                                <input type="text" name="nodeCode" class="form-input" placeholder="请输入节点编号">
                            </div>
                            <div>
                                <label class="form-label">节点类型</label>
                                <select name="nodeType" class="form-select">
                                    <option value="主体工程">主体工程</option>
                                    <option value="基础工程">基础工程</option>
                                    <option value="装饰工程">装饰工程</option>
                                    <option value="安装工程">安装工程</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">计划开始日期</label>
                                <input type="date" name="plannedStartDate" class="form-input">
                            </div>
                            <div>
                                <label class="form-label">计划完成日期</label>
                                <input type="date" name="plannedEndDate" class="form-input">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">负责人</label>
                                <input type="text" name="responsiblePerson" class="form-input" placeholder="请输入负责人姓名">
                            </div>
                            <div>
                                <label class="form-label">联系电话</label>
                                <input type="text" name="responsiblePhone" class="form-input" placeholder="请输入联系电话">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">节点描述</label>
                        <textarea name="description" class="form-textarea" placeholder="请输入节点描述"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-info" onclick="closeModal('nodeModal')">取消</button>
                <button class="btn btn-primary" onclick="saveNode()">保存</button>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">进度上报</h3>
                <button class="modal-close" onclick="closeModal('reportModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="reportForm">
                    <div class="form-group">
                        <label class="form-label">所属项目 <span style="color: #f56c6c;">*</span></label>
                        <select name="projectId" class="form-select" onchange="loadProjectNodes(this.value)">
                            <option value="">请选择项目</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">施工节点 <span style="color: #f56c6c;">*</span></label>
                        <select name="nodeId" class="form-select" id="reportNodeSelect">
                            <option value="">请先选择项目</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">当前进度 (%) <span style="color: #f56c6c;">*</span></label>
                                <input type="number" name="progressRate" class="form-input" placeholder="请输入进度百分比" min="0" max="100">
                            </div>
                            <div>
                                <label class="form-label">上报人</label>
                                <input type="text" name="reporter" class="form-input" placeholder="请输入上报人姓名">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">今日施工内容</label>
                        <textarea name="workContent" class="form-textarea" placeholder="请描述今日完成的施工内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">遇到阻碍</label>
                        <textarea name="obstacles" class="form-textarea" placeholder="请描述施工中遇到的问题"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">解决方案</label>
                        <textarea name="solutions" class="form-textarea" placeholder="请描述针对问题采取的解决方案"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">下一步计划</label>
                        <textarea name="nextPlan" class="form-textarea" placeholder="请描述下一步施工计划"></textarea>
                    </div>
                    <div class="form-group">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <label class="form-label">天气情况</label>
                                <select name="weatherCondition" class="form-select">
                                    <option value="晴">晴</option>
                                    <option value="多云">多云</option>
                                    <option value="阴">阴</option>
                                    <option value="小雨">小雨</option>
                                    <option value="大雨">大雨</option>
                                    <option value="雪">雪</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">现场工人数</label>
                                <input type="number" name="workerCount" class="form-input" placeholder="请输入现场工人数" min="0">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-info" onclick="closeModal('reportModal')">取消</button>
                <button class="btn btn-primary" onclick="submitReport()">提交上报</button>
            </div>
        </div>
    </div>

    <script src="js/http.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/layout.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let currentEditNodeId = null;

        const statusText = {
            'NOT_STARTED': '未开始',
            'IN_PROGRESS': '进行中',
            'DELAYED': '已延期',
            'COMPLETED': '已完成'
        };

        const statusClass = {
            'NOT_STARTED': 'status-not-started',
            'IN_PROGRESS': 'status-in-progress',
            'DELAYED': 'status-delayed',
            'COMPLETED': 'status-completed'
        };

        document.addEventListener('DOMContentLoaded', function() {
            initPage('progress');
            loadProjects();
            loadNodeList();
        });

        async function loadProjects() {
            const result = await http.get('/api/project/active');
            if (result.success) {
                const options = result.data.map(p => `<option value="${p.id}">${p.projectName}</option>`).join('');
                document.querySelectorAll('select[name="projectId"]').forEach(select => {
                    const currentValue = select.value;
                    select.innerHTML = '<option value="">请选择项目</option>' + options;
                    select.value = currentValue;
                });
            }
        }

        async function loadProjectNodes(projectId) {
            const select = document.getElementById('reportNodeSelect');
            if (!projectId) {
                select.innerHTML = '<option value="">请先选择项目</option>';
                return;
            }

            const result = await http.get(`/api/construction-node/project/${projectId}`);
            if (result.success) {
                select.innerHTML = '<option value="">请选择施工节点</option>' + 
                    result.data.map(n => `<option value="${n.id}">${n.nodeName} (${n.progressRate || 0}%)</option>`).join('');
            }
        }

        async function loadNodeList() {
            const projectId = document.getElementById('searchProjectId').value;
            const currentStatus = document.getElementById('searchStatus').value;

            const params = {
                pageNum: currentPage,
                pageSize: pageSize,
            };

            if (projectId) params.projectId = projectId;
            if (currentStatus) params.currentStatus = currentStatus;

            const result = await http.get('/api/construction-node/list', params);

            if (result.success) {
                renderNodeTable(result.data.list);
                renderPagination('pagination', result.data.pageNum, result.data.pageSize, result.data.total, 'goToPage');
                updateStats(result.data.list);
            }

            if (projectId) {
                loadReportHistory(projectId);
            }
        }

        function updateStats(nodes) {
            if (!nodes || nodes.length === 0) {
                document.getElementById('totalNodes').textContent = '0';
                document.getElementById('completedNodes').textContent = '0';
                document.getElementById('inProgressNodes').textContent = '0';
                document.getElementById('avgProgress').textContent = '0%';
                return;
            }

            const total = nodes.length;
            const completed = nodes.filter(n => n.currentStatus === 'COMPLETED').length;
            const inProgress = nodes.filter(n => n.currentStatus === 'IN_PROGRESS').length;
            const avgProgress = nodes.reduce((sum, n) => sum + (n.progressRate || 0), 0) / total;

            document.getElementById('totalNodes').textContent = total;
            document.getElementById('completedNodes').textContent = completed;
            document.getElementById('inProgressNodes').textContent = inProgress;
            document.getElementById('avgProgress').textContent = avgProgress.toFixed(1) + '%';
        }

        function renderNodeTable(nodes) {
            const tbody = document.getElementById('nodeTableBody');

            if (!nodes || nodes.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">暂无节点数据</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = nodes.map(node => `
                <tr>
                    <td><strong>${node.nodeName}</strong></td>
                    <td><span class="badge">${node.nodeType || '-'}</span></td>
                    <td>${node.responsiblePerson || '-'}</td>
                    <td>${formatDate(node.plannedStartDate)} ~ ${formatDate(node.plannedEndDate)}</td>
                    <td style="width: 150px;">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${node.progressRate || 0}%">${node.progressRate || 0}%</div>
                        </div>
                    </td>
                    <td><span class="status-badge ${statusClass[node.currentStatus]}">${statusText[node.currentStatus]}</span></td>
                    <td>${node.obstacles ? '<span style="color: #f56c6c;">有阻碍</span>' : '无'}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-primary btn-small" onclick="openEditNodeModal(${node.id})">编辑</button>
                            <button class="btn btn-success btn-small" onclick="viewNodeReports(${node.id})">上报记录</button>
                            <button class="btn btn-danger btn-small" onclick="deleteNode(${node.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function loadReportHistory(projectId) {
            const result = await http.get('/api/progress-report/list', { projectId, pageNum: 1, pageSize: 20 });
            const timeline = document.getElementById('reportTimeline');

            if (!result.success || !result.data.list || result.data.list.length === 0) {
                timeline.innerHTML = '<p style="color: #909399;">暂无进度上报记录</p>';
                return;
            }

            const reports = result.data.list;
            const nodeNames = {};

            for (const report of reports) {
                if (!nodeNames[report.nodeId]) {
                    const nodeResult = await http.get(`/api/construction-node/${report.nodeId}`);
                    if (nodeResult.success) {
                        nodeNames[report.nodeId] = nodeResult.data.nodeName;
                    }
                }
            }

            timeline.innerHTML = reports.map(report => `
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div style="background: #f5f7fa; padding: 15px; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong>${nodeNames[report.nodeId] || '未知节点'}</strong>
                            <span style="color: #909399; font-size: 12px;">${formatDate(report.reportDate)}</span>
                        </div>
                        <div style="margin-bottom: 8px;">
                            <span class="badge badge-success">进度: ${report.progressRate || 0}%</span>
                            <span style="margin-left: 10px; color: #606266;">上报人: ${report.reporter || '-'}</span>
                        </div>
                        <div style="color: #606266; font-size: 14px;">${report.workContent || '无描述'}</div>
                        ${report.obstacles ? `<div class="obstacles"><strong>遇到阻碍:</strong> ${report.obstacles}</div>` : ''}
                        ${report.solutions ? `<div style="background: #f0f9eb; border-left: 4px solid #67c23a; padding: 10px 15px; margin-top: 10px;"><strong>解决方案:</strong> ${report.solutions}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function goToPage(page) {
            currentPage = page;
            loadNodeList();
        }

        async function openAddNodeModal() {
            currentEditNodeId = null;
            document.getElementById('nodeModalTitle').textContent = '新增节点';
            document.getElementById('nodeForm').reset();
            document.getElementById('parentNodeSelect').innerHTML = '<option value="">无（根节点）</option>';

            const projectId = document.getElementById('searchProjectId').value;
            if (projectId) {
                const result = await http.get(`/api/construction-node/project/${projectId}`);
                if (result.success) {
                    document.getElementById('parentNodeSelect').innerHTML = '<option value="">无（根节点）</option>' +
                        result.data.map(n => `<option value="${n.id}">${n.nodeName}</option>`).join('');
                }
            }

            Validator.clearErrors('nodeForm');
            openModal('nodeModal');
        }

        async function openEditNodeModal(id) {
            currentEditNodeId = id;
            document.getElementById('nodeModalTitle').textContent = '编辑节点';

            const result = await http.get(`/api/construction-node/${id}`);

            if (result.success) {
                const node = result.data;
                const form = document.getElementById('nodeForm');
                form.querySelector('[name="id"]').value = node.id;
                form.querySelector('[name="projectId"]').value = node.projectId;
                form.querySelector('[name="nodeName"]').value = node.nodeName || '';
                form.querySelector('[name="nodeCode"]').value = node.nodeCode || '';
                form.querySelector('[name="nodeType"]').value = node.nodeType || '';
                form.querySelector('[name="plannedStartDate"]').value = node.plannedStartDate ? node.plannedStartDate.split('T')[0] : '';
                form.querySelector('[name="plannedEndDate"]').value = node.plannedEndDate ? node.plannedEndDate.split('T')[0] : '';
                form.querySelector('[name="responsiblePerson"]').value = node.responsiblePerson || '';
                form.querySelector('[name="responsiblePhone"]').value = node.responsiblePhone || '';
                form.querySelector('[name="description"]').value = node.description || '';

                const parentResult = await http.get(`/api/construction-node/project/${node.projectId}`);
                if (parentResult.success) {
                    document.getElementById('parentNodeSelect').innerHTML = '<option value="">无（根节点）</option>' +
                        parentResult.data.filter(n => n.id !== node.id).map(n => `<option value="${n.id}" ${n.id === node.parentId ? 'selected' : ''}>${n.nodeName}</option>`).join('');
                }

                Validator.clearErrors('nodeForm');
                openModal('nodeModal');
            }
        }

        async function saveNode() {
            const formData = Validator.getFormData('nodeForm');

            let result;
            if (currentEditNodeId) {
                result = await http.put(`/api/construction-node/${currentEditNodeId}`, formData);
            } else {
                result = await http.post('/api/construction-node', formData);
            }

            if (result.success) {
                showToast(currentEditNodeId ? '更新成功' : '添加成功', 'success');
                closeModal('nodeModal');
                loadNodeList();
            } else {
                showToast(result.message, 'error');
            }
        }

        async function deleteNode(id) {
            if (!confirm('确定要删除该节点吗？此操作不可恢复！')) return;

            const result = await http.delete(`/api/construction-node/${id}`);

            if (result.success) {
                showToast('删除成功', 'success');
                loadNodeList();
            } else {
                showToast(result.message, 'error');
            }
        }

        function openReportModal() {
            document.getElementById('reportForm').reset();
            document.getElementById('reportNodeSelect').innerHTML = '<option value="">请先选择项目</option>';
            Validator.clearErrors('reportForm');
            openModal('reportModal');
        }

        async function submitReport() {
            const formData = Validator.getFormData('reportForm');

            const result = await http.post('/api/progress-report', formData);

            if (result.success) {
                showToast('上报成功', 'success');
                closeModal('reportModal');
                loadNodeList();
            } else {
                showToast(result.message, 'error');
            }
        }

        async function viewNodeReports(nodeId) {
            const projectId = document.getElementById('searchProjectId').value;
            if (projectId) {
                loadReportHistory(projectId);
            }
            const timeline = document.getElementById('reportTimeline');
            timeline.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>

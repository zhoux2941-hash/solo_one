<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧供水运维调度平台 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">智慧供水运维调度平台</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码">
                </div>
                <button type="submit" class="btn">登录</button>
            </form>
        </div>
    </div>

    <script src="js/request.js"></script>
    <script src="js/validator.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            const rules = {
                username: [{ type: 'required', message: '请输入用户名' }],
                password: [{ type: 'required', message: '请输入密码' }]
            };

            const { isValid, errors } = validator.validate(formData, rules);
            validator.showErrors(errors, 'loginForm');

            if (!isValid) return;

            request.post('/auth/login', formData)
                .then(result => {
                    if (result.success) {
                        auth.login(result.token, result.user);
                        showToast('登录成功', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        showToast(result.message || '登录失败', 'error');
                    }
                })
                .catch(() => {
                    showToast('登录失败，请检查网络连接', 'error');
                });
        });

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: water-management-platform
  datasource:
    url: jdbc:h2:mem:waterdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: water-management-platform-secret-key-2024
  expiration: 86400000

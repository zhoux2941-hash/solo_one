<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流园区管理平台 - 仓库管理</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>物流园区货物中转调度管理平台</h1>
            <div class="user-info">
                <div class="menu">
                    <a href="index.html">首页</a>
                    <a href="user.html" id="userMenu">用户管理</a>
                    <a href="warehouse.html" class="active">仓库管理</a>
                </div>
                <div>
                    <span id="currentUser">正在加载...</span>
                    <button class="btn btn-sm btn-warning" onclick="logout()" style="margin-left: 10px;">退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('warehouse')">仓库管理</button>
                <button class="nav-tab" onclick="switchTab('area')">库区管理</button>
            </div>

            <div id="warehouseTab" class="tab-content active">
                <div class="search-bar">
                    <div class="form-group" style="width: 200px;">
                        <label>仓库名称</label>
                        <input type="text" class="form-control" id="whSearchName" placeholder="输入仓库名称">
                    </div>
                    <div class="form-group" style="width: 150px;">
                        <label>存储品类</label>
                        <select class="form-control" id="whSearchCategory">
                            <option value="">全部</option>
                            <option value="电子产品">电子产品</option>
                            <option value="食品饮料">食品饮料</option>
                            <option value="服装鞋帽">服装鞋帽</option>
                            <option value="五金建材">五金建材</option>
                        </select>
                    </div>
                    <div class="form-group" style="width: 150px;">
                        <label>状态</label>
                        <select class="form-control" id="whSearchStatus">
                            <option value="">全部</option>
                            <option value="AVAILABLE">可用</option>
                            <option value="FULL">已满</option>
                            <option value="MAINTENANCE">维护中</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button class="btn btn-primary" onclick="loadWarehouses()">搜索</button>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end; margin-left: auto;">
                        <button class="btn btn-success" onclick="openAddWarehouseModal()">+ 新增仓库</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>仓库编号</th>
                            <th>仓库名称</th>
                            <th>位置</th>
                            <th>存储品类</th>
                            <th>容量</th>
                            <th>已用容量</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="warehouseTableBody">
                    </tbody>
                </table>

                <div class="pagination" id="whPagination">
                </div>
            </div>

            <div id="areaTab" class="tab-content">
                <div class="search-bar">
                    <div class="form-group" style="width: 200px;">
                        <label>库区名称</label>
                        <input type="text" class="form-control" id="areaSearchName" placeholder="输入库区名称">
                    </div>
                    <div class="form-group" style="width: 150px;">
                        <label>区域分类</label>
                        <select class="form-control" id="areaSearchCategory">
                            <option value="">全部</option>
                            <option value="电子元件区">电子元件区</option>
                            <option value="成品存储区">成品存储区</option>
                            <option value="冷藏区">冷藏区</option>
                            <option value="常温区">常温区</option>
                        </select>
                    </div>
                    <div class="form-group" style="width: 180px;">
                        <label>所属仓库</label>
                        <select class="form-control" id="areaSearchWarehouse">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button class="btn btn-primary" onclick="loadAreas()">搜索</button>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end; margin-left: auto;">
                        <button class="btn btn-success" onclick="openAddAreaModal()">+ 新增库区</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>库区编号</th>
                            <th>库区名称</th>
                            <th>所属仓库</th>
                            <th>区域分类</th>
                            <th>货架数</th>
                            <th>容量</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="areaTableBody">
                    </tbody>
                </table>

                <div class="pagination" id="areaPagination">
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="warehouseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="whModalTitle">新增仓库</h3>
                <button class="close-btn" onclick="closeModal('warehouseModal')">&times;</button>
            </div>
            <form id="warehouseForm">
                <input type="hidden" id="whId">
                <div class="form-group">
                    <label>仓库编号</label>
                    <input type="text" class="form-control" id="whCode" required>
                </div>
                <div class="form-group">
                    <label>仓库名称</label>
                    <input type="text" class="form-control" id="whName" required>
                </div>
                <div class="form-group">
                    <label>位置</label>
                    <input type="text" class="form-control" id="whLocation" required>
                </div>
                <div class="form-group">
                    <label>存储品类</label>
                    <select class="form-control" id="whCategory" required>
                        <option value="电子产品">电子产品</option>
                        <option value="食品饮料">食品饮料</option>
                        <option value="服装鞋帽">服装鞋帽</option>
                        <option value="五金建材">五金建材</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>总容量</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="whCapacity" required>
                </div>
                <div class="form-group">
                    <label>已用容量</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="whUsedCapacity" value="0">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" id="whStatus" required>
                        <option value="AVAILABLE">可用</option>
                        <option value="FULL">已满</option>
                        <option value="MAINTENANCE">维护中</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea class="form-control" id="whRemark" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('warehouseModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="areaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="areaModalTitle">新增库区</h3>
                <button class="close-btn" onclick="closeModal('areaModal')">&times;</button>
            </div>
            <form id="areaForm">
                <input type="hidden" id="areaId">
                <div class="form-group">
                    <label>库区编号</label>
                    <input type="text" class="form-control" id="areaCode" required>
                </div>
                <div class="form-group">
                    <label>库区名称</label>
                    <input type="text" class="form-control" id="areaName" required>
                </div>
                <div class="form-group">
                    <label>所属仓库</label>
                    <select class="form-control" id="areaWarehouseId" required>
                    </select>
                </div>
                <div class="form-group">
                    <label>区域分类</label>
                    <select class="form-control" id="areaCategory" required>
                        <option value="电子元件区">电子元件区</option>
                        <option value="成品存储区">成品存储区</option>
                        <option value="冷藏区">冷藏区</option>
                        <option value="常温区">常温区</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>货架数量</label>
                    <input type="number" class="form-control" id="areaShelfCount">
                </div>
                <div class="form-group">
                    <label>总容量</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="areaCapacity" required>
                </div>
                <div class="form-group">
                    <label>已用容量</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="areaUsedCapacity" value="0">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" id="areaStatus" required>
                        <option value="AVAILABLE">可用</option>
                        <option value="FULL">已满</option>
                        <option value="MAINTENANCE">维护中</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea class="form-control" id="areaRemark" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('areaModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let currentUser = null;
        let whPage = 0;
        let areaPage = 0;
        const pageSize = 10;

        checkLogin().then(user => {
            currentUser = user;
            document.getElementById('currentUser').textContent = 
                `${user.name}（${getRoleText(user.role)}）`;
            
            if (user.role === 'ADMIN') {
                document.getElementById('userMenu').style.display = 'block';
            } else {
                document.getElementById('userMenu').style.display = 'none';
            }
            
            loadWarehouses();
            loadWarehouseSelect();
        });

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'warehouse') {
                document.querySelector('.nav-tab:first-child').classList.add('active');
                document.getElementById('warehouseTab').classList.add('active');
                loadWarehouses();
            } else {
                document.querySelector('.nav-tab:last-child').classList.add('active');
                document.getElementById('areaTab').classList.add('active');
                loadAreas();
            }
        }

        function loadWarehouses(page = 0) {
            whPage = page;
            const name = document.getElementById('whSearchName').value;
            const category = document.getElementById('whSearchCategory').value;
            const status = document.getElementById('whSearchStatus').value;
            
            let url = `${API_BASE}/warehouse/page?page=${page}&size=${pageSize}`;
            if (name) url += `&name=${encodeURIComponent(name)}`;
            if (category) url += `&storageCategory=${encodeURIComponent(category)}`;
            if (status) url += `&status=${status}`;
            
            request(url).then(data => {
                if (data.code === 200) {
                    renderWarehouseTable(data.data.content);
                    renderWhPagination(data.data);
                }
            });
        }

        function renderWarehouseTable(warehouses) {
            const tbody = document.getElementById('warehouseTableBody');
            const canEdit = currentUser.role === 'ADMIN' || currentUser.role === 'WAREHOUSE_KEEPER';
            const canDelete = currentUser.role === 'ADMIN';
            
            tbody.innerHTML = warehouses.map(wh => `
                <tr>
                    <td>${wh.id}</td>
                    <td>${wh.code}</td>
                    <td>${wh.name}</td>
                    <td>${wh.location}</td>
                    <td>${wh.storageCategory}</td>
                    <td>${wh.capacity}</td>
                    <td>${wh.usedCapacity} (${(wh.usedCapacity / wh.capacity * 100).toFixed(1)}%)</td>
                    <td><span class="status-badge ${getStatusClass(wh.status)}">${getStatusText(wh.status)}</span></td>
                    <td>
                        ${canEdit ? `<button class="btn btn-sm btn-primary" onclick="editWarehouse(${wh.id}); return false;">编辑</button>` : ''}
                        ${canDelete ? `<button class="btn btn-sm btn-danger" onclick="deleteWarehouse(${wh.id}); return false;">删除</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function renderWhPagination(page) {
            const pagination = document.getElementById('whPagination');
            pagination.innerHTML = `
                <button class="btn btn-sm" onclick="loadWarehouses(0)" ${page.number === 0 ? 'disabled' : ''}>首页</button>
                <button class="btn btn-sm" onclick="loadWarehouses(${page.number - 1})" ${page.number === 0 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page.number + 1} 页 / 共 ${page.totalPages} 页，共 ${page.totalElements} 条</span>
                <button class="btn btn-sm" onclick="loadWarehouses(${page.number + 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>下一页</button>
                <button class="btn btn-sm" onclick="loadWarehouses(${page.totalPages - 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>末页</button>
            `;
        }

        function openAddWarehouseModal() {
            document.getElementById('whModalTitle').textContent = '新增仓库';
            document.getElementById('whId').value = '';
            document.getElementById('warehouseForm').reset();
            openModal('warehouseModal');
        }

        function editWarehouse(id) {
            request(`${API_BASE}/warehouse/${id}`).then(data => {
                if (data.code === 200) {
                    const wh = data.data;
                    document.getElementById('whModalTitle').textContent = '编辑仓库';
                    document.getElementById('whId').value = wh.id;
                    document.getElementById('whCode').value = wh.code;
                    document.getElementById('whName').value = wh.name;
                    document.getElementById('whLocation').value = wh.location;
                    document.getElementById('whCategory').value = wh.storageCategory;
                    document.getElementById('whCapacity').value = wh.capacity;
                    document.getElementById('whUsedCapacity').value = wh.usedCapacity;
                    document.getElementById('whStatus').value = wh.status;
                    document.getElementById('whRemark').value = wh.remark || '';
                    openModal('warehouseModal');
                }
            });
        }

        function deleteWarehouse(id) {
            const confirmed = window.confirm('确定要删除该仓库吗？');
            if (confirmed !== true) {
                return;
            }
            
            request(`${API_BASE}/warehouse/${id}`, { method: 'DELETE' }).then(data => {
                if (data.code === 200) {
                    showToast('删除成功');
                    loadWarehouses(whPage);
                } else {
                    showToast(data.message, 'error');
                }
            }).catch(error => {
                showToast('删除失败：' + error.message, 'error');
            });
        }

        document.getElementById('warehouseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const capacity = parseFloat(document.getElementById('whCapacity').value);
            const usedCapacity = parseFloat(document.getElementById('whUsedCapacity').value) || 0;
            
            if (!validateCapacity(capacity, usedCapacity)) {
                return;
            }
            
            const id = document.getElementById('whId').value;
            const data = {
                code: document.getElementById('whCode').value,
                name: document.getElementById('whName').value,
                location: document.getElementById('whLocation').value,
                storageCategory: document.getElementById('whCategory').value,
                capacity: capacity,
                usedCapacity: usedCapacity,
                status: document.getElementById('whStatus').value,
                remark: document.getElementById('whRemark').value
            };
            
            const isEdit = !!id;
            const url = isEdit ? `${API_BASE}/warehouse/${id}` : `${API_BASE}/warehouse`;
            const method = isEdit ? 'PUT' : 'POST';
            
            request(url, { method, body: JSON.stringify(data) }).then(res => {
                if (res.code === 200) {
                    showToast(isEdit ? '修改成功' : '添加成功');
                    closeModal('warehouseModal');
                    loadWarehouses(whPage);
                } else {
                    showToast(res.message, 'error');
                }
            });
        });

        function loadAreas(page = 0) {
            areaPage = page;
            const name = document.getElementById('areaSearchName').value;
            const category = document.getElementById('areaSearchCategory').value;
            const warehouseId = document.getElementById('areaSearchWarehouse').value;
            
            let url = `${API_BASE}/warehouse/area/page?page=${page}&size=${pageSize}`;
            if (name) url += `&name=${encodeURIComponent(name)}`;
            if (category) url += `&areaCategory=${encodeURIComponent(category)}`;
            if (warehouseId) url += `&warehouseId=${warehouseId}`;
            
            request(url).then(data => {
                if (data.code === 200) {
                    renderAreaTable(data.data.content);
                    renderAreaPagination(data.data);
                }
            });
        }

        function renderAreaTable(areas) {
            const tbody = document.getElementById('areaTableBody');
            const canEdit = currentUser.role === 'ADMIN' || currentUser.role === 'WAREHOUSE_KEEPER';
            const canDelete = currentUser.role === 'ADMIN';
            
            tbody.innerHTML = areas.map(area => `
                <tr>
                    <td>${area.id}</td>
                    <td>${area.code}</td>
                    <td>${area.name}</td>
                    <td>${area.warehouseName || '-'}</td>
                    <td>${area.areaCategory}</td>
                    <td>${area.shelfCount || '-'}</td>
                    <td>${area.capacity}</td>
                    <td><span class="status-badge ${getStatusClass(area.status)}">${getStatusText(area.status)}</span></td>
                    <td>
                        ${canEdit ? `<button class="btn btn-sm btn-primary" onclick="editArea(${area.id}); return false;">编辑</button>` : ''}
                        ${canDelete ? `<button class="btn btn-sm btn-danger" onclick="deleteArea(${area.id}); return false;">删除</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function renderAreaPagination(page) {
            const pagination = document.getElementById('areaPagination');
            pagination.innerHTML = `
                <button class="btn btn-sm" onclick="loadAreas(0)" ${page.number === 0 ? 'disabled' : ''}>首页</button>
                <button class="btn btn-sm" onclick="loadAreas(${page.number - 1})" ${page.number === 0 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page.number + 1} 页 / 共 ${page.totalPages} 页，共 ${page.totalElements} 条</span>
                <button class="btn btn-sm" onclick="loadAreas(${page.number + 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>下一页</button>
                <button class="btn btn-sm" onclick="loadAreas(${page.totalPages - 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>末页</button>
            `;
        }

        function loadWarehouseSelect() {
            request(`${API_BASE}/warehouse/list`).then(data => {
                if (data.code === 200) {
                    const options = data.data.map(wh => `<option value="${wh.id}">${wh.name}</option>`).join('');
                    document.getElementById('areaSearchWarehouse').innerHTML = `<option value="">全部</option>` + options;
                    document.getElementById('areaWarehouseId').innerHTML = options;
                }
            });
        }

        function openAddAreaModal() {
            document.getElementById('areaModalTitle').textContent = '新增库区';
            document.getElementById('areaId').value = '';
            document.getElementById('areaForm').reset();
            openModal('areaModal');
        }

        function editArea(id) {
            request(`${API_BASE}/warehouse/area/${id}`).then(data => {
                if (data.code === 200) {
                    const area = data.data;
                    document.getElementById('areaModalTitle').textContent = '编辑库区';
                    document.getElementById('areaId').value = area.id;
                    document.getElementById('areaCode').value = area.code;
                    document.getElementById('areaName').value = area.name;
                    document.getElementById('areaWarehouseId').value = area.warehouseId;
                    document.getElementById('areaCategory').value = area.areaCategory;
                    document.getElementById('areaShelfCount').value = area.shelfCount || '';
                    document.getElementById('areaCapacity').value = area.capacity;
                    document.getElementById('areaUsedCapacity').value = area.usedCapacity || 0;
                    document.getElementById('areaStatus').value = area.status;
                    document.getElementById('areaRemark').value = area.remark || '';
                    openModal('areaModal');
                }
            });
        }

        function deleteArea(id) {
            const confirmed = window.confirm('确定要删除该库区吗？');
            if (confirmed !== true) {
                return;
            }
            
            request(`${API_BASE}/warehouse/area/${id}`, { method: 'DELETE' }).then(data => {
                if (data.code === 200) {
                    showToast('删除成功');
                    loadAreas(areaPage);
                } else {
                    showToast(data.message, 'error');
                }
            }).catch(error => {
                showToast('删除失败：' + error.message, 'error');
            });
        }

        document.getElementById('areaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const capacity = parseFloat(document.getElementById('areaCapacity').value);
            const usedCapacity = parseFloat(document.getElementById('areaUsedCapacity').value) || 0;
            
            if (!validateCapacity(capacity, usedCapacity)) {
                return;
            }
            
            const id = document.getElementById('areaId').value;
            const data = {
                code: document.getElementById('areaCode').value,
                name: document.getElementById('areaName').value,
                warehouseId: parseInt(document.getElementById('areaWarehouseId').value),
                areaCategory: document.getElementById('areaCategory').value,
                shelfCount: parseInt(document.getElementById('areaShelfCount').value) || 0,
                capacity: capacity,
                usedCapacity: usedCapacity,
                status: document.getElementById('areaStatus').value,
                remark: document.getElementById('areaRemark').value
            };
            
            const isEdit = !!id;
            const url = isEdit ? `${API_BASE}/warehouse/area/${id}` : `${API_BASE}/warehouse/area`;
            const method = isEdit ? 'PUT' : 'POST';
            
            request(url, { method, body: JSON.stringify(data) }).then(res => {
                if (res.code === 200) {
                    showToast(isEdit ? '修改成功' : '添加成功');
                    closeModal('areaModal');
                    loadAreas(areaPage);
                } else {
                    showToast(res.message, 'error');
                }
            });
        });

        function validateCapacity(capacity, usedCapacity) {
            if (isNaN(capacity) || capacity <= 0) {
                showToast('总容量必须大于0', 'error');
                return false;
            }
            if (isNaN(usedCapacity) || usedCapacity < 0) {
                showToast('已用容量不能为负数', 'error');
                return false;
            }
            if (usedCapacity > capacity) {
                showToast('已用容量不能超过总容量', 'error');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流园区管理平台 - 用户管理</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>物流园区货物中转调度管理平台</h1>
            <div class="user-info">
                <div class="menu">
                    <a href="index.html">首页</a>
                    <a href="user.html" class="active">用户管理</a>
                    <a href="warehouse.html">仓库管理</a>
                </div>
                <div>
                    <span id="currentUser">正在加载...</span>
                    <button class="btn btn-sm btn-warning" onclick="logout()" style="margin-left: 10px;">退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>用户管理</h2>
            <div class="search-bar">
                <div class="form-group" style="width: 200px;">
                    <label>姓名搜索</label>
                    <input type="text" class="form-control" id="searchName" placeholder="输入姓名">
                </div>
                <div class="form-group" style="width: 150px;">
                    <label>角色筛选</label>
                    <select class="form-control" id="searchRole">
                        <option value="">全部</option>
                        <option value="ADMIN">管理员</option>
                        <option value="DISPATCHER">调度员</option>
                        <option value="WAREHOUSE_KEEPER">仓管员</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="loadUsers()">搜索</button>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end; margin-left: auto;">
                    <button class="btn btn-success" onclick="openAddModal()">+ 新增用户</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>手机号</th>
                        <th>姓名</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>

            <div class="pagination" id="pagination">
            </div>
        </div>
    </div>

    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新增用户</h3>
                <button class="close-btn" onclick="closeModal('userModal')">&times;</button>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" class="form-control" id="userPhone" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" class="form-control" id="userName" required>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select class="form-control" id="userRole" required>
                        <option value="ADMIN">管理员</option>
                        <option value="DISPATCHER">调度员</option>
                        <option value="WAREHOUSE_KEEPER">仓管员</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="form-control" id="userPassword" placeholder="修改时留空则不修改">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('userModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let currentUser = null;
        let currentPage = 0;
        const pageSize = 10;

        checkLogin().then(user => {
            currentUser = user;
            document.getElementById('currentUser').textContent = 
                `${user.name}（${getRoleText(user.role)}）`;
            
            if (user.role !== 'ADMIN') {
                window.location.href = '/index.html';
                return;
            }
            
            loadUsers();
        });

        function loadUsers(page = 0) {
            currentPage = page;
            const name = document.getElementById('searchName').value;
            const role = document.getElementById('searchRole').value;
            
            let url = `${API_BASE}/user/page?page=${page}&size=${pageSize}`;
            if (name) url += `&name=${encodeURIComponent(name)}`;
            if (role) url += `&role=${role}`;
            
            request(url).then(data => {
                if (data.code === 200) {
                    renderUserTable(data.data.content);
                    renderPagination(data.data);
                }
            });
        }

        function renderUserTable(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.phone}</td>
                    <td>${user.name}</td>
                    <td><span class="status-badge ${getRoleClass(user.role)}">${getRoleText(user.role)}</span></td>
                    <td><span class="status-badge ${user.enabled ? 'status-enabled' : 'status-disabled'}">${user.enabled ? '启用' : '禁用'}</span></td>
                    <td>${formatDate(user.createTime)}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editUser(${user.id}); return false;">编辑</button>
                        <button class="btn btn-sm ${user.enabled ? 'btn-warning' : 'btn-success'}" onclick="toggleUser(${user.id}); return false;">${user.enabled ? '禁用' : '启用'}</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id}); return false;">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(page) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = `
                <button class="btn btn-sm" onclick="loadUsers(0)" ${page.number === 0 ? 'disabled' : ''}>首页</button>
                <button class="btn btn-sm" onclick="loadUsers(${page.number - 1})" ${page.number === 0 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page.number + 1} 页 / 共 ${page.totalPages} 页，共 ${page.totalElements} 条</span>
                <button class="btn btn-sm" onclick="loadUsers(${page.number + 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>下一页</button>
                <button class="btn btn-sm" onclick="loadUsers(${page.totalPages - 1})" ${page.number === page.totalPages - 1 ? 'disabled' : ''}>末页</button>
            `;
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('userId').value = '';
            document.getElementById('userForm').reset();
            document.getElementById('userPassword').required = true;
            openModal('userModal');
        }

        function editUser(id) {
            request(`${API_BASE}/user/${id}`).then(data => {
                if (data.code === 200) {
                    const user = data.data;
                    document.getElementById('modalTitle').textContent = '编辑用户';
                    document.getElementById('userId').value = user.id;
                    document.getElementById('userPhone').value = user.phone;
                    document.getElementById('userName').value = user.name;
                    document.getElementById('userRole').value = user.role;
                    document.getElementById('userPassword').value = '';
                    document.getElementById('userPassword').required = false;
                    openModal('userModal');
                }
            });
        }

        function toggleUser(id) {
            const confirmed = window.confirm('确定要切换该用户的状态吗？');
            if (confirmed !== true) {
                return;
            }
            
            request(`${API_BASE}/user/${id}/toggle-status`, { method: 'PUT' }).then(data => {
                if (data.code === 200) {
                    showToast('状态切换成功');
                    loadUsers(currentPage);
                } else {
                    showToast(data.message, 'error');
                }
            }).catch(error => {
                showToast('操作失败：' + error.message, 'error');
            });
        }

        function deleteUser(id) {
            const confirmed = window.confirm('确定要删除该用户吗？');
            if (confirmed !== true) {
                return;
            }
            
            request(`${API_BASE}/user/${id}`, { method: 'DELETE' }).then(data => {
                if (data.code === 200) {
                    showToast('删除成功');
                    loadUsers(currentPage);
                } else {
                    showToast(data.message, 'error');
                }
            }).catch(error => {
                showToast('删除失败：' + error.message, 'error');
            });
        }

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('userId').value;
            const userData = {
                phone: document.getElementById('userPhone').value,
                name: document.getElementById('userName').value,
                role: document.getElementById('userRole').value
            };
            
            const password = document.getElementById('userPassword').value;
            if (password) {
                userData.password = password;
            }
            
            const isEdit = !!id;
            const url = isEdit ? `${API_BASE}/user/${id}` : `${API_BASE}/user`;
            const method = isEdit ? 'PUT' : 'POST';
            
            request(url, { method, body: JSON.stringify(userData) }).then(data => {
                if (data.code === 200) {
                    showToast(isEdit ? '修改成功' : '添加成功');
                    closeModal('userModal');
                    loadUsers(currentPage);
                } else {
                    showToast(data.message, 'error');
                }
            });
        });
    </script>
</body>
</html>

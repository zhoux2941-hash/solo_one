server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: oms-backend

  datasource:
    url: jdbc:h2:mem:omsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  graphql:
    graphiql:
      enabled: true

jwt:
  secret: your-256-bit-secret-key-here-must-be-long-enough
  expiration: 86400000

logging:
  level:
    com.oms: DEBUG
    org.springframework.web.socket: DEBUG

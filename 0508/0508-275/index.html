<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D分子结构可视化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        .toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            min-width: 280px;
        }
        
        .toolbar h2 {
            color: #1a1a2e;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #4a69bd;
            padding-bottom: 10px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        
        .btn {
            background: #4a69bd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn:hover {
            background: #3c55a5;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .mode-buttons {
            display: flex;
            gap: 8px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            color: #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .mode-btn.active {
            background: #4a69bd;
            color: white;
            border-color: #4a69bd;
        }
        
        .mode-btn:hover:not(.active) {
            border-color: #4a69bd;
            color: #4a69bd;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
        }
        
        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: #4a69bd;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            font-size: 12px;
            color: #555;
        }
        
        .info-panel p {
            margin: 5px 0;
        }
        
        .info-panel span {
            font-weight: 600;
            color: #1a1a2e;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 200;
            text-align: center;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top: 4px solid #4a69bd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        .loading-progress {
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a69bd, #6a89cc);
            width: 0%;
            transition: width 0.2s ease;
        }
        
        .loading-text {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            font-size: 11px;
        }
        
        .legend h4 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #ddd;
        }
        
        .help-text {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            font-size: 11px;
            color: #555;
            max-width: 200px;
        }
        
        .help-text p {
            margin: 3px 0;
        }
        
        .docking-panel {
            position: absolute;
            bottom: 20px;
            right: 350px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            font-size: 12px;
            min-width: 280px;
            display: none;
        }
        
        .docking-panel.show {
            display: block;
        }
        
        .docking-panel h4 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 14px;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 8px;
        }
        
        .molecule-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mol-slot {
            flex: 1;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .mol-slot.filled {
            border-style: solid;
            border-color: #4a69bd;
            background: #f0f4ff;
            color: #333;
        }
        
        .mol-slot.receptor {
            border-color: #27ae60;
            background: #e8f8f0;
        }
        
        .mol-slot.ligand {
            border-color: #e74c3c;
            background: #ffebee;
        }
        
        .mol-slot strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .docking-controls {
            display: flex;
            gap: 10px;
        }
        
        .docking-controls .btn {
            flex: 1;
            font-size: 12px;
            padding: 8px 15px;
        }
        
        .btn-danger {
            background: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .docking-result {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }
        
        .docking-result.show {
            display: block;
        }
        
        .score-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 11px;
        }
        
        .score-value {
            font-weight: 600;
            color: #27ae60;
        }
        
        .animation-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .animation-controls button {
            flex: 1;
            padding: 6px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #95a5a6;
            color: white;
            transition: background 0.3s;
        }
        
        .animation-controls button:hover {
            background: #7f8c8d;
        }
        
        .animation-controls button.active {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div class="toolbar">
            <h2>🔬 分子可视化工具</h2>
            
            <div class="control-group">
                <label>加载PDB文件</label>
                <div class="file-input-wrapper">
                    <button class="btn" id="upload-btn">选择PDB文件</button>
                    <input type="file" id="pdb-file" accept=".pdb">
                </div>
            </div>
            
            <div class="control-group">
                <label>显示模式</label>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="ball-stick">球棍模型</button>
                    <button class="mode-btn" data-mode="space-filling">空间填充</button>
                </div>
            </div>
            
            <div class="control-group">
                <label>显示选项</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-backbone" checked>
                    显示主链带状图
                </label>
                <label class="checkbox-label" style="margin-top: 8px;">
                    <input type="checkbox" id="enable-lod" checked>
                    启用LOD优化
                </label>
            </div>
            
            <div class="control-group">
                <label>原子大小</label>
                <input type="range" id="atom-scale" min="0.5" max="2" step="0.1" value="1" style="width: 100%;">
            </div>
        </div>
        
        <div class="info-panel" id="info-panel" style="display: none;">
            <p><span>分子名称:</span> <span id="mol-name">-</span></p>
            <p><span>原子数量:</span> <span id="atom-count">-</span></p>
            <p><span>残基数量:</span> <span id="residue-count">-</span></p>
            <p><span>当前LOD级别:</span> <span id="lod-level">-</span></p>
        </div>
        
        <div class="legend">
            <h4>元素颜色 (CPK)</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFFFFF; border: 1px solid #ddd;"></div>
                <span>氢 (H)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #333333;"></div>
                <span>碳 (C)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #3355FF;"></div>
                <span>氮 (N)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF3333;"></div>
                <span>氧 (O)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF9900;"></div>
                <span>磷 (P)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFFF33;"></div>
                <span>硫 (S)</span>
            </div>
            <h4 style="margin-top: 10px;">二级结构</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF0000;"></div>
                <span>α-螺旋 (H)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #0000FF;"></div>
                <span>β-折叠 (E)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #808080;"></div>
                <span>无规卷曲 (C)</span>
            </div>
        </div>
        
        <div class="docking-panel" id="docking-panel">
            <h4>🔗 分子对接模拟</h4>
            
            <div class="molecule-selector">
                <div class="mol-slot" id="receptor-slot">
                    <strong>受体 (Receptor)</strong>
                    <span id="receptor-name">点击选择已加载分子</span>
                </div>
                <div class="mol-slot" id="ligand-slot">
                    <strong>配体 (Ligand)</strong>
                    <span id="ligand-name">点击选择已加载分子</span>
                </div>
            </div>
            
            <div class="docking-controls">
                <button class="btn btn-danger" id="start-docking-btn">开始对接</button>
                <button class="btn" id="reset-docking-btn">重置</button>
            </div>
            
            <div class="docking-result" id="docking-result">
                <div class="score-item">
                    <span>对接评分:</span>
                    <span class="score-value" id="docking-score">-</span>
                </div>
                <div class="score-item">
                    <span>相关系数:</span>
                    <span class="score-value" id="correlation-score">-</span>
                </div>
                <div class="score-item">
                    <span>接触点数:</span>
                    <span class="score-value" id="contact-count">-</span>
                </div>
                <div class="animation-controls">
                    <button id="play-anim-btn">播放</button>
                    <button id="pause-anim-btn">暂停</button>
                    <button id="reset-anim-btn">复位</button>
                </div>
            </div>
        </div>
        
        <div class="help-text">
            <p><strong>操作说明:</strong></p>
            <p>🖱️ 左键拖动: 旋转</p>
            <p>🖱️ 滚轮: 缩放</p>
            <p>🖱️ 右键拖动: 平移</p>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p id="loading-title">正在解析PDB文件...</p>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loading-bar"></div>
            </div>
            <div class="loading-text" id="loading-text">准备中...</div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>

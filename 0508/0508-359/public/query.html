<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>干洗店订单查询</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 40px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .search-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    .search-card h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn-search {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-search:active {
      transform: translateY(0);
    }

    .results {
      display: none;
    }

    .results.show {
      display: block;
    }

    .order-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .order-id {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-已收衣 {
      background: #e3f2fd;
      color: #1976d2;
    }

    .status-洗涤中 {
      background: #fff3e0;
      color: #f57c00;
    }

    .status-已完成 {
      background: #e8f5e9;
      color: #388e3c;
    }

    .status-已取衣 {
      background: #e0e0e0;
      color: #616161;
    }

    .order-info {
      margin-bottom: 10px;
    }

    .order-info p {
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .order-info .label {
      color: #888;
      margin-right: 8px;
    }

    .order-items {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }

    .order-items-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .order-items-content {
      font-size: 14px;
      color: #333;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .order-total {
      font-size: 18px;
      font-weight: bold;
      color: #e74c3c;
    }

    .btn-detail {
      padding: 8px 16px;
      background: #f0f0f0;
      color: #667eea;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-detail:hover {
      background: #e0e0e0;
    }

    .empty-state, .loading-state, .error-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .error-state {
      color: #e74c3c;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: #e0e0e0;
      z-index: 1;
    }

    .timeline-step {
      text-align: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .timeline-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #999;
      margin: 0 auto 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .timeline-step.active .timeline-dot {
      background: #667eea;
      color: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }

    .timeline-step.completed .timeline-dot {
      background: #27ae60;
      color: white;
    }

    .timeline-label {
      font-size: 11px;
      color: #888;
    }

    .timeline-step.active .timeline-label,
    .timeline-step.completed .timeline-label {
      color: #333;
      font-weight: 500;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      color: #333;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }

    .detail-section {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .detail-section h4 {
      color: #333;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .detail-item {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .detail-item .label {
      color: #888;
      margin-right: 8px;
    }

    .detail-item img {
      max-width: 100%;
      margin-top: 8px;
      border-radius: 6px;
    }

    .footer-tip {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      margin-top: 20px;
    }

    .photo-with-markers {
      position: relative;
      display: inline-block;
      margin-top: 8px;
    }

    .photo-with-markers img {
      max-width: 100%;
      border-radius: 6px;
    }

    .photo-with-markers .marker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stain-info {
      background: #fff3cd;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #856404;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 20px;
      }

      .header h1 {
        font-size: 22px;
      }

      .search-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛁 洁净干洗店</h1>
      <p>订单状态查询</p>
    </div>

    <div class="search-card">
      <h2>🔍 输入手机号查询订单</h2>
      <div class="form-group">
        <label>手机号码</label>
        <input type="tel" id="phoneInput" placeholder="请输入11位手机号码" maxlength="11">
      </div>
      <button class="btn-search" onclick="searchOrders()">查询订单</button>
    </div>

    <div class="results" id="results">
      <div id="resultsContent"></div>
    </div>

    <p class="footer-tip">如有疑问，请联系门店电话：400-XXX-XXXX</p>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>订单详情</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const statusFlow = ['已收衣', '洗涤中', '已完成', '已取衣'];

    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchOrders();
      }
    });

    async function searchOrders() {
      const phone = document.getElementById('phoneInput').value.trim();

      if (!phone || phone.length !== 11) {
        alert('请输入正确的11位手机号码');
        return;
      }

      const results = document.getElementById('results');
      const content = document.getElementById('resultsContent');
      results.classList.add('show');
      content.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>正在查询订单...</p>
        </div>
      `;

      try {
        const response = await fetch(`/api/orders/phone/${phone}`);
        const result = await response.json();

        if (result.success) {
          renderOrders(result.orders);
        } else {
          content.innerHTML = `
            <div class="error-state">
              <p>❌ 查询失败：${result.error}</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('查询失败:', error);
        content.innerHTML = `
          <div class="error-state">
            <p>❌ 网络错误，请稍后重试</p>
          </div>
        `;
      }
    }

    function renderOrders(orders) {
      const content = document.getElementById('resultsContent');

      if (orders.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 48px; margin-bottom: 16px;">📭</p>
            <p>暂无订单记录</p>
            <p style="font-size: 13px; margin-top: 8px;">请检查手机号是否正确</p>
          </div>
        `;
        return;
      }

      content.innerHTML = orders.map(order => {
        const statusIndex = statusFlow.indexOf(order.status);
        return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">${order.id}</span>
              <span class="status-badge status-${order.status}">${order.status}</span>
            </div>

            <div class="timeline">
              ${statusFlow.map((status, index) => `
                <div class="timeline-step ${index < statusIndex ? 'completed' : ''} ${index === statusIndex ? 'active' : ''}">
                  <div class="timeline-dot">${index < statusIndex ? '✓' : index + 1}</div>
                  <div class="timeline-label">${status}</div>
                </div>
              `).join('')}
            </div>

            <div class="order-info">
              <p><span class="label">收衣时间：</span>${formatTime(order.created_at)}</p>
            </div>

            <div class="order-items">
              <div class="order-items-title">衣物明细</div>
              <div class="order-items-content">${order.items_summary || '暂无衣物信息'}</div>
            </div>

            <div class="order-footer">
              <span class="order-total">¥${order.total_amount.toFixed(2)}</span>
              <button class="btn-detail" onclick="showOrderDetail('${order.id}')">查看详情</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function showOrderDetail(orderId) {
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      `;
      document.getElementById('detailModal').classList.add('show');

      try {
        const response = await fetch(`/api/orders/${orderId}`);
        const result = await response.json();

        if (result.success) {
          const order = result.order;
          const statusIndex = statusFlow.indexOf(order.status);

          let html = `
            <div class="detail-section">
              <h4>📋 基本信息</h4>
              <div class="detail-item"><span class="label">订单号：</span>${order.id}</div>
              <div class="detail-item"><span class="label">客户姓名：</span>${order.customer_name}</div>
              <div class="detail-item"><span class="label">联系电话：</span>${order.phone}</div>
              <div class="detail-item">
                <span class="label">订单状态：</span>
                <span class="status-badge status-${order.status}">${order.status}</span>
              </div>
              <div class="detail-item"><span class="label">创建时间：</span>${formatTime(order.created_at)}</div>
              <div class="detail-item"><span class="label">更新时间：</span>${formatTime(order.updated_at)}</div>
            </div>

            <div class="timeline" style="padding: 0 10px;">
              ${statusFlow.map((status, index) => `
                <div class="timeline-step ${index < statusIndex ? 'completed' : ''} ${index === statusIndex ? 'active' : ''}">
                  <div class="timeline-dot">${index < statusIndex ? '✓' : index + 1}</div>
                  <div class="timeline-label">${status}</div>
                </div>
              `).join('')}
            </div>

            <div class="detail-section">
              <h4>👕 衣物明细</h4>
          `;

          let itemIndex = 0;
          order.items.forEach(item => {
            const hasMarkers = item.stain_markers && item.stain_markers.length > 0;
            html += `
              <div class="detail-item">
                <p><span class="label">类型：</span>${item.clothing_type}</p>
                <p><span class="label">数量：</span>${item.quantity} 件</p>
                <p><span class="label">单价：</span>¥${item.unit_price.toFixed(2)}</p>
                <p><span class="label">小计：</span>¥${(item.quantity * item.unit_price).toFixed(2)}</p>
                ${hasMarkers ? `
                  <div class="stain-info">
                    🎯 污渍标记：<strong>${item.stain_markers.length}</strong> 处已标记，洗涤时会重点处理
                  </div>
                ` : ''}
                ${item.photo_path ? `
                  <div class="photo-with-markers" id="query-photo-container-${itemIndex}">
                    <img src="${item.photo_path}" alt="衣物照片" id="query-detail-photo-${itemIndex}" onload="drawQueryMarkers(${itemIndex}, '${JSON.stringify(item.stain_markers || []).replace(/'/g, "\\'")}')">
                  </div>
                ` : ''}
              </div>
            `;
            itemIndex++;
          });

          html += `
            </div>

            <div class="detail-section" style="text-align: center;">
              <p style="font-size: 14px; color: #888; margin-bottom: 8px;">订单总额</p>
              <p style="font-size: 28px; font-weight: bold; color: #e74c3c;">¥${order.total_amount.toFixed(2)}</p>
            </div>
          `;

          modalContent.innerHTML = html;
        }
      } catch (error) {
        console.error('获取详情失败:', error);
        modalContent.innerHTML = `
          <div class="error-state">
            <p>❌ 加载失败</p>
          </div>
        `;
      }
    }

    function drawQueryMarkers(itemIndex, markersJson) {
      try {
        const markers = JSON.parse(markersJson);
        if (!markers || markers.length === 0) return;

        const img = document.getElementById(`query-detail-photo-${itemIndex}`);
        const container = document.getElementById(`query-photo-container-${itemIndex}`);
        if (!img || !container) return;

        const canvas = document.createElement('canvas');
        canvas.className = 'marker-overlay';
        canvas.width = img.clientWidth;
        canvas.height = img.clientHeight;
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const scaleX = canvas.width / img.naturalWidth;
        const scaleY = canvas.height / img.naturalHeight;

        markers.forEach(marker => {
          if (!marker.path || marker.path.length < 2) return;

          ctx.beginPath();
          ctx.moveTo(marker.path[0].x * scaleX, marker.path[0].y * scaleY);

          for (let i = 1; i < marker.path.length; i++) {
            ctx.lineTo(marker.path[i].x * scaleX, marker.path[i].y * scaleY);
          }

          ctx.strokeStyle = marker.color;
          ctx.lineWidth = marker.size * Math.max(scaleX, scaleY);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        });
      } catch (e) {
        console.error('绘制标记失败:', e);
      }
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
  </script>
</body>
</html>

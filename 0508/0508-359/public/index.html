<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洁净干洗店 - 订单管理系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      color: white;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 50px;
    }

    .cards {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      width: 280px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #333;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .card p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      opacity: 0.8;
    }

    @media (max-width: 650px) {
      h1 {
        font-size: 28px;
      }

      .cards {
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛁</div>
    <h1>洁净干洗店</h1>
    <p class="subtitle">专业干洗 · 用心服务 · 订单管理系统</p>

    <div class="cards">
      <a href="staff.html" class="card">
        <div class="card-icon">👨‍💼</div>
        <h2>店员端</h2>
        <p>录入订单、管理衣物、查看订单列表、更新状态、打印小票</p>
      </a>

      <a href="query.html" class="card">
        <div class="card-icon">👤</div>
        <h2>用户查询</h2>
        <p>输入手机号查询订单状态、查看衣物明细、了解洗涤进度</p>
      </a>
    </div>

    <div class="footer">
      © 2026 洁净干洗店 | 客服热线：400-XXX-XXXX
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗房胶片冲印管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 暗房胶片冲印管理系统</h1>
            <p>Film Processing Management System</p>
        </header>

        <nav>
            <button class="nav-btn active" data-section="dashboard">📊 数据看板</button>
            <button class="nav-btn" data-section="materials">🧪 耗材管理</button>
            <button class="nav-btn" data-section="films">🎞️ 底片登记</button>
            <button class="nav-btn" data-section="process">⚗️ 工序记录</button>
            <button class="nav-btn" data-section="products">🖼️ 成品归档</button>
        </nav>

        <section id="dashboard" class="section active">
            <div class="section-header">
                <h2>📊 数据看板</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="stat-materials">0</div>
                    <div class="label">耗材种类</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-films">0</div>
                    <div class="label">底片总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-processing">0</div>
                    <div class="label">冲洗中</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-completed">0</div>
                    <div class="label">已交付</div>
                </div>
            </div>
        </section>

        <section id="materials" class="section">
            <div class="section-header">
                <h2>🧪 耗材管理</h2>
                <button class="btn btn-primary" onclick="openModal('material-modal')">+ 添加耗材</button>
            </div>
            <div class="table-container">
                <table id="materials-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>类型</th>
                            <th>库存</th>
                            <th>供应商</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="films" class="section">
            <div class="section-header">
                <h2>🎞️ 底片登记</h2>
                <button class="btn btn-primary" onclick="openModal('film-modal')">+ 登记底片</button>
            </div>
            <div class="table-container">
                <table id="films-table">
                    <thead>
                        <tr>
                            <th>客户姓名</th>
                            <th>胶卷类型</th>
                            <th>品牌</th>
                            <th>ISO</th>
                            <th>卷数</th>
                            <th>接收日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="process" class="section">
            <div class="section-header">
                <h2>⚗️ 工序记录</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>编号</th>
                            <th>客户姓名</th>
                            <th>胶卷类型</th>
                            <th>卷数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="process-films-list"></tbody>
                </table>
            </div>
        </section>

        <section id="products" class="section">
            <div class="section-header">
                <h2>🖼️ 成品归档</h2>
                <button class="btn btn-primary" onclick="openModal('product-modal')">+ 登记成品</button>
            </div>
            <div class="table-container">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>底片编号</th>
                            <th>客户姓名</th>
                            <th>照片数量</th>
                            <th>底片数</th>
                            <th>扫描数</th>
                            <th>交付方式</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="material-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加/编辑耗材</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="material-form">
                <input type="hidden" id="material-id" name="id">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="material-name" name="name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>类型</label>
                        <select id="material-type" name="type" required>
                            <option value="">请选择</option>
                            <option value="DEVELOPER">显影液</option>
                            <option value="FIXER">定影液</option>
                            <option value="STOP_BATH">停影液</option>
                            <option value="WETTING_AGENT">去水渍液</option>
                            <option value="PAPER">相纸</option>
                            <option value="OTHER">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>单位</label>
                        <input type="text" id="material-unit" name="unit" value="L" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>库存数量</label>
                        <input type="number" id="material-quantity" name="quantity" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>容量</label>
                        <input type="number" id="material-capacity" name="capacity" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>供应商</label>
                    <input type="text" id="material-supplier" name="supplier">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="material-notes" name="notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('material-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="film-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登记/编辑底片</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="film-form">
                <input type="hidden" id="film-id" name="id">
                <div class="form-row">
                    <div class="form-group">
                        <label>客户姓名</label>
                        <input type="text" id="film-customer-name" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label>联系方式</label>
                        <input type="text" id="film-contact" name="contactInfo">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>胶卷类型</label>
                        <input type="text" id="film-type" name="filmType" placeholder="黑白135/黑白120等" required>
                    </div>
                    <div class="form-group">
                        <label>品牌</label>
                        <input type="text" id="film-brand" name="filmBrand">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ISO</label>
                        <input type="number" id="film-iso" name="iso" min="0">
                    </div>
                    <div class="form-group">
                        <label>卷数</label>
                        <input type="number" id="film-rolls" name="rolls" value="1" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>接收日期</label>
                    <input type="date" id="film-received-date" name="receivedDate" required>
                </div>
                <div class="form-group">
                    <label>特殊要求</label>
                    <textarea id="film-requirements" name="specialRequirements"></textarea>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="film-notes" name="notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('film-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="process-step-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加冲洗工序</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="process-step-form">
                <div class="form-group">
                    <label>工序类型</label>
                    <select id="step-type" name="stepType" required>
                        <option value="">请选择</option>
                        <option value="DEVELOPING">显影</option>
                        <option value="STOP_BATH">停影</option>
                        <option value="FIXING">定影</option>
                        <option value="WASHING">水洗</option>
                        <option value="WETTING">去水渍</option>
                        <option value="DRYING">晾干</option>
                        <option value="SCANNING">扫描</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="step-start-time" name="startTime">
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="datetime-local" id="step-end-time" name="endTime">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>时长（分钟）</label>
                        <input type="number" id="step-duration" name="duration" min="0">
                    </div>
                    <div class="form-group">
                        <label>温度（°C）</label>
                        <input type="number" id="step-temperature" name="temperature" step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>使用药水</label>
                        <input type="text" id="step-solution" name="solutionUsed">
                    </div>
                    <div class="form-group">
                        <label>稀释比例</label>
                        <input type="text" id="step-dilution" name="solutionDilution" placeholder="1:1">
                    </div>
                </div>
                <div class="form-group">
                    <label>操作员</label>
                    <input type="text" id="step-operator" name="operatorName">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="step-notes" name="notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('process-step-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="process-steps-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>工序记录</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div id="process-steps-container"></div>
        </div>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登记/编辑成品</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id" name="id">
                <div class="form-group">
                    <label>对应底片</label>
                    <select id="product-film-id" name="filmId" required></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>照片数量</label>
                        <input type="number" id="product-photos" name="photosCount" value="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>底片数量</label>
                        <input type="number" id="product-negatives" name="negativesCount" min="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>扫描数量</label>
                        <input type="number" id="product-scans" name="scansCount" min="0">
                    </div>
                    <div class="form-group">
                        <label>冲印尺寸</label>
                        <input type="text" id="product-print-size" name="printSize">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>交付方式</label>
                        <select id="product-delivery-method" name="deliveryMethod">
                            <option value="">请选择</option>
                            <option value="自取">自取</option>
                            <option value="快递">快递</option>
                            <option value="邮寄">邮寄</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>交付日期</label>
                        <input type="date" id="product-delivery-date" name="deliveryDate">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>签收人</label>
                        <input type="text" id="product-delivered-to" name="deliveredTo">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="product-status" name="status">
                            <option value="PROCESSING">处理中</option>
                            <option value="COMPLETED">已完成</option>
                            <option value="DELIVERED">已交付</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="product-notes" name="notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('product-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

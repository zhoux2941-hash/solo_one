<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P CDN 管理面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 P2P CDN 管理系统</h1>
      <div class="refresh-indicator">
        <span class="status-dot"></span>
        <span>实时更新中</span>
      </div>
    </header>

    <div class="stats-overview">
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-content">
          <h3>P2P 命中率</h3>
          <div class="stat-value" id="p2pHitRate">0%</div>
          <div class="stat-progress">
            <div class="progress-bar" id="hitRateBar"></div>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⬇️</div>
        <div class="stat-content">
          <h3>P2P 下载量</h3>
          <div class="stat-value" id="p2pDownloaded">0 MB</div>
          <div class="stat-label">CDN: <span id="cdnDownloaded">0 MB</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⬆️</div>
        <div class="stat-content">
          <h3>P2P 上传量</h3>
          <div class="stat-value" id="totalUploaded">0 MB</div>
          <div class="stat-label">共享给其他节点</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-content">
          <h3>活跃节点</h3>
          <div class="stat-value" id="activePeers">0</div>
          <div class="stat-label">资源数: <span id="totalResources">0</span></div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="section">
        <div class="section-header">
          <h2>📁 资源管理</h2>
          <button class="btn btn-primary" id="uploadBtn">上传新资源</button>
        </div>
        <input type="file" id="fileInput" style="display: none;">
        <div class="upload-progress" id="uploadProgress" style="display: none;">
          <div class="progress-bar" style="width: 0%;" id="uploadBar"></div>
          <span id="uploadText">上传中...</span>
        </div>
        <div class="resource-list" id="resourceList">
          <div class="empty-state">
            <p>暂无资源，点击上方按钮上传</p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>� 资源预推送</h2>
          <button class="btn btn-secondary" id="scheduleTrendingBtn">推送热门资源</button>
        </div>
        <div class="prepush-stats" id="prepushStats">
          <div class="prepush-stat-item">
            <span class="prepush-stat-label">队列中</span>
            <span class="prepush-stat-value" id="queueCount">0</span>
          </div>
          <div class="prepush-stat-item">
            <span class="prepush-stat-label">进行中</span>
            <span class="prepush-stat-value" id="activeCount">0</span>
          </div>
          <div class="prepush-stat-item">
            <span class="prepush-stat-label">已完成</span>
            <span class="prepush-stat-value" id="completedCount">0</span>
          </div>
          <div class="prepush-stat-item">
            <span class="prepush-stat-label">边缘节点</span>
            <span class="prepush-stat-value" id="edgePeerCount">0</span>
          </div>
        </div>
        <div class="prepush-queue" id="prepushQueue">
          <h4 style="margin-bottom: 12px; color: #475569;">推送队列</h4>
          <div id="queueList" class="queue-list"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>�📈 详细统计</h2>
          <select id="statsFilter" class="form-control">
            <option value="all">所有资源</option>
          </select>
        </div>
        <div class="stats-detail" id="statsDetail">
          <div class="chart-container">
            <canvas id="hitRateChart"></canvas>
          </div>
          <div class="stats-table">
            <table>
              <thead>
                <tr>
                  <th>资源名称</th>
                  <th>访问次数</th>
                  <th>P2P命中</th>
                  <th>CDN回退</th>
                  <th>热度评分</th>
                  <th>节点数</th>
                </tr>
              </thead>
              <tbody id="statsTableBody">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="uploadModal" style="display: none;">
      <div class="modal-content">
        <h3>上传成功!</h3>
        <div class="upload-result" id="uploadResult"></div>
        <button class="btn btn-primary" id="closeModal">确定</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

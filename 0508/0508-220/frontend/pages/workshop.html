<div class="page-header">
    <h1 class="page-title">车间管理</h1>
    <button class="btn btn-primary" onclick="openWorkshopModal()">新增车间</button>
</div>

<div class="card">
    <div class="search-bar">
        <div class="search-item">
            <label class="form-label">车间名称</label>
            <input type="text" class="form-input" id="searchKeyword" placeholder="请输入车间名称">
        </div>
        <button class="btn btn-primary" onclick="searchWorkshop()">搜索</button>
        <button class="btn btn-default" onclick="resetSearch()">重置</button>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>车间编码</th>
                <th>车间名称</th>
                <th>位置</th>
                <th>负责人</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="workshopTableBody">
        </tbody>
    </table>

    <div class="pagination" id="pagination">
    </div>
</div>

<div id="workshopModal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">新增车间</span>
            <button class="modal-close" onclick="closeWorkshopModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="workshopForm">
                <input type="hidden" id="workshopId">
                <div class="form-group">
                    <label class="form-label">车间编码 <span style="color: red;">*</span></label>
                    <input type="text" class="form-input" id="workshopCode" placeholder="请输入车间编码">
                </div>
                <div class="form-group">
                    <label class="form-label">车间名称 <span style="color: red;">*</span></label>
                    <input type="text" class="form-input" id="workshopName" placeholder="请输入车间名称">
                </div>
                <div class="form-group">
                    <label class="form-label">位置</label>
                    <input type="text" class="form-input" id="workshopLocation" placeholder="请输入位置">
                </div>
                <div class="form-group">
                    <label class="form-label">负责人</label>
                    <input type="text" class="form-input" id="workshopManager" placeholder="请输入负责人">
                </div>
                <div class="form-group">
                    <label class="form-label">描述</label>
                    <textarea class="form-input" id="workshopDescription" rows="3" placeholder="请输入描述"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select class="form-select" id="workshopStatus">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeWorkshopModal()">取消</button>
            <button class="btn btn-primary" onclick="saveWorkshop()">保存</button>
        </div>
    </div>
</div>

<script>
    let currentPage = 0;
    const pageSize = 10;

    function initworkshopPage() {
        loadWorkshopData();
    }

    async function loadWorkshopData() {
        try {
            const keyword = document.getElementById('searchKeyword')?.value || '';
            const result = await get('/workshop/page', { page: currentPage, size: pageSize, keyword });
            
            const tbody = document.getElementById('workshopTableBody');
            tbody.innerHTML = '';
            
            result.data.content.forEach(workshop => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${workshop.workshopCode}</td>
                    <td>${workshop.workshopName}</td>
                    <td>${workshop.workshopLocation || '-'}</td>
                    <td>${workshop.workshopManager || '-'}</td>
                    <td><span class="status-tag ${workshop.status === 1 ? 'status-active' : 'status-inactive'}">${workshop.status === 1 ? '启用' : '禁用'}</span></td>
                    <td>${workshop.createTime ? new Date(workshop.createTime).toLocaleString() : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-default" onclick="editWorkshop(${workshop.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteWorkshop(${workshop.id})">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            renderPagination(result.data.totalPages, result.data.totalElements);
        } catch (error) {
            console.error('加载车间数据失败', error);
        }
    }

    function renderPagination(totalPages, totalElements) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = `
            <span class="pagination-info">共 ${totalElements} 条记录，第 ${currentPage + 1}/${totalPages} 页</span>
            <button class="btn btn-sm btn-default" onclick="goToPage(0)" ${currentPage === 0 ? 'disabled' : ''}>首页</button>
            <button class="btn btn-sm btn-default" onclick="goToPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>上一页</button>
            <button class="btn btn-sm btn-default" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>下一页</button>
            <button class="btn btn-sm btn-default" onclick="goToPage(${totalPages - 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>末页</button>
        `;
    }

    function goToPage(page) {
        if (page >= 0) {
            currentPage = page;
            loadWorkshopData();
        }
    }

    function searchWorkshop() {
        currentPage = 0;
        loadWorkshopData();
    }

    function resetSearch() {
        document.getElementById('searchKeyword').value = '';
        currentPage = 0;
        loadWorkshopData();
    }

    function openWorkshopModal() {
        document.getElementById('modalTitle').textContent = '新增车间';
        document.getElementById('workshopForm').reset();
        document.getElementById('workshopId').value = '';
        document.getElementById('workshopModal').classList.remove('hidden');
    }

    function closeWorkshopModal() {
        document.getElementById('workshopModal').classList.add('hidden');
    }

    async function editWorkshop(id) {
        try {
            const result = await get(`/workshop/${id}`);
            const workshop = result.data;
            
            document.getElementById('modalTitle').textContent = '编辑车间';
            document.getElementById('workshopId').value = workshop.id;
            document.getElementById('workshopCode').value = workshop.workshopCode;
            document.getElementById('workshopName').value = workshop.workshopName;
            document.getElementById('workshopLocation').value = workshop.workshopLocation || '';
            document.getElementById('workshopManager').value = workshop.workshopManager || '';
            document.getElementById('workshopDescription').value = workshop.description || '';
            document.getElementById('workshopStatus').value = workshop.status;
            
            document.getElementById('workshopModal').classList.remove('hidden');
        } catch (error) {
            console.error('加载车间详情失败', error);
        }
    }

    async function saveWorkshop() {
        const id = document.getElementById('workshopId').value;
        const data = {
            workshopCode: document.getElementById('workshopCode').value,
            workshopName: document.getElementById('workshopName').value,
            workshopLocation: document.getElementById('workshopLocation').value,
            workshopManager: document.getElementById('workshopManager').value,
            description: document.getElementById('workshopDescription').value,
            status: parseInt(document.getElementById('workshopStatus').value)
        };

        const codeError = Validator.required(data.workshopCode, '请输入车间编码');
        const nameError = Validator.required(data.workshopName, '请输入车间名称');

        if (codeError) {
            showMessage(codeError, 'error');
            return;
        }
        if (nameError) {
            showMessage(nameError, 'error');
            return;
        }

        try {
            if (id) {
                await put(`/workshop/${id}`, data);
                showMessage('更新成功', 'success');
            } else {
                await post('/workshop', data);
                showMessage('创建成功', 'success');
            }
            closeWorkshopModal();
            loadWorkshopData();
        } catch (error) {
            console.error('保存失败', error);
        }
    }

    async function deleteWorkshop(id) {
        if (confirm('确定要删除该车间吗？')) {
            try {
                await del(`/workshop/${id}`);
                showMessage('删除成功', 'success');
                loadWorkshopData();
            } catch (error) {
                console.error('删除失败', error);
            }
        }
    }
</script>

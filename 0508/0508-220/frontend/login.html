<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 工厂生产管理系统</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 32px;
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <h1 class="login-title">🏭 工厂生产管理系统</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="username" placeholder="请输入用户名" value="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" value="admin123">
                </div>
                <button type="submit" class="btn btn-primary login-btn">登录</button>
            </form>
        </div>
    </div>

    <script src="js/request.js"></script>
    <script>
        function showLoginMessage(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 24px;
                border-radius: 4px;
                color: white;
                font-size: 14px;
                z-index: 10000;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                background-color: ${type === 'success' ? '#52c41a' : type === 'error' ? '#ff4d4f' : '#1890ff'};
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username) {
                showLoginMessage('请输入用户名', 'error');
                return;
            }
            if (!password) {
                showLoginMessage('请输入密码', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: result.data.userId,
                        username: result.data.username,
                        realName: result.data.realName,
                        role: result.data.role
                    }));
                    showLoginMessage('登录成功', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showLoginMessage(result.message || '登录失败', 'error');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showLoginMessage('网络错误，请确保后端服务已启动', 'error');
            }
        });
    </script>
</body>
</html>

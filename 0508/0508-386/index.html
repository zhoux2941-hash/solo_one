<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球投篮热力图</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.14/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">篮球投篮热力图</h1>
            <p class="text-gray-600 mt-2">点击篮球场记录投篮数据，生成热力图分析命中率</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">
            <div class="lg:w-2/3">
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-gray-700 font-medium">半场篮球场</span>
                        <select id="userSelector" class="px-3 py-2 border border-gray-300 rounded-md bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="user1">用户A</option>
                            <option value="user2">用户B</option>
                            <option value="user3">用户C</option>
                        </select>
                    </div>
                    <div class="relative">
                        <canvas id="basketballCourt" class="mx-auto border-2 border-gray-300 rounded-lg" width="600" height="450"></canvas>
                        <div id="clickModal" class="hidden absolute bg-white rounded-lg shadow-xl p-4 z-10 border border-gray-200">
                            <div class="text-sm font-medium text-gray-700 mb-3">选择投篮结果</div>
                            <div class="flex gap-3">
                                <button id="makeShot" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition">命中</button>
                                <button id="missShot" class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition">未中</button>
                                <button id="cancelShot" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition">取消</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:w-1/3 space-y-4">
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">控制面板</h2>
                    
                    <div class="mb-4">
                        <span class="text-gray-600 text-sm">时间段筛选</span>
                        <div class="flex gap-2 mt-2">
                            <button id="filterWeek" class="px-3 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition text-sm">本周</button>
                            <button id="filterMonth" class="px-3 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition text-sm">本月</button>
                            <button id="filterAll" class="px-3 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 transition text-sm">全部</button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <span class="text-gray-600 text-sm">显示模式</span>
                        <div class="flex gap-2 mt-2">
                            <button id="showHeatmap" class="px-3 py-2 bg-purple-500 text-white rounded-md hover:bg-purple-600 transition text-sm">热力图</button>
                            <button id="showPoints" class="px-3 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 transition text-sm">投篮点</button>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button id="exportImage" class="flex-1 px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600 transition text-sm">导出图片</button>
                        <button id="exportCSV" class="flex-1 px-4 py-2 bg-orange-500 text-white rounded-md hover:bg-orange-600 transition text-sm">导出CSV</button>
                    </div>

                    <button id="clearData" class="w-full mt-3 px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition text-sm">清空数据</button>
                </div>

                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">统计数据</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-3 text-center">
                            <div class="text-2xl font-bold text-blue-600" id="totalShots">0</div>
                            <div class="text-xs text-gray-600">总投篮次数</div>
                        </div>
                        <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-3 text-center">
                            <div class="text-2xl font-bold text-green-600" id="totalAccuracy">0%</div>
                            <div class="text-xs text-gray-600">总命中率</div>
                        </div>
                    </div>

                    <div class="mt-4 space-y-3">
                        <div class="flex justify-between items-center p-2 bg-orange-50 rounded">
                            <span class="text-sm text-gray-600">油漆区</span>
                            <span class="text-sm font-medium" id="paintAccuracy">-</span>
                        </div>
                        <div class="flex justify-between items-center p-2 bg-yellow-50 rounded">
                            <span class="text-sm text-gray-600">中距离</span>
                            <span class="text-sm font-medium" id="midRangeAccuracy">-</span>
                        </div>
                        <div class="flex justify-between items-center p-2 bg-green-50 rounded">
                            <span class="text-sm text-gray-600">三分线外</span>
                            <span class="text-sm font-medium" id="threePointAccuracy">-</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">图例</h2>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-4 h-4 rounded-full bg-red-500"></div>
                        <span class="text-xs text-gray-600">高命中率 (70%+)</span>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-4 h-4 rounded-full bg-yellow-500"></div>
                        <span class="text-xs text-gray-600">中命中率 (40%-70%)</span>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-4 h-4 rounded-full bg-blue-500"></div>
                        <span class="text-xs text-gray-600">低命中率 (0%-40%)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-green-500 border"></div>
                        <span class="text-xs text-gray-600">命中</span>
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                        <div class="w-3 h-3 rounded-full bg-red-500 border"></div>
                        <span class="text-xs text-gray-600">未中</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/domain/ShotRecord.js"></script>
    <script src="src/domain/CourtRegions.js"></script>
    <script src="src/domain/HeatmapGenerator.js"></script>
    <script src="src/domain/Statistics.js"></script>
    <script src="src/infrastructure/Storage.js"></script>
    <script src="src/infrastructure/Exporter.js"></script>
    <script src="src/application/BasketballApp.js"></script>
    <script src="src/presentation/CourtCanvas.js"></script>
    <script src="src/presentation/UIHandler.js"></script>
    <script src="app.js"></script>
</body>
</html>

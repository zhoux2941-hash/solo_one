[package]
name = "spv-light-node"
version = "0.1.0"
edition = "2021"
description = "A Bitcoin-like SPV light node implementation in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.28", features = ["rand", "serde"] }
rand = "0.8"
hex = "0.4"
base58 = "0.2"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
anyhow = "1.0"
bincode = "1.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
libp2p = { version = "0.53", features = ["tcp", "dns", "tokio", "gossipsub", "identify", "noise", "yamux", "mplex"] }
futures = "0.3"
async-trait = "0.1"

[[bin]]
name = "spv-node"
path = "src/main.rs"

[[bin]]
name = "wallet-cli"
path = "src/wallet_cli.rs"

[lib]
path = "src/lib.rs"

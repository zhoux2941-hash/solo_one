<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业综合办公平台</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #304156;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #1f2d3d;
        }
        .sidebar-header h2 {
            font-size: 18px;
            text-align: center;
        }
        .sidebar-menu {
            flex: 1;
            padding: 10px 0;
        }
        .menu-item {
            display: block;
            padding: 15px 20px;
            color: #bfcbd9;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .menu-item:hover,
        .menu-item.active {
            background: #263445;
            color: #409eff;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .welcome-card {
            text-align: center;
            padding: 60px 20px;
        }
        .welcome-card h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #303133;
        }
        .welcome-card p {
            font-size: 16px;
            color: #606266;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .stat-card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .stat-card h3 {
            font-size: 36px;
            color: #409eff;
            margin-bottom: 10px;
        }
        .stat-card p {
            color: #909399;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>企业办公平台</h2>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" data-page="home">首页</div>
                <div class="menu-item" data-page="users" id="menu-users">用户管理</div>
                <div class="menu-item" data-page="departments" id="menu-departments">部门管理</div>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <div>
                    <span id="page-title">首页</span>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span id="current-user"></span>
                    </div>
                    <button class="btn btn-default btn-small" id="logoutBtn">退出登录</button>
                </div>
            </div>
            <div class="content">
                <div id="page-home" class="page active">
                    <div class="welcome-card">
                        <h1>欢迎使用企业综合办公平台</h1>
                        <p>高效、便捷、安全的企业办公解决方案</p>
                        <div class="stats-row">
                            <div class="stat-card">
                                <h3 id="stat-users">0</h3>
                                <p>用户总数</p>
                            </div>
                            <div class="stat-card">
                                <h3 id="stat-departments">0</h3>
                                <p>部门总数</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="page-users" class="page"></div>
                <div id="page-departments" class="page"></div>
            </div>
        </div>
    </div>

    <script src="js/request.js"></script>
    <script src="js/users.js"></script>
    <script src="js/departments.js"></script>
    <script>
        let currentUser = null;

        async function loadCurrentUser() {
            try {
                const result = await api.auth.current();
                currentUser = result.data;
                document.getElementById('current-user').textContent = currentUser.realName + ' (' + (currentUser.role === 'ADMIN' ? '管理员' : '员工') + ')';
                
                if (currentUser.role !== 'ADMIN') {
                    document.getElementById('menu-users').style.display = 'none';
                    document.getElementById('menu-departments').style.display = 'none';
                }
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        function initPage(page) {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            document.querySelectorAll('.page').forEach(p => {
                p.classList.toggle('active', p.id === 'page-' + page);
            });
            
            const titles = {
                'home': '首页',
                'users': '用户管理',
                'departments': '部门管理'
            };
            document.getElementById('page-title').textContent = titles[page];
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                initPage(page);
                if (page === 'users') loadUsers();
                if (page === 'departments') loadDepartments();
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await api.auth.logout();
                showToast('退出成功', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout failed:', error);
            }
        });

        async function loadStats() {
            try {
                const [usersResult, deptsResult] = await Promise.all([
                    api.user.list({ page: 1, size: 1 }),
                    api.department.list({ page: 1, size: 1 })
                ]);
                document.getElementById('stat-users').textContent = usersResult.data.totalElements;
                document.getElementById('stat-departments').textContent = deptsResult.data.totalElements;
            } catch (error) {
                console.error('Load stats failed:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadStats();
            initUsersPage();
            initDepartmentsPage();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表统计 - 司机疲劳驾驶预警系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4caf50;
        }

        .header h1 {
            font-size: 24px;
            color: #4caf50;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .nav a:hover, .nav a.active {
            background: #4caf50;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .filter-bar {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 10px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            color: #aaa;
            font-size: 14px;
        }

        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4caf50;
            color: #fff;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
        }

        .panel.full-width {
            grid-column: 1 / -1;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #4fc3f7;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            height: 350px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 20px 0;
        }

        .chart-bar {
            flex: 1;
            border-radius: 6px 6px 0 0;
            transition: all 0.5s;
            position: relative;
            cursor: pointer;
        }

        .chart-bar:hover {
            filter: brightness(1.2);
        }

        .chart-bar .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }

        .chart-bar .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }

        .ranking-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(79, 195, 247, 0.05);
            border-radius: 8px;
            border-left: 4px solid #4fc3f7;
            transition: transform 0.3s;
        }

        .ranking-item:hover {
            transform: translateX(5px);
        }

        .ranking-item:nth-child(1) {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .ranking-item:nth-child(2) {
            border-left-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.1);
        }

        .ranking-item:nth-child(3) {
            border-left-color: #cd7f32;
            background: rgba(205, 127, 50, 0.1);
        }

        .rank-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }

        .ranking-item:nth-child(1) .rank-number {
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            color: #1a1a2e;
        }

        .ranking-item:nth-child(2) .rank-number {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #1a1a2e;
        }

        .ranking-item:nth-child(3) .rank-number {
            background: linear-gradient(135deg, #cd7f32, #daa06d);
            color: #fff;
        }

        .driver-info {
            flex: 1;
        }

        .driver-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .driver-no {
            font-size: 12px;
            color: #aaa;
        }

        .alert-count {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .alert-count span {
            font-size: 12px;
            color: #aaa;
            font-weight: normal;
        }

        .time-chart {
            height: 350px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            padding: 20px 0;
        }

        .time-bar {
            flex: 1;
            border-radius: 3px 3px 0 0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-bar:hover {
            filter: brightness(1.3);
        }

        .time-bar .tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #1a1a2e;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .time-bar:hover .tooltip {
            opacity: 1;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            padding-top: 10px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 4px;
            padding: 20px 0;
        }

        .heatmap-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .heatmap-cell:hover {
            transform: scale(1.2);
        }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .legend-gradient {
            width: 200px;
            height: 15px;
            border-radius: 8px;
            background: linear-gradient(to right, #1a1a2e, #4fc3f7, #e94560);
        }

        .alert-history {
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(233, 69, 96, 0.05);
            border-radius: 8px;
            border-left: 3px solid #e94560;
        }

        .history-item.handled {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .history-type {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
        }

        .history-time {
            font-size: 12px;
            color: #aaa;
        }

        .history-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            color: #aaa;
        }

        .stat-card:nth-child(1) .value { color: #4fc3f7; }
        .stat-card:nth-child(2) .value { color: #e94560; }
        .stat-card:nth-child(3) .value { color: #4caf50; }
        .stat-card:nth-child(4) .value { color: #ff9800; }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #4fc3f7;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 报表统计分析</h1>
        <div class="nav">
            <a href="dashboard.html">监控中心</a>
            <a href="device-simulator.html">车载模拟</a>
            <a href="reports.html" class="active">报表统计</a>
        </div>
    </div>

    <div class="container">
        <div class="filter-bar">
            <div class="filter-group">
                <label>开始日期:</label>
                <input type="date" id="startDate">
            </div>
            <div class="filter-group">
                <label>结束日期:</label>
                <input type="date" id="endDate">
            </div>
            <button class="btn btn-primary" onclick="loadReports()">🔄 查询</button>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="value" id="totalDrivers">0</div>
                <div class="label">司机总数</div>
            </div>
            <div class="stat-card">
                <div class="icon">🔔</div>
                <div class="value" id="totalAlerts">0</div>
                <div class="label">告警总数</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚠️</div>
                <div class="value" id="avgAlertsPerDriver">0</div>
                <div class="label">人均告警</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏰</div>
                <div class="value" id="peakHour">-</div>
                <div class="label">高峰时段</div>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>🏆 司机疲劳告警频次排行</h2>
                <div class="ranking-list" id="rankingList">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>

            <div class="panel">
                <h2>📈 24小时告警时段分布</h2>
                <div class="time-chart" id="timeChart"></div>
                <div class="time-labels" id="timeLabels">
                    <span>0时</span>
                    <span>6时</span>
                    <span>12时</span>
                    <span>18时</span>
                    <span>24时</span>
                </div>
            </div>
        </div>

        <div class="panel full-width">
            <h2>🔥 疲劳告警热力图（24小时分布强度）</h2>
            <div class="heatmap" id="heatmap"></div>
            <div class="heatmap-legend">
                <span>低</span>
                <div class="legend-gradient"></div>
                <span>高</span>
            </div>
        </div>

        <div class="panel full-width">
            <h2>📋 近期告警历史（最新20条）</h2>
            <div class="alert-history" id="alertHistory">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let ws = null;

        function initWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws/alerts');
            
            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                if (message.type === 'alert') {
                    refreshAllData();
                }
            };

            ws.onclose = function() {
                setTimeout(initWebSocket, 3000);
            };
        }

        async function refreshAllData() {
            await Promise.all([
                loadRanking(),
                loadTimeDistribution(),
                loadAlertHistory(),
                loadDriverStats()
            ]);
        }

        function initDates() {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 7);

            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
        }

        async function loadReports() {
            await refreshAllData();
        }

        async function loadDriverStats() {
            try {
                const driversResponse = await fetch(`${API_BASE}/drivers`);
                const drivers = await driversResponse.json();
                document.getElementById('totalDrivers').textContent = drivers.length;
            } catch (error) {
                console.error('加载司机统计失败:', error);
            }
        }

        async function loadRanking() {
            try {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;

                const response = await fetch(
                    `${API_BASE}/reports/ranking?startDate=${startDate}&endDate=${endDate}`
                );
                const ranking = await response.json();

                const container = document.getElementById('rankingList');
                
                if (ranking.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无告警数据</div>';
                    return;
                }

                const totalAlerts = ranking.reduce((sum, item) => sum + item.alertCount, 0);
                document.getElementById('totalAlerts').textContent = totalAlerts;
                document.getElementById('avgAlertsPerDriver').textContent = 
                    (totalAlerts / Math.max(ranking.length, 1)).toFixed(1);

                container.innerHTML = ranking.slice(0, 10).map((item, index) => `
                    <div class="ranking-item">
                        <div class="rank-number">${index + 1}</div>
                        <div class="driver-info">
                            <div class="driver-name">${item.driverName || item.driverNo}</div>
                            <div class="driver-no">${item.driverNo}</div>
                        </div>
                        <div class="alert-count">${item.alertCount}<span>次</span></div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载排行数据失败:', error);
                document.getElementById('rankingList').innerHTML = 
                    '<div class="empty-state">加载失败</div>';
            }
        }

        async function loadTimeDistribution() {
            try {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;

                const response = await fetch(
                    `${API_BASE}/reports/by-hour?startDate=${startDate}&endDate=${endDate}`
                );
                const stats = await response.json();

                const maxCount = Math.max(...Object.values(stats), 1);
                const chartContainer = document.getElementById('timeChart');
                
                let maxHour = 0;
                let maxValue = 0;
                Object.entries(stats).forEach(([hour, count]) => {
                    if (count > maxValue) {
                        maxValue = count;
                        maxHour = hour;
                    }
                });
                document.getElementById('peakHour').textContent = `${maxHour}时`;

                const colors = Object.values(stats).map(count => {
                    const intensity = count / maxCount;
                    if (intensity > 0.7) return 'linear-gradient(to top, #e94560, #ff6b81)';
                    if (intensity > 0.4) return 'linear-gradient(to top, #ff9800, #ffb74d)';
                    return 'linear-gradient(to top, #4fc3f7, #81d4fa)';
                });

                chartContainer.innerHTML = Object.entries(stats).map(([hour, count], index) => {
                    const height = (count / maxCount) * 100;
                    return `
                        <div class="time-bar" style="height: ${Math.max(height, 3)}%; background: ${colors[index]};">
                            <div class="tooltip">${hour}时: ${count}次告警</div>
                        </div>
                    `;
                }).join('');

                const heatmap = document.getElementById('heatmap');
                heatmap.innerHTML = Object.entries(stats).map(([hour, count]) => {
                    const intensity = Math.min(count / Math.max(maxCount, 1), 1);
                    const r = Math.round(26 + intensity * 207);
                    const g = Math.round(26 + (1 - intensity) * 137);
                    const b = Math.round(46 + (1 - intensity) * 50);
                    return `
                        <div class="heatmap-cell" 
                             style="background: rgb(${r}, ${g}, ${b});"
                             title="${hour}时: ${count}次告警">
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('加载时段分布失败:', error);
            }
        }

        async function loadAlertHistory() {
            try {
                const response = await fetch(`${API_BASE}/reports/recent-alerts?limit=20`);
                const alerts = await response.json();

                const container = document.getElementById('alertHistory');
                
                if (alerts.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无告警历史</div>';
                    return;
                }

                const sortedAlerts = alerts
                    .sort((a, b) => new Date(b.alertTime) - new Date(a.alertTime))
                    .slice(0, 20);

                container.innerHTML = sortedAlerts.map(alert => `
                    <div class="history-item ${alert.handled ? 'handled' : ''}">
                        <div class="history-header">
                            <span class="history-type">${alert.alertType || '疲劳告警'}</span>
                            <span class="history-time">${formatTime(alert.alertTime)}</span>
                        </div>
                        <div class="history-info">
                            <span>👤 ${alert.driverName || alert.driverNo}</span>
                            <span>🚌 ${alert.busNo || '未知'}</span>
                            <span>📊 ${alert.count || 0}次</span>
                            ${alert.handled ? '<span>✓ 已处理</span>' : '<span>⚠️ 待处理</span>'}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载告警历史失败:', error);
                document.getElementById('alertHistory').innerHTML = 
                    '<div class="empty-state">加载失败</div>';
            }
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN');
        }

        function init() {
            initDates();
            loadReports();
            initWebSocket();
            
            setInterval(refreshAllData, 10000);
        }

        init();
    </script>
</body>
</html>

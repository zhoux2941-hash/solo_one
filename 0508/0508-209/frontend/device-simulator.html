<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车载设备模拟器 - 司机疲劳驾驶预警系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4fc3f7;
        }

        .header h1 {
            font-size: 24px;
            color: #4fc3f7;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .nav a:hover, .nav a.active {
            background: #4fc3f7;
            color: #1a1a2e;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        .control-panel {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .control-panel h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        .status-toggles {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            padding: 15px 25px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #1a1a2e;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn.active.yawning {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
            color: #e94560;
        }

        .toggle-btn.active.eye-closed {
            background: rgba(255, 152, 0, 0.2);
            border-color: #ff9800;
            color: #ff9800;
        }

        .toggle-btn.active.distracted {
            background: rgba(156, 39, 176, 0.2);
            border-color: #9c27b0;
            color: #9c27b0;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
        }

        .toggle-btn .icon {
            font-size: 20px;
        }

        .simulation-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-start {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #e94560 0%, #d6324d 100%);
            color: #fff;
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            animation: none;
        }

        .status-dot.active {
            background: #4caf50;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-text {
            font-size: 14px;
            color: #aaa;
        }

        .interval-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .interval-control label {
            color: #aaa;
            font-size: 14px;
        }

        .interval-control input {
            width: 80px;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
        }

        .data-panel {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid #333;
        }

        .data-panel h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #4fc3f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .packet-count {
            font-size: 14px;
            color: #aaa;
            font-weight: normal;
        }

        .data-log {
            background: #0a0a14;
            border-radius: 10px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 15px;
        }

        .log-time {
            color: #4fc3f7;
            white-space: nowrap;
        }

        .log-driver {
            color: #4caf50;
            white-space: nowrap;
        }

        .log-status {
            display: flex;
            gap: 8px;
        }

        .status-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .status-tag.yawn {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
        }

        .status-tag.eye {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }

        .status-tag.distracted {
            background: rgba(156, 39, 176, 0.2);
            color: #9c27b0;
        }

        .status-tag.normal {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .log-success {
            color: #4caf50;
        }

        .log-error {
            color: #e94560;
        }

        .face-preview {
            background: #0a0a14;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .face-preview .face {
            font-size: 80px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .face-preview .face.yawning {
            transform: scaleY(1.2);
        }

        .face-preview .face.eye-closed {
            filter: brightness(0.7);
        }

        .face-preview .status-text {
            font-size: 16px;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a14;
        }

        ::-webkit-scrollbar-thumb {
            background: #4fc3f7;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚍 车载设备模拟器</h1>
        <div class="nav">
            <a href="dashboard.html">监控中心</a>
            <a href="device-simulator.html" class="active">车载模拟</a>
            <a href="reports.html">报表统计</a>
        </div>
    </div>

    <div class="container">
        <div class="control-panel">
            <h2>设备控制</h2>
            
            <div class="row">
                <div class="form-group">
                    <label>选择司机</label>
                    <select id="driverSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>车牌号</label>
                    <input type="text" id="busNo" value="京A12345" readonly>
                </div>
            </div>

            <div class="face-preview">
                <div class="face" id="facePreview">😐</div>
                <div class="status-text" id="faceStatus">正常状态</div>
            </div>

            <div class="status-toggles">
                <button class="toggle-btn yawning" onclick="toggleStatus('yawning')">
                    <span class="icon">🥱</span>
                    <span>打哈欠</span>
                </button>
                <button class="toggle-btn eye-closed" onclick="toggleStatus('eyeClosed')">
                    <span class="icon">😴</span>
                    <span>闭眼</span>
                </button>
                <button class="toggle-btn distracted" onclick="toggleStatus('distracted')">
                    <span class="icon">👀</span>
                    <span>分心</span>
                </button>
            </div>

            <div class="simulation-controls">
                <button class="btn btn-start" id="startBtn" onclick="startSimulation()">▶ 开始模拟</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopSimulation()" disabled>⏹ 停止模拟</button>
                
                <div class="interval-control">
                    <label>上报间隔(秒):</label>
                    <input type="number" id="interval" value="2" min="1" max="10">
                </div>

                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">已停止</span>
                </div>
            </div>
        </div>

        <div class="data-panel">
            <h2>
                数据上报日志
                <span class="packet-count" id="packetCount">已发送: 0 包</span>
            </h2>
            <div class="data-log" id="dataLog">
                <div style="text-align: center; color: #666; padding: 50px;">
                    等待开始模拟...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let isRunning = false;
        let simulationInterval = null;
        let packetCount = 0;
        let status = {
            yawning: false,
            eyeClosed: false,
            distracted: false
        };

        async function loadDrivers() {
            try {
                const response = await fetch(`${API_BASE}/drivers`);
                const drivers = await response.json();
                
                const select = document.getElementById('driverSelect');
                select.innerHTML = drivers.map(d => 
                    `<option value="${d.driverNo}" data-bus="${d.busNo}">${d.driverNo} - ${d.name} (${d.busNo})</option>`
                ).join('');
                
                if (drivers.length > 0) {
                    document.getElementById('busNo').value = drivers[0].busNo;
                }
            } catch (error) {
                console.error('加载司机列表失败:', error);
                document.getElementById('driverSelect').innerHTML = '<option value="">加载失败</option>';
            }
        }

        document.getElementById('driverSelect').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const busNo = selected.getAttribute('data-bus');
            document.getElementById('busNo').value = busNo || '';
        });

        function toggleStatus(type) {
            status[type] = !status[type];
            const btn = document.querySelector(`.toggle-btn.${type === 'eyeClosed' ? 'eye-closed' : type}`);
            btn.classList.toggle('active', status[type]);
            updateFacePreview();
        }

        function updateFacePreview() {
            const face = document.getElementById('facePreview');
            const statusText = document.getElementById('faceStatus');
            
            face.className = 'face';
            
            if (status.yawning && status.eyeClosed) {
                face.textContent = '😫';
                face.classList.add('yawning', 'eye-closed');
                statusText.textContent = '极度疲劳 - 频繁打哈欠 + 闭眼';
            } else if (status.yawning) {
                face.textContent = '🥱';
                face.classList.add('yawning');
                statusText.textContent = '疲劳 - 打哈欠';
            } else if (status.eyeClosed) {
                face.textContent = '😴';
                face.classList.add('eye-closed');
                statusText.textContent = '疲劳 - 闭眼';
            } else if (status.distracted) {
                face.textContent = '👀';
                statusText.textContent = '分心驾驶';
            } else {
                face.textContent = '😐';
                statusText.textContent = '正常状态';
            }
        }

        function startSimulation() {
            const driverNo = document.getElementById('driverSelect').value;
            if (!driverNo) {
                alert('请先选择司机！');
                return;
            }

            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusDot').classList.add('active');
            document.getElementById('statusText').textContent = '正在运行...';

            const interval = parseInt(document.getElementById('interval').value) * 1000;
            
            sendData();
            simulationInterval = setInterval(sendData, interval);
        }

        function stopSimulation() {
            isRunning = false;
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
            }
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusDot').classList.remove('active');
            document.getElementById('statusText').textContent = '已停止';
        }

        async function sendData() {
            if (!isRunning) return;

            const driverNo = document.getElementById('driverSelect').value;
            const busNo = document.getElementById('busNo').value;
            
            const data = {
                driverNo: driverNo,
                busNo: busNo,
                yawning: status.yawning ? Math.random() > 0.3 : false,
                eyeClosed: status.eyeClosed ? Math.random() > 0.3 : false,
                distracted: status.distracted ? Math.random() > 0.3 : false,
                eyeAspectRatio: status.eyeClosed ? 0.1 + Math.random() * 0.15 : 0.25 + Math.random() * 0.1,
                mouthOpenness: status.yawning ? 0.7 + Math.random() * 0.3 : 0.1 + Math.random() * 0.2
            };

            try {
                const response = await fetch(`${API_BASE}/device/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                addLogEntry(data, result.success);
            } catch (error) {
                addLogEntry(data, false);
                console.error('上报数据失败:', error);
            }
        }

        function addLogEntry(data, success) {
            packetCount++;
            document.getElementById('packetCount').textContent = `已发送: ${packetCount} 包`;

            const log = document.getElementById('dataLog');
            
            if (packetCount === 1) {
                log.innerHTML = '';
            }

            const statusTags = [];
            if (data.yawning) statusTags.push('<span class="status-tag yawn">打哈欠</span>');
            if (data.eyeClosed) statusTags.push('<span class="status-tag eye">闭眼</span>');
            if (data.distracted) statusTags.push('<span class="status-tag distracted">分心</span>');
            if (statusTags.length === 0) statusTags.push('<span class="status-tag normal">正常</span>');

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">${new Date().toLocaleTimeString()}</span>
                <span class="log-driver">${data.driverNo}</span>
                <span class="log-status">${statusTags.join('')}</span>
                <span class="${success ? 'log-success' : 'log-error'}">${success ? '✓ 发送成功' : '✗ 发送失败'}</span>
            `;

            log.insertBefore(entry, log.firstChild);

            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        loadDrivers();
    </script>
</body>
</html>

server.port=8080

spring.application.name=driver-fatigue-monitor

spring.datasource.url=jdbc:h2:mem:fatiguedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

fatigue.alert.yawn-threshold=3
fatigue.alert.eye-close-threshold=5
fatigue.alert.distraction-threshold=4
fatigue.alert.time-window-seconds=60

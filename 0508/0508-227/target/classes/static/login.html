<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 企业综合办公平台</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 28px;
            color: #303133;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #909399;
            font-size: 14px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
        }
        .login-tips {
            margin-top: 20px;
            padding: 15px;
            background: #f5f7fa;
            border-radius: 6px;
            font-size: 13px;
            color: #606266;
        }
        .login-tips p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>企业综合办公平台</h1>
            <p>欢迎登录，请输入账号密码</p>
        </div>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary login-btn">登 录</button>
        </form>
        <div class="login-tips">
            <p><strong>管理员账号：</strong>admin / admin123</p>
            <p><strong>员工账号：</strong>zhangsan / 123456</p>
        </div>
    </div>

    <script src="js/request.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const result = await api.auth.login({ username, password });
                showToast('登录成功', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
            } catch (error) {
                console.error('Login failed:', error);
            }
        });
    </script>
</body>
</html>

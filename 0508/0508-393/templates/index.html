<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波斯地毯 · 伊斯兰几何图案设计工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="app-header">
        <div class="header-content">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 36 36">
                    <polygon points="18,2 22,14 34,14 24,22 28,34 18,26 8,34 12,22 2,14 14,14" fill="none" stroke="#d4a574" stroke-width="1.5"/>
                    <polygon points="18,8 20,14 26,14 21,18 23,24 18,20 13,24 15,18 10,14 16,14" fill="none" stroke="#c62828" stroke-width="1"/>
                </svg>
                <h1>波斯几何 <span>Islamic Geometric Pattern Designer</span></h1>
            </div>
            <nav class="header-nav">
                <button id="btn-export-svg" class="nav-btn" title="导出SVG">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    SVG
                </button>
                <button id="btn-export-pdf" class="nav-btn" title="导出PDF">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                    PDF
                </button>
            </nav>
        </div>
    </header>

    <main id="app-main">
        <aside id="sidebar-left" class="sidebar">
            <section class="panel">
                <h2 class="panel-title">基础图样</h2>
                <div id="pattern-list" class="pattern-grid"></div>
            </section>

            <section class="panel">
                <h2 class="panel-title">伊斯法罕经典</h2>
                <div id="isfahan-presets" class="preset-list"></div>
            </section>

            <section class="panel">
                <h2 class="panel-title">对称参数</h2>
                <div class="control-group">
                    <label>对称群类型</label>
                    <div class="symmetry-toggle">
                        <button id="btn-dn" class="toggle-btn active" data-type="D">D<sub>n</sub> 二面体群</button>
                        <button id="btn-cn" class="toggle-btn" data-type="C">C<sub>n</sub> 循环群</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>旋转对称次数 <span id="n-display">10</span></label>
                    <input type="range" id="symmetry-n" min="2" max="12" value="10" step="1">
                </div>
                <div class="control-group">
                    <label>图案缩放 <span id="scale-display">1.0</span></label>
                    <input type="range" id="pattern-scale" min="0.3" max="2.0" value="1.0" step="0.1">
                </div>
                <div class="control-group">
                    <label>平铺模式</label>
                    <select id="tiling-mode">
                        <option value="single">单中心</option>
                        <option value="radial">径向平铺</option>
                        <option value="grid">网格平铺</option>
                        <option value="carpet">地毯全幅</option>
                    </select>
                </div>
            </section>
        </aside>

        <section id="canvas-area">
            <canvas id="main-canvas"></canvas>
            <div id="canvas-overlay" class="hidden">
                <div class="overlay-content">
                    <p>正在渲染图案...</p>
                </div>
            </div>
        </section>

        <aside id="sidebar-right" class="sidebar">
            <section class="panel">
                <h2 class="panel-title">配色方案</h2>
                <div class="control-group">
                    <label>背景色</label>
                    <div class="color-input-row">
                        <input type="color" id="color-bg" value="#1a237e" class="color-picker">
                        <span class="color-hex" id="hex-bg">#1a237e</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>主色</label>
                    <div class="color-input-row">
                        <input type="color" id="color-primary" value="#c62828" class="color-picker">
                        <span class="color-hex" id="hex-primary">#c62828</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>辅色</label>
                    <div class="color-input-row">
                        <input type="color" id="color-secondary" value="#d4a574" class="color-picker">
                        <span class="color-hex" id="hex-secondary">#d4a574</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>点缀色</label>
                    <div class="color-input-row">
                        <input type="color" id="color-accent" value="#f5f0e8" class="color-picker">
                        <span class="color-hex" id="hex-accent">#f5f0e8</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>轮廓色</label>
                    <div class="color-input-row">
                        <input type="color" id="color-outline" value="#1a1a2e" class="color-picker">
                        <span class="color-hex" id="hex-outline">#1a1a2e</span>
                    </div>
                </div>
                <div class="preset-colors">
                    <span class="preset-label">传统色板：</span>
                    <div class="color-swatches">
                        <button class="swatch" data-color="#1a237e" style="background:#1a237e" title="深蓝"></button>
                        <button class="swatch" data-color="#0d47a1" style="background:#0d47a1" title="钴蓝"></button>
                        <button class="swatch" data-color="#c62828" style="background:#c62828" title="胭脂红"></button>
                        <button class="swatch" data-color="#b71c1c" style="background:#b71c1c" title="深红"></button>
                        <button class="swatch" data-color="#d4a574" style="background:#d4a574" title="驼色"></button>
                        <button class="swatch" data-color="#8d6e63" style="background:#8d6e63" title="赭色"></button>
                        <button class="swatch" data-color="#f5f0e8" style="background:#f5f0e8" title="象牙白"></button>
                        <button class="swatch" data-color="#e8d5b7" style="background:#e8d5b7" title="米色"></button>
                        <button class="swatch" data-color="#2e7d32" style="background:#2e7d32" title="墨绿"></button>
                        <button class="swatch" data-color="#4a148c" style="background:#4a148c" title="深紫"></button>
                        <button class="swatch" data-color="#ff8f00" style="background:#ff8f00" title="琥珀黄"></button>
                        <button class="swatch" data-color="#1a1a2e" style="background:#1a1a2e" title="墨色"></button>
                    </div>
                </div>
                <button id="btn-save-colors" class="action-btn">保存当前配色</button>
            </section>

            <section class="panel">
                <h2 class="panel-title">配色历史</h2>
                <div id="color-history" class="history-list"></div>
            </section>

            <section class="panel">
                <h2 class="panel-title">对称群说明</h2>
                <div id="symmetry-info" class="info-text">
                    <div id="symmetry-detail"></div>
                </div>
            </section>
        </aside>
    </main>

    <footer id="app-footer">
        <p>波斯地毯伊斯兰几何图案设计工具 · 基于群论对称变换</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
